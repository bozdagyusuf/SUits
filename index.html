<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F7F7FA; --sunken:#EDEDF2;
  --ink:#111114; --muted:#6C6C74; --faint:#A0A0A8;
  --line:#E6E6EC; --line2:#D6D6DE;
  --accent:#0A7CFF; --accent-ink:#FFFFFF; --accent-soft:#E4F0FF;
  --ok:#1E8E4A; --ok-soft:#E1F5E8;
  --warn:#A26A00; --warn-soft:#FDF0D8;
  --bad:#C7362B; --bad-soft:#FCE6E4;
  --shadow-sm:0 1px 2px rgba(16,18,26,.05);
  --shadow:0 1px 2px rgba(16,18,26,.05), 0 8px 22px -14px rgba(16,18,26,.28);
  --r-card:16px; --r-chip:8px;
  --c1:#0A7CFF; --c2:#8E52D6; --c3:#E07B1E; --c4:#22A06B; --c5:#E0457B; --c6:#4B5BD7;
  --c7:#B08300; --c8:#0E9FB5; --c9:#7A45B5; --c10:#D2453A; --blk-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#141416; --surface2:#1C1C1F; --sunken:#242427;
    --ink:#F2F2F7; --muted:#9A9AA2; --faint:#6E6E76;
    --line:#2A2A2E; --line2:#3A3A40;
    --accent:#3B93FF; --accent-ink:#04121F; --accent-soft:#132840;
    --ok:#45C57A; --ok-soft:#102A1B;
    --warn:#E0AC48; --warn-soft:#2E2410;
    --bad:#F0685C; --bad-soft:#331613;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
    --c1:#4FA3FF; --c2:#B98CE8; --c3:#F0A050; --c4:#4FC48C; --c5:#F07AA5; --c6:#8090EE;
    --c7:#DCBB4A; --c8:#4EC0D2; --c9:#B08AE0; --c10:#F0766A; --blk-ink:#0A0A0C;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#141416; --surface2:#1C1C1F; --sunken:#242427;
  --ink:#F2F2F7; --muted:#9A9AA2; --faint:#6E6E76;
  --line:#2A2A2E; --line2:#3A3A40;
  --accent:#3B93FF; --accent-ink:#04121F; --accent-soft:#132840;
  --ok:#45C57A; --ok-soft:#102A1B;
  --warn:#E0AC48; --warn-soft:#2E2410;
  --bad:#F0685C; --bad-soft:#331613;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
  --c1:#4FA3FF; --c2:#B98CE8; --c3:#F0A050; --c4:#4FC48C; --c5:#F07AA5; --c6:#8090EE;
  --c7:#DCBB4A; --c8:#4EC0D2; --c9:#B08AE0; --c10:#F0766A; --blk-ink:#0A0A0C;
}

*{box-sizing:border-box}
/* display:flex verilen kutular hidden iken de yer kaplıyordu: boş havuz
   başlığı ve boş kırmızı hata şeridi her açılışta görünüyordu */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.02em; text-wrap:balance}
.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer; letter-spacing:inherit}
input,select,textarea{font:inherit; letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

.wrap{max-width:1300px; margin:0 auto; padding:0 20px 72px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1300px; margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand h1{font-size:20px; font-weight:700; letter-spacing:-.03em}
.brand .sub{font-size:12px; color:var(--faint); font-weight:450; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.counter{
  font-size:12.5px; font-weight:600;
  padding:5px 9px; border-radius:999px; background:var(--sunken); color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.counter.full{background:var(--accent-soft); color:var(--accent)}
.counter.over{background:var(--bad-soft); color:var(--bad)}
/* üst barda dört seçim daha var: buradaki düğmeler biraz daha dar dursun ki
   başlık 1300px'lik yerleşimde tek satırda kalsın */
.top-in .btn{padding:7px 12px}

.btn{
  border:0; background:var(--sunken); color:var(--ink);
  padding:7px 14px; border-radius:999px; font-size:13.5px; font-weight:550;
  transition:background .14s ease, transform .08s ease, opacity .14s;
}
.btn:hover{background:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent); opacity:.88}
.btn.tiny{padding:4px 10px; font-size:12px}

/* ---- kullanım rehberi ---- */
.helpbtn{
  border:0; background:var(--sunken); color:var(--muted);
  width:26px; height:26px; border-radius:999px; font-size:14px; font-weight:650;
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  transition:background .14s ease, color .14s ease;
}
.helpbtn:hover{background:var(--line2); color:var(--ink)}
.gd{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  padding:20px; background:rgba(16,18,26,.42); backdrop-filter:saturate(140%) blur(3px);
  animation:gdIn .18s ease;
}
:root:not([data-theme="light"]) .gd, :root[data-theme="dark"] .gd{background:rgba(0,0,0,.6)}
@keyframes gdIn{from{opacity:0}to{opacity:1}}
.gdcard{
  position:relative; width:min(520px, 100%); max-height:calc(100dvh - 40px); overflow:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card);
  box-shadow:var(--shadow); animation:gdUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes gdUp{from{transform:translateY(10px) scale(.98); opacity:0}to{transform:none; opacity:1}}
.gdclose{
  position:absolute; top:10px; right:10px; z-index:2; border:0; background:var(--surface2); color:var(--muted);
  width:28px; height:28px; border-radius:999px; font-size:17px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.gdclose:hover{background:var(--sunken); color:var(--ink)}
.gdart{
  background:var(--surface2); border-bottom:1px solid var(--line);
  border-radius:var(--r-card) var(--r-card) 0 0; padding:18px 20px 14px;
}
.gdart svg{display:block; width:100%; height:auto; max-height:170px}
.gdbody{padding:16px 20px 4px}
.gdstep{font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.02em; margin-bottom:6px}
.gdtitle{font-size:17px; margin-bottom:6px}
.gdtext{margin:0; color:var(--muted); font-size:14px; line-height:1.5; min-height:84px}
.gdfoot{display:flex; align-items:center; gap:10px; padding:12px 20px 16px}
.gddots{display:flex; gap:5px; flex:1 1 auto; flex-wrap:wrap}
.gddot{width:6px; height:6px; border-radius:999px; background:var(--line2); border:0; padding:0}
.gddot.on{background:var(--accent); width:16px}
.gdacts{display:flex; gap:6px; align-items:center}
@media (max-width:560px){
  .gd{padding:0; align-items:flex-end}
  .gdcard{width:100%; max-height:92dvh; border-radius:18px 18px 0 0}
  .gdart{border-radius:18px 18px 0 0; padding:16px 16px 12px}
  .gdbody{padding:14px 16px 2px} .gdfoot{padding:10px 16px 14px}
  .gdtext{min-height:96px}
}

.langsw, .modesw{display:inline-flex; background:var(--sunken); border-radius:9px; padding:2px; gap:2px}
.langsw button, .modesw button{
  border:0; background:transparent; color:var(--muted);
  padding:4px 11px; font-size:12.5px; font-weight:550; border-radius:7px;
  transition:background .16s, color .16s, box-shadow .16s;
}
.langsw button.on, .modesw button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.srcchip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:999px; border:0; background:var(--sunken); color:var(--muted)}
.srcchip:hover{color:var(--ink)}
.srcchip .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.srcchip.live .dot{background:var(--ok)}
.srcchip.loading .dot{background:var(--warn)}
.limitbox{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--muted)}
.limitbox .rng{color:var(--faint); font-size:12px; margin:0 -1px}
.limitbox .sep{width:1px; height:15px; background:var(--line); margin:0 3px}
/* üst barda dört seçim var, dar tutulmazsa başlık ikinci satıra kaçıyor */
.limitbox select{
  padding:6px 5px; padding-right:18px;
  background-position:calc(100% - 10px) 52%, calc(100% - 6px) 52%;
}
.limitbox select, .ctrow select, .currow select, #subj, #lvl, #cat, .instsel, .secsel{
  border:0; background:var(--sunken); color:var(--ink);
  border-radius:9px; padding:6px 9px; font-size:13px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%, calc(100% - 9px) 52%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat; padding-right:26px;
}

/* ---------- hata ekrani ---------- */
.errbox{
  margin:18px 0 0; padding:16px 18px; border-radius:var(--r-card);
  background:var(--bad-soft); border:1px solid color-mix(in srgb, var(--bad) 32%, transparent);
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
}
.errbox .errmain{flex:1; min-width:240px}
.errbox .errtitle{font-size:16px; font-weight:700; color:var(--bad); letter-spacing:-.01em}
.errbox .errbody{font-size:13px; color:var(--ink); margin-top:5px; line-height:1.55}
.errbox .erracts{display:flex; gap:8px; flex-wrap:wrap}
.errbox .erracts .btn{background:var(--surface)}
.errbox .erracts .btn.primary{background:var(--bad); color:#fff}

/* sınır uyarısı: sessizce hiçbir şey olmaması yerine görünür tek satır */
.capnote{
  margin:14px 0 0; padding:11px 14px; border-radius:14px;
  background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 34%, transparent);
  color:var(--ink); font-size:13px; line-height:1.5;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.capnote #capText{flex:1; min-width:200px}
.capnote .btn{background:var(--surface); flex:none}

/* ---------- manuel mod ---------- */
/* Manuel listede her dersin tüm section'ları var; liste 7000 piksele çıkıp
   sayfayı uzatıyor, program yukarıda kalıyordu. Liste kendi içinde kaysın:
   sağdaki program ekranda kalır. */
.mbody{max-height:calc(100dvh - var(--railtop, 74px) - 92px); overflow-y:auto; overscroll-behavior:contain}
.mcourse{border-bottom:1px solid var(--line)}
.mcourse:last-child{border-bottom:0}
.mhead{display:flex; align-items:center; gap:8px; padding:11px 16px; cursor:pointer; background:var(--surface)}
.mhead:hover{background:var(--surface2)}
.mhead .swatch{width:3px; align-self:stretch; border-radius:999px; flex:none}
.mhead .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:650}
.mhead .cnt{margin-left:auto; font-size:11.5px; color:var(--faint)}
.mhead .car{color:var(--faint); font-size:11px; transition:transform .15s}
.mcourse.open .mhead .car{transform:rotate(90deg)}
.mtype{padding:2px 16px 8px}
.mtype .tlbl{font-size:11px; font-weight:650; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; margin:6px 0 4px}
.msec{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:7px 9px; margin-bottom:5px; cursor:pointer;
  font-size:12px; transition:border-color .14s, background .14s;
}
.msec.on{border-color:var(--accent); background:var(--accent-soft)}
.msec.clash{border-color:var(--bad); background:var(--bad-soft)}
.msec .g{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:650; flex:none; min-width:34px}
.msec .tm{color:var(--muted); flex:1; min-width:0}
.msec .lk{
  flex:none; border:0; background:transparent; cursor:pointer; font-size:13px;
  opacity:.35; padding:2px 3px; border-radius:6px; line-height:1;
}
@media (hover: hover) and (pointer: fine){
  .msec:hover{border-color:var(--accent)}
  .msec .lk:hover{opacity:.9; background:var(--sunken)}
}
.msec .lk.on{opacity:1}
.seclock{
  flex:none; border:0; background:transparent; cursor:pointer; font-size:14px;
  opacity:.32; padding:3px 5px; border-radius:7px; line-height:1;
}
.seclock:hover{opacity:.85; background:var(--sunken)}
.seclock.on{opacity:1}

/* ---------- verdict ---------- */
.verdict{
  margin:20px 0 0; padding:20px 22px; border-radius:var(--r-card);
  background:var(--surface); box-shadow:var(--shadow);
  display:flex; gap:20px; align-items:center; flex-wrap:wrap; position:relative; overflow:hidden;
}
.verdict::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line2)}
.verdict.ok::before{background:var(--ok)}
.verdict.warn::before{background:var(--warn)}
.verdict.bad::before{background:var(--bad)}
.v-main{flex:1 1 320px; min-width:0}
.v-title{font-size:23px; font-weight:700; letter-spacing:-.03em}
.v-sub{color:var(--muted); font-size:14px; margin-top:4px}
/* çakışma tanısı: doğrulanmış çözüm düğmeleri */
.vfix{margin-top:12px}
.vfix .fxl{font-size:12px; font-weight:650; color:var(--muted); margin-bottom:6px}
.vfix .fxr{display:flex; gap:7px; flex-wrap:wrap}
.vfix .fx{
  border:1px solid var(--line2); background:var(--surface); color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:550;
  transition:border-color .14s, background .14s;
}
.vfix .fx:hover{border-color:var(--accent); color:var(--accent)}
.vfix .fx .mono{font-size:12.5px}
.vfix .fxn{font-size:12px; color:var(--faint); margin-top:6px}
.v-stats{display:flex; gap:26px; flex-wrap:wrap}
.stat{min-width:74px}
.stat .n{font-size:26px; font-weight:680; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .l{font-size:11px; color:var(--faint); font-weight:500; margin-top:2px}
.v-sub .bd{margin-top:12px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.mix{
  display:inline-flex; align-items:baseline; gap:5px; font-size:12px; font-weight:550;
  padding:5px 11px 5px 8px; border-radius:999px; background:var(--sunken); color:var(--muted);
}
.mix b{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.mix.must{background:var(--accent-soft); color:var(--accent); font-weight:650}
.mix.maybe{background:var(--sunken); color:var(--muted)}
.mix.required{background:#E07B1E1E; color:#B36414}
.mix.core{background:#0A7CFF1E; color:#0A6ADB}
.mix.area{background:#8E52D61E; color:#7442B5}
.mix.university{background:#22A06B1E; color:#1B825A}
.mix.free{background:var(--sunken); color:var(--muted)}
.mix.out{background:var(--bad-soft); color:var(--bad)}
.mix.cred{background:var(--accent-soft); color:var(--accent)}
:root:not([data-theme="light"]) .mix.required, :root[data-theme="dark"] .mix.required{background:#F0A0501E; color:#F0A050}
:root:not([data-theme="light"]) .mix.core, :root[data-theme="dark"] .mix.core{background:#4FA3FF1E; color:#4FA3FF}
:root:not([data-theme="light"]) .mix.area, :root[data-theme="dark"] .mix.area{background:#B98CE81E; color:#B98CE8}
:root:not([data-theme="light"]) .mix.university, :root[data-theme="dark"] .mix.university{background:#4FC48C1E; color:#4FC48C}
.v-sub .bdl{font-size:12px; color:var(--faint); font-weight:550; margin-right:2px}
.credchip{font-size:11px; font-weight:650; padding:3px 8px; border-radius:var(--r-chip); background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.controls{margin-top:12px; background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden}
.ctrow{display:flex; gap:12px; flex-wrap:wrap; align-items:center; padding:12px 18px; border-top:1px solid var(--line); min-height:50px}
.ctrow:first-of-type{border-top:0}
.ctrow .qlbl{font-size:12px; color:var(--faint); font-weight:600}
.ctrow .q{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.planlist{display:flex; gap:6px; flex-wrap:wrap}
.planch{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:520; padding:5px 11px; border-radius:999px; border:0; background:var(--sunken); color:var(--ink)}
.planch:hover{background:var(--line2)}
.planch.on{background:var(--accent); color:var(--accent-ink)}
.planch .x{opacity:.45; font-size:15px; line-height:1}
.planch .x:hover{opacity:1}
.planacts{margin-left:auto; display:flex; gap:7px; flex-wrap:wrap}
.planempty{font-size:13px; color:var(--faint)}
#planName{border:0; background:var(--sunken); color:var(--ink); font-size:13px; padding:6px 11px; border-radius:999px; width:130px}
#planName::placeholder{color:var(--faint)}
.dayrow{display:inline-flex; gap:5px; margin-left:2px}
.daych{border:0; background:var(--sunken); color:var(--muted); font-size:12px; font-weight:550; padding:5px 10px; border-radius:999px}
.daych:hover{background:var(--line2); color:var(--ink)}
.daych.on{background:var(--accent); color:var(--accent-ink)}
/* istenen ama tutturulamayan boş gün: mavi yerine kırmızı, nedeni altta yazar */
.daych.bad{background:var(--bad-soft); color:var(--bad)}
.prefwarn{
  flex-basis:100%; margin-top:-2px; font-size:12.5px; line-height:1.55;
  color:var(--bad); background:var(--bad-soft); border-radius:10px; padding:8px 11px;
}

/* ---------- layout ---------- */
.cols{display:grid; grid-template-columns:330px minmax(0,1fr); gap:18px; margin-top:18px; align-items:start}
@media (max-width:960px){ .cols{grid-template-columns:minmax(0,1fr)} }
/* Üst bar sabit ve yüksekliği içeriğe göre değişiyor; sol panelin yapışma
   noktası da ona göre ayarlanıyor, yoksa panelin üstü barın altında kalıyor. */
.rail{position:sticky; top:var(--railtop, 74px); min-width:0; z-index:1}
.stack{display:flex; flex-direction:column; gap:18px; min-width:0; position:relative; z-index:0}
.panel{background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden}
.panel > h2{
  font-size:13px; font-weight:650; color:var(--ink);
  padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
}
.panel > h2 > span:first-child{white-space:nowrap}
.panel > h2 .hint{margin-left:auto; display:flex; align-items:center; gap:7px; font-weight:450; color:var(--faint); font-size:12px; white-space:nowrap; min-width:0; overflow:hidden}
.panel > h2 .hint > span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pbody{padding:16px 18px}
/* ---- panelleri ok düğmesiyle katlama (her genişlikte) ----
   Düğme her zaman başlığın en sağında, kendi çerçeveli kutusunda durur;
   metinler onun altına girmesin diye ipucu kısalır (…), düğmeye de negatif
   kenar boşluğu verilmez. Oku sadece SVG döner, kutu yerinde kalır. */
.panel.foldable > h2{cursor:pointer}
.foldbtn{
  flex:none; padding:0; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  width:26px; height:26px; margin:0; border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:0 1px 2px rgba(15,23,42,.05);
  transition:background .14s, color .14s, border-color .14s, box-shadow .14s;
}
.foldbtn svg{display:block; transition:transform .2s ease}
.foldbtn:active{transform:scale(.94)}
.panel > h2 > .foldbtn{margin-left:auto}
.panel > h2 .hint ~ .foldbtn{margin-left:10px}
.panel.folded > *:not(h2){display:none}
.panel.folded > h2{border-bottom:0}
/* açıkken ok yukarı (kapat), kapalıyken aşağı (aç) */
.panel.foldable > h2 > .foldbtn svg{transform:rotate(180deg)}
.panel.folded > h2 > .foldbtn svg{transform:none}
/* ---- soldaki panel yatay katlanır: sol kenara iner, program genişler ----
   Dikey katlamada 330 piksellik sütun boş kalıyordu; kapalıyken sütun 44
   piksele düşüyor ve kazanılan yer haftalık programa gidiyor. */
@media (min-width:961px){
  .cols.railfold{grid-template-columns:44px minmax(0,1fr)}
  .cols.railfold .rail .panel.folded > h2{
    writing-mode:vertical-rl; text-orientation:mixed;
    height:auto; padding:14px 10px; gap:12px; justify-content:flex-start;
    border-bottom:0; white-space:nowrap;
  }
  .cols.railfold .rail .panel.folded > h2 > span:first-child{white-space:nowrap}
  .cols.railfold .rail .panel.folded > h2 .hint{display:none}
  .cols.railfold .rail .panel.folded > h2 .foldbtn{
    writing-mode:horizontal-tb; margin:0 0 10px; align-self:center; order:-1;
  }
  /* sol panelde hareket yatay: açıkken ok sola (kapat), kapalıyken sağa (aç) */
  .cols .rail .panel.foldable > h2 > .foldbtn svg{transform:rotate(90deg)}
  .cols .rail .panel.folded > h2 > .foldbtn svg{transform:rotate(-90deg)}
}
/* üstteki plan/tercih kutusu: ok sağ üst köşede, ilk satır altına girmesin */
.controls{position:relative}
/* ok sağ üstte duruyor: satırların sağında ona yer ayrılır, yoksa Paylaş /
   duvar kâğıdı düğmelerinin üstüne biniyor (düğme .controls'un ilk çocuğu
   olduğu için :first-child satıra hiç uymuyordu) */
.controls > .ctrow{padding-right:48px}
.ctfold{position:absolute; top:9px; right:10px; z-index:2}
.ctsum{display:none; padding:13px 16px; font-size:12.5px; color:var(--faint)}
.controls.folded .ctrow{display:none}
.controls.folded .ctsum{display:block}
.ctfold svg{transform:rotate(180deg)}
.controls.folded .ctfold svg{transform:none}
@media (hover: hover) and (pointer: fine){
  .foldbtn:hover{background:var(--sunken); color:var(--ink); border-color:var(--muted); box-shadow:0 2px 6px rgba(15,23,42,.08)}
}

/* ---------- search + pool ---------- */
.searchwrap{padding:12px 14px; border-bottom:1px solid var(--line)}
.modesw{width:100%; margin-bottom:10px}
.modesw button{flex:1}
.modesw .cnt{align-self:center; font-size:11px; font-weight:650; color:var(--muted); padding:0 8px; font-variant-numeric:tabular-nums}
/* yukarıdaki iki kural panel içindeki geçişler için; üst bardaki
   Otomatik/Manuel anahtarı kendi genişliğinde kalsın */
header.top .modesw{width:auto; margin-bottom:0}
header.top .modesw button{flex:0 0 auto}
/* üst bar ikinci satıra taşarsa ana düğme sağda kalsın */
header.top #btnAuto{margin-left:auto}
.searchrow{display:flex; gap:8px; flex-wrap:wrap}
#q{flex:1 1 100%; min-width:0; border:0; background:var(--sunken); color:var(--ink); font-size:14px; padding:9px 13px; border-radius:11px}
#q::placeholder{color:var(--faint)}
#subj{flex:0 1 100px}
#lvl{flex:0 1 108px}
#cat{flex:1 1 124px; min-width:0}
.results{max-height:300px; overflow-y:auto; border-top:1px solid var(--line)}
.res{display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px}
.res:last-child{border-bottom:0}
.res .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; font-weight:600; flex:none; width:80px}
.res .nm{color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.res .add{color:var(--accent); font-weight:600; flex:none; font-size:16px; line-height:1}
.res.have{background:var(--accent-soft)}
.res.have .code, .res.have .nm{opacity:.65}
.res .add .del{display:none}
/* "Havuzda olan derse gel, kırmızı × ile çıkar" görünümü YALNIZ gerçek imleçte.
   Dokunmatikte :hover son dokunulan satırda takılı kalıyor: ders eklendiği hâlde
   satır kırmızı × gösteriyor, kullanıcı eklenmedi sanıp tekrar basınca siliniyordu. */
@media (hover: hover) and (pointer: fine){
  .res:hover{background:var(--surface2)}
  .res.have:hover .add .chk{display:none}
  .res.have:hover .add .del{display:inline; color:var(--bad)}
  .res.have:hover{background:var(--bad-soft)}
}
.resnote{padding:10px 16px; font-size:12.5px; color:var(--faint); border-bottom:1px solid var(--line)}
.curbox{padding:12px 14px; border-bottom:1px solid var(--line)}
.currow{display:flex; gap:8px}
.currow select{flex:1; min-width:0; font-size:13px}
.curnote{font-size:12px; color:var(--faint); line-height:1.4; margin-top:8px}
.poolhead{padding:12px 18px 2px; font-size:12px; color:var(--faint); font-weight:600;
  display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap}
/* havuzun kuralı + kesin/belki grup başlıkları */
.poollaw{padding:2px 18px 10px; font-size:12px; color:var(--faint); line-height:1.45}
.poollaw b{color:var(--muted); font-weight:650}
.gsep{
  display:flex; align-items:baseline; gap:7px; padding:8px 16px 6px;
  background:var(--surface2); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1;
}
.gsep b{font-size:12px; font-weight:700; letter-spacing:-.01em}
.gsep span{font-size:11.5px; color:var(--faint)}
.gsep i{margin-left:auto; font-style:normal; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.clist{max-height:min(58vh,600px); overflow-y:auto; display:flex; flex-direction:column}
.crow{display:flex; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start}
.crow:last-child{border-bottom:0}
.crow.on{background:var(--accent-soft)}
.crow.dim{opacity:.42}
.crow input[type=checkbox]{margin:3px 0 0; accent-color:var(--accent); width:17px; height:17px; flex:none; cursor:pointer}
.crow .txt{min-width:0; flex:1}
/* 1. katman: kod, kategori ve seviye anahtarı tek hizada */
.crow .hd{display:flex; align-items:center; gap:7px; min-width:0}
.crow .hd .cnt{font-size:10.5px; color:var(--faint); margin-left:auto; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; padding-left:6px}
/* 3. katmanın sağ ucu seviye anahtarına ayrılmış. Anahtar float ile sağa
   sabitlenmiş: yanındaki metin sığdığı kadar yanına, sığmazsa altına akar;
   böylece hem anahtar hep tam görünür hem de ön koşul/hoca kırpılmaz. */
.crow .meta{display:block}
.crow .meta::after{content:""; display:block; clear:both}
.crow .meta .tiersw{float:right; margin-left:8px}
.crow .meta .mtx{margin-right:2px}
/* hoca menüsü metnin bir parçası gibi akar */
.crow .meta .instwrap{white-space:nowrap}
.crow .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:650; flex:none}
/* 2. katman: ders adı, tek satır — tamamı title'da duruyor */
.crow .nm{font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 3. katman: section/ön koşul/hoca — rozet yığını değil, sessiz gri satır.
   Hoca menüsü tıklanabilir olduğu için kırpılmıyor, gerekirse alta sarıyor. */
.crow .meta{font-size:11px; color:var(--faint); margin-top:4px; line-height:1.45}
.crow .meta .mi{white-space:nowrap}
.crow .hd .cat{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crow .swatch{width:3px; align-self:stretch; border-radius:999px; flex:none; background:transparent}
.tag{font-size:11px; font-weight:500; padding:2px 7px; border-radius:var(--r-chip); background:var(--sunken); color:var(--muted)}
/* Üç bölmeli seviye anahtarı: her seviyeye tek dokunuşla gidilir */
.tiersw{display:inline-flex; margin-left:auto; flex:none; background:var(--sunken);
  border-radius:8px; padding:2px; gap:2px}
.tiersw .tb{
  border:0; background:transparent; color:var(--faint);
  font-size:10px; font-weight:600; letter-spacing:-.015em;
  padding:2px 6px; border-radius:6px; line-height:1.35; cursor:pointer;
  transition:background .14s, color .14s;
}
.tiersw .tb.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.tiersw .tb[data-tier="must"].on{background:var(--accent); color:var(--accent-ink)}
.tiersw .tb[data-tier="pref"].on{background:var(--surface); color:var(--accent)}
.crow.must{background:color-mix(in srgb, var(--accent-soft) 60%, transparent)}
.crow.must .swatch{background:var(--accent) !important}
.crow.pref{background:color-mix(in srgb, var(--accent-soft) 28%, transparent)}
.gsep.pref b{color:var(--accent)}
/* önizleme: seçilecek section soluk ve kesik çerçeveli, geri kalan program soluklaşır */
table.sched.previewing .blk:not(.ghost){opacity:.38}
.blk.ghost{
  opacity:.9; outline:2px dashed var(--ink); outline-offset:-3px;
  animation:ghostIn .16s ease;
}
@keyframes ghostIn{from{opacity:.25; transform:scale(.97)}to{opacity:.9; transform:none}}
.hint.bad{color:var(--bad); font-weight:600}
.mix.pref{background:color-mix(in srgb, var(--accent-soft) 55%, transparent); color:var(--accent)}
.mix.over{background:var(--warn-soft); color:var(--warn); font-weight:650}
.crow input[type=checkbox]:disabled{opacity:.55; cursor:default}
.tag.r{background:var(--warn-soft); color:var(--warn)}
.tag.p{background:var(--accent-soft); color:var(--accent)}
.rm{flex:none; align-self:center; border:0; background:transparent; color:var(--faint); font-size:17px; line-height:1; width:28px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; transition:background .14s, color .14s}
/* satır vurgusu, "kesin yap" çerçevesi ve kırmızı × yalnız gerçek imleçte:
   dokunmatikte bunlar son dokunulan satırda takılı kalıp seçili gibi duruyordu */
@media (hover: hover) and (pointer: fine){
  .crow:hover{background:var(--surface2)}
  .crow.on:hover{background:var(--accent-soft)}
  .tiersw .tb:not(.on):hover{background:var(--surface); color:var(--ink)}
  .crow:hover .rm{background:var(--sunken)}
  .rm:hover{background:var(--bad) !important; color:#fff !important}
}
.instwrap{white-space:nowrap}
.instsel{
  border:0; background:transparent; color:var(--muted); font-size:11px;
  padding:0 14px 0 0; border-radius:6px; max-width:104px;
  background-position:calc(100% - 4px) 52%, calc(100% - 1px) 52%;
}
.instsel:hover{color:var(--ink)}
.cat{font-size:10px; font-weight:700; padding:2.5px 7px; border-radius:var(--r-chip); white-space:nowrap; flex:none}
.cat.required{background:#E07B1E22; color:#B36414}
.cat.core{background:#0A7CFF22; color:#0A6ADB}
.cat.area{background:#8E52D622; color:#7442B5}
.cat.university{background:#22A06B22; color:#1B825A}
.cat.free{background:var(--sunken); color:var(--muted)}
.cat.out{background:var(--bad-soft); color:var(--bad)}
:root:not([data-theme="light"]) .cat.required, :root[data-theme="dark"] .cat.required{background:#F0A05022; color:#F0A050}
:root:not([data-theme="light"]) .cat.core, :root[data-theme="dark"] .cat.core{background:#4FA3FF22; color:#4FA3FF}
:root:not([data-theme="light"]) .cat.area, :root[data-theme="dark"] .cat.area{background:#B98CE822; color:#B98CE8}
:root:not([data-theme="light"]) .cat.university, :root[data-theme="dark"] .cat.university{background:#4FC48C22; color:#4FC48C}

/* ---------- weekly grid ---------- */
.gridwrap{overflow-x:auto}
table.sched{border-collapse:separate; border-spacing:0; width:100%; min-width:680px; table-layout:fixed}
table.sched thead th{position:sticky; top:0; z-index:2}
table.sched th{font-size:12px; font-weight:600; color:var(--muted); padding:11px 6px; border-bottom:1px solid var(--line); background:var(--surface)}
table.sched th.tcol{width:64px}
table.sched td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); height:46px; padding:0; vertical-align:top; position:relative}
table.sched td:last-child{border-right:0}
table.sched tbody tr:last-child td{border-bottom:0}
table.sched td.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:var(--faint); text-align:right; padding:5px 9px 0 0; background:var(--surface2); border-right:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums}
.blk{position:absolute; inset:3px; border-radius:10px; padding:6px 8px; overflow:hidden; color:var(--blk-ink); display:flex; flex-direction:column; box-shadow:0 1px 3px rgba(0,0,0,.16)}
.blk .bc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; font-weight:650; line-height:1.2}
.blk .bm{font-size:9.5px; opacity:.8; line-height:1.25; margin-top:2px}
.blk.half{width:calc(50% - 4px)}
.blk.half2{left:50%; width:calc(50% - 4px)}
td.clash{background:repeating-linear-gradient(45deg, var(--bad-soft) 0 7px, transparent 7px 14px)}
td.clash::after{content:""; position:absolute; inset:0; border:2px solid var(--bad); border-radius:4px; pointer-events:none}

/* ---------- agenda ---------- */
.agenda{display:none; padding:4px 0 12px}
.agday{padding:12px 16px 4px}
.agd{font-size:12px; color:var(--faint); font-weight:650; margin-bottom:9px}
.agit{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; margin-bottom:7px; border-radius:12px; background:var(--surface2); border-left:3px solid var(--ac)}
.agit.clash{background:var(--bad-soft); border-left-color:var(--bad)}
.agtime{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; font-weight:650; color:var(--ink); flex:none; width:52px; line-height:1.35; font-variant-numeric:tabular-nums}
.agtime i{display:block; font-style:normal; font-weight:400; color:var(--faint); font-size:11px}
.agmain{min-width:0; display:flex; flex-direction:column; gap:2px}
.agmain b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px; font-weight:650}
.agmain span{font-size:12px; color:var(--muted); line-height:1.35}

/* ---------- sections ---------- */
.secgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.sec{border-radius:13px; padding:13px 15px; background:var(--surface2); border-left:3px solid}
.sec h3{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; font-weight:650}
.sec .cn{font-size:12.5px; color:var(--muted); margin:2px 0 3px; line-height:1.35}
.sec .who{font-size:12px; color:var(--accent); margin:0 0 9px; line-height:1.35; font-weight:500}
.sec .pre{font-size:12px; color:var(--muted); margin:0 0 9px}
.sec .pre b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); font-weight:600}
.sec .row{display:flex; gap:8px; font-size:12px; padding:5px 0; border-top:1px solid var(--line); align-items:center}
.sec .row:first-of-type{border-top:0}
.sec .k{font-size:10px; font-weight:700; color:var(--faint); width:34px; flex:none}
.sec .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; flex:none; font-variant-numeric:tabular-nums}
.sec .pl{color:var(--muted); font-size:12px; min-width:0}
.secsel{flex:1; min-width:0; font-size:12px; padding:4px 8px; padding-right:24px; background-color:var(--surface); color:var(--muted)}
.secsel:hover{color:var(--ink)}
.unpin{border:0; background:transparent; font-size:11px; padding:0 2px; line-height:1; flex:none}
.seat{margin-left:auto; flex:none; font-size:10.5px; font-weight:650; padding:2px 7px; border-radius:var(--r-chip); background:var(--ok-soft); color:var(--ok); font-variant-numeric:tabular-nums}
.seat.low{background:var(--warn-soft); color:var(--warn)}
.seat.none{background:var(--bad-soft); color:var(--bad)}

/* ---------- alternatives ---------- */
.alts{display:flex; gap:8px; flex-wrap:wrap}
.altbtn{border:0; background:var(--surface2); border-radius:12px; padding:9px 12px; font-size:12.5px; text-align:left; line-height:1.4; min-width:140px}
.altbtn:hover{background:var(--sunken)}
.altbtn.on{background:var(--accent); color:var(--accent-ink)}
.altbtn b{display:block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; font-weight:650}
.altbtn span{color:var(--faint); font-size:11px}
.altbtn.on span{color:var(--accent-ink); opacity:.75}

/* ---------- needs ---------- */

/* ---------- matrix ---------- */
.mtx{overflow-x:auto}
table.matrix{border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px}
table.matrix th{font-weight:500; color:var(--muted); padding:3px 5px; white-space:nowrap}
table.matrix th.rowh{text-align:right; padding-right:9px; color:var(--ink); font-weight:600}
table.matrix th.colh{writing-mode:vertical-rl; transform:rotate(180deg); height:78px; vertical-align:bottom; padding-bottom:5px}
table.matrix td{width:26px; height:26px; text-align:center; border:2px solid var(--surface)}
.m-ok{background:var(--ok-soft); color:var(--ok)}
.m-bad{background:var(--bad-soft); color:var(--bad); font-weight:650}
.m-self{background:var(--sunken); color:var(--faint)}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; font-size:12.5px; color:var(--muted); align-items:center}
.legend i{display:inline-block; width:11px; height:11px; border-radius:4px; margin-right:6px; vertical-align:-1px}
.note{font-size:12.5px; color:var(--muted); line-height:1.55}
.pairlist{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.pair{display:flex; align-items:center; gap:9px; font-size:12.5px; padding:8px 11px; border-radius:10px; background:var(--bad-soft)}
.pair .mono{font-weight:650; font-size:12px}
.pair .x{color:var(--bad); font-weight:700}
.pair .when{margin-left:auto; color:var(--muted); font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding:26px 20px; color:var(--faint); font-size:13.5px; line-height:1.95}
.empty b{color:var(--ink)}

/* ---------- wallpaper sheet ---------- */
.sheet{position:fixed; inset:0; z-index:80; display:none; background:rgba(10,10,14,.44); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px}
.sheet.open{display:flex}
.sheetbox{background:var(--surface); border-radius:20px; box-shadow:0 24px 70px -20px rgba(0,0,0,.5); width:min(880px,100%); max-height:92vh; overflow:auto; padding:22px}
.sheethead{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.sheethead h3{font-size:18px; font-weight:680}
.sheethead .close{margin-left:auto; border:0; background:var(--sunken); width:30px; height:30px; border-radius:999px; font-size:16px; color:var(--muted); line-height:1}
.wpwrap{display:grid; grid-template-columns:minmax(0,240px) minmax(0,1fr); gap:22px; align-items:start}
@media (max-width:640px){ .wpwrap{grid-template-columns:1fr} }
#wpCanvas{width:100%; max-width:240px; border-radius:18px; box-shadow:var(--shadow); display:block; margin:0 auto}
.wpopts{display:flex; flex-direction:column; gap:16px}
.wpgroup .glbl{font-size:12px; color:var(--faint); font-weight:600; margin-bottom:8px}
.swatches{display:flex; gap:9px; flex-wrap:wrap}
.sw{width:34px; height:34px; border-radius:999px; border:2px solid var(--line2); padding:0}
.sw.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.wprow{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.wprow label{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}

footer.foot{max-width:1300px; margin:0 auto; padding:26px 20px 44px; display:flex; gap:8px 20px; flex-wrap:wrap; font-size:12px; color:var(--faint); line-height:1.6}
footer.foot a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line2)}
footer.foot .ftabout{flex-basis:100%; margin:0 0 4px; max-width:760px; color:var(--muted)}
footer.foot a:hover{color:var(--accent); border-color:var(--accent)}

/* tek sütuna düşen genişlikler: yapışkan panel alttaki içeriğin üstüne biniyordu */
@media (max-width:960px){
  .rail{position:static; top:auto; z-index:auto}
  /* tek sütunlu düzende program zaten listenin altında: liste kendi içinde
     kaymasın, sayfayla birlikte aksın */
  .mbody{max-height:none; overflow:visible}
  header.top{position:static}
}

/* ================= mobile ================= */
@media (max-width:760px){
  body{font-size:14.5px}
  header.top{position:static}
  .srcchip{display:none}
  .wrap{padding:0 12px 56px}
  .top-in{padding:10px 12px; gap:9px}
  .brand{width:100%; justify-content:space-between; margin-right:0}
  .brand h1{font-size:18px}
  header.top .btn{flex:1 1 auto; text-align:center}
  #btnAuto{flex-basis:100%}
  .verdict{margin-top:12px; padding:16px; gap:12px}
  .v-title{font-size:19px}
  .v-stats{gap:0; width:100%; display:grid; grid-template-columns:repeat(3,1fr); row-gap:14px}
  .stat{min-width:0}
  .stat .n{font-size:21px}
  .controls{margin-top:10px}
  .ctrow{padding:11px 14px; gap:9px}
  .ctrow .qlbl{flex-basis:100%; margin-bottom:-4px}
  .planacts{margin-left:0; width:100%}
  .planacts .btn{flex:1}
  #planName{flex:1; width:auto; min-width:0}
  .cols{gap:12px; margin-top:12px}
  .panel > h2{padding:13px 14px}
  .pbody{padding:14px}
  .gridwrap{display:none}
  .agenda{display:block}
  .clist{max-height:none}
  .secgrid{grid-template-columns:1fr}
  .alts{display:grid; grid-template-columns:1fr 1fr}
  .altbtn{min-width:0}
  .sheetbox{padding:16px; border-radius:16px}
}
@media (max-width:360px){
  .alts{grid-template-columns:1fr}
  .v-stats{grid-template-columns:repeat(2,1fr)}

   iOS ferahlatma katmanı — 1a yönü (gruplu liste dili)
   ============================================================ */

  /* ---- controls ---- */

  /* ---- layout / paneller ---- */
  .cols{ grid-template-columns:352px minmax(0,1fr); gap:24px; margin-top:24px }

  .panel > h2{ font-size:15px; font-weight:600; padding:18px 22px; letter-spacing:-.012em }
  .panel > h2 .hint{ font-size:12.5px }
  .pbody{ padding:22px }

  /* ---- havuz ---- */
  .searchwrap{ padding:16px 18px }
  .modesw{ margin-bottom:12px }
  #q{ padding:11px 14px; border-radius:12px; font-size:15px }
  .results{ max-height:340px }
  .res{ padding:13px 18px; font-size:14px }
  .res .code{ font-size:13px }
  .res .nm{ font-size:13.5px }
  .curbox, .takenbox, .bulkbox{ padding:16px 18px }
  .poolhead{ padding:16px 22px 4px; font-size:12.5px }
  .clist{ max-height:min(60vh,680px) }
  .crow{ padding:11px 18px; gap:13px }
  .crow .code{ font-size:14px }
  .crow .nm{ font-size:13px; margin-top:3px }
  .crow .meta{ font-size:11.5px; margin-top:4px }
  .tiersw .tb{ font-size:11px; padding:3px 10px }
  .tag, .cat{ padding:3px 8px }
  .taken{ padding:5px 11px; font-size:12px }
  .curnote, .neednote{ font-size:12.5px }

  /* ---- haftalık program: pastel blok + renkli kenar ---- */
  table.sched th{ font-size:12.5px; padding:13px 6px }

  table.sched td.time{ font-size:11px; padding:6px 10px 0 0 }
  .blk{
    inset:4px; border-radius:12px; padding:8px 10px; color:var(--ink);

  }

    content:""; position:absolute; inset:0; z-index:0;
    background:color-mix(in srgb, var(--surface) 86%, transparent);
  }
  :root[data-theme="dark"] .blk::before{ background:color-mix(in srgb, var(--surface) 80%, transparent) }
  .blk::after{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; z-index:1;
    background:inherit;
  }
  .blk .bc, .blk .bm{ position:relative; z-index:2 }
  .blk .bc{ font-size:12px }
  .blk .bm{ font-size:10px; opacity:.62 }

  .agit{ padding:13px 14px; border-radius:14px; margin-bottom:8px }
  .agmain b{ font-size:14px }

  /* ---- şubeler / alternatifler ---- */
  .secgrid{ gap:16px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)) }
  .sec{ border-radius:16px; padding:16px 18px }
  .altbtn{ border-radius:14px; padding:11px 14px }
  .pair{ padding:10px 13px; border-radius:12px }
  .need .n{ font-size:29px }
  .sheetbox{ border-radius:26px; padding:26px 28px }
  footer.foot{ padding:32px 24px 52px }

  /* ---- katlanabilir panel düğmesi (tüm paneller) ---- */
  .panel.foldable > h2{ cursor:pointer }
  .foldbtn{ width:28px; height:28px; border-radius:10px }

  /* ---- mobil alt sekme çubuğu ---- */
  .tabbar{ display:none }
  .panel[hidden]{ display:none !important }
}

@media screen and (max-width:960px){
  .cols{ grid-template-columns:minmax(0,1fr) }
}

@media screen and (max-width:760px){

    background:color-mix(in srgb, var(--surface) 84%, transparent);

  }
  .tabbar button.on{ background:var(--accent-soft); color:var(--accent) }

  body[data-tab="pool"] .stack{ display:none }

  body[data-tab="grid"] #needPanel, body[data-tab="grid"] #mtxPanel{ display:none }

  body[data-tab="need"] .stack > #mtxPanel{ display:block }
  body[data-tab="need"] .stack > .panel[hidden]{ display:none }

/* --- üç veri biçimini de kabul eden çözümleyici ---
   A) gömülü sıkıştırılmış biçim (v2): {v,term,p,i,c:[[code,name,pre[],[[type,[[crn,sec,instIdx,seats,[[d,s,du,pIdx]]]]]]]]}
   B) bannerweb-fetch dizisi: [{subject,code,name,crn,section,type,schedule:[{days,time,where,instructors}],availability,prerequisites}]
   C) SUchedule ham biçimi: {places,instructors,courses:[{code,name,classes:[{type,sections:[…]}]}]} */
let TERM = "";
const DAYCH = {M:0, T:1, W:2, R:3, F:4, S:5, U:6};
function hour24(t){
  const m = /^(\d{1,2}):(\d{2})\s*([ap])m$/i.exec((t||"").trim());
  if (!m) return null;
  return (parseInt(m[1],10) % 12) + (m[3].toLowerCase() === "p" ? 12 : 0);
}
function normalize(json){
  // A) gömülü sıkıştırılmış
  if (json && Array.isArray(json.c) && Array.isArray(json.p)){
    const P = json.p, I = json.i || [];
    TERM = json.term || "";
    return json.c.map(([code,name,pre,classes]) => ({
      code, name, pre: pre || [],
      classes: classes.map(([type,secs]) => ({
        type,
        sections: secs.map(([crn,group,ii,seats,mt]) => ({
          crn, group, inst: ii >= 0 ? (I[ii]||"") : "",
          seats: (seats && seats.length) ? {cap:seats[0], act:seats[1]} : null,
          mt: mt.map(([d,s,du,p]) => ({d, s, du, p: P[p]||""}))
        }))
      }))
    }));
  }
  // B) bannerweb-fetch
  if (Array.isArray(json) && json.length && json[0] && json[0].crn !== undefined && json[0].subject !== undefined){
    const map = new Map();
    for (const r of json){
      const code = r.subject + " " + r.code;
      if (!TERM && r.term) TERM = r.term;
      let c = map.get(code);
      if (!c){ c = {code, name:"", pre:new Set(), cls:new Map(), cr:0}; map.set(code, c); }
      if (r.scheduleType === "Lecture" || !c.name) c.name = (r.name || "").trim();
      /* SU kredisi: recitation satırlarında 0 görünebiliyor, dersin en büyüğünü al */
      c.cr = Math.max(c.cr, +r.credits || 0);
      (r.prerequisites || []).forEach(p => c.pre.add(p));
      const mt = [];
      let inst = "";
      for (const s of (r.schedule || [])){
        const t = s.time || {};
        const a = hour24(t.from), z = hour24(t.to);
        if (!s.days || a === null || z === null) continue;
        if (!inst && (s.instructors || []).length) inst = s.instructors.join(", ");
        for (const ch of s.days){
          const d = DAYCH[ch.toUpperCase()];
          if (d === undefined) continue;
          mt.push({d, s: a-8, du: (z-9) - (a-8) + 1, p: s.where || ""});
        }
      }
      let seats = null;
      for (const a of (r.availability || [])) if (a.title === "Seats") seats = {cap:a.capacity||0, act:a.actual||0};
      const ty = r.type || "";
      if (!c.cls.has(ty)) c.cls.set(ty, []);
      c.cls.get(ty).push({crn:String(r.crn), group: r.section || "0", inst, seats, mt});
    }
    return [...map.values()].map(c => ({
      code: c.code, name: c.name || c.code, pre: [...c.pre].sort(), cr: c.cr || 0,
      classes: [...c.cls.entries()]
        .sort((a,b) => (a[0]==="" ? -1 : b[0]==="" ? 1 : a[0].localeCompare(b[0])))
        .map(([type,sections]) => ({type, sections}))
    })).sort((a,b) => a.code.localeCompare(b.code));
  }
  // C) SUchedule ham
  if (json && Array.isArray(json.courses)){
    const P = json.places || [], I = json.instructors || [];
    TERM = "";
    return json.courses.map(c => ({
      code: c.code, name: (c.name||"").trim(), pre: [],
      classes: (c.classes||[]).map(cl => ({
        type: cl.type || "",
        sections: (cl.sections||[]).map(s => ({
          crn: String(s.crn), group: s.group ?? "0",
          inst: typeof s.instructors === "number" ? (I[s.instructors]||"") : "",
          seats: null,
          mt: (s.schedule||[]).map(x => ({d:x.day, s:x.start, du:x.duration, p: P[x.place] || ""}))
        }))
      }))
    }));
  }
  throw new Error("Tanınmayan veri biçimi");
}

}

const slotStart = i => String(8+i).padStart(2,"0") + ":40";
const slotEnd   = i => String(9+i).padStart(2,"0") + ":30";
const rangeLabel = (s,du) => slotStart(s) + "–" + slotEnd(s+du-1);
const norm = s => s.toLocaleLowerCase("tr")
  .replace(/ı/g,"i").replace(/İ/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");

/* ================= section kombinasyonları (tembel) ================= */
const _opts = new Map();
/* Katalogda saati girilmemiş (TBA) section'lar var — ör. MATH 101'in "X" ders
   section'ı. Hiçbir saati doldurmadıkları için çözücü onları bedava sanıp tercih
   ediyor, program da olduğundan az saatli görünüyordu (7 derste 24 yerine 21).
   Aynı tür içinde saati belli section varsa TBA olanları eleriz; tamamı TBA ise
   (tez, staj gibi) liste olduğu gibi kalır. */
function usableSections(cls){
  const timed = cls.sections.filter(s => s.mt && s.mt.length);
  return timed.length ? timed : cls.sections;
}
/* Ders section'ı ile recitation/discussion grubunun aynı harfte olması kuralı.
   Bu kural katalogda her derste geçerli DEĞİL: IF 100'ün 3 ders section'ı var ama
   recitation harfleri A'dan N'ye gidiyor, NS 101'in A-H ders section'larının
   yalnız A-D recitation'ı var. Bu yüzden kural ders bazında açılır:
   1) dersin kodu LETTER_SUBJECTS listesinde olacak,
   2) veri iki yönlü tutarlı olacak — her alt grup bir ders harfine ait olacak ve
      her ders harfinin en az bir alt grubu olacak.
   İkinci koşul, listedeki bir ders ileride farklı adlandırılırsa kuralın sessizce
   yanlış eleme yapmasını engelliyor. */
const LETTER_SUBJECTS = ["SPS", "ECON", "FIN"];
const groupLetter = g => (norm(String(g||"")).match(/^[a-z]+/) || [""])[0];
function letterRuleApplies(course){
  if (!course || !course.classes || !ENFORCE_GROUP_LETTERS) return false;
  if (!LETTER_SUBJECTS.includes(course.code.split(" ")[0])) return false;
  if (course.classes.length < 2) return false;
  const lec = usableSections(course.classes[0]).map(s => groupLetter(s.group));
  if (!lec.length || lec.some(x => !x)) return false;
  const L = [...new Set(lec)];
  for (let i = 1; i < course.classes.length; i++){
    const subs = usableSections(course.classes[i]).map(s => groupLetter(s.group));
    if (!subs.length || subs.some(x => !x)) return false;
    if (!subs.every(x => L.includes(x))) return false;   // her alt grup bir ders harfine ait mi
    if (!L.every(x => subs.includes(x))) return false;   // her ders harfinin alt grubu var mı
  }
  return true;
}
function buildOptions(course, enforceLetters){
  const lettered = enforceLetters && letterRuleApplies(course);
  let opts = [{picks:[], mask:new Set()}];
  for (const cls of course.classes){
    const next = [];
    for (const base of opts){
      const lecG = base.picks.length ? base.picks[0].sec.group : null;
      for (const sec of usableSections(cls)){
        // ders section'ı harfliyse alt grup da aynı harfle başlamalı
        if (lecG !== null && lettered && /^[A-Za-z]+$/.test(lecG) &&
            !norm(sec.group).startsWith(norm(lecG))) continue;
        const mask = new Set(base.mask);
        let clash = false;
        for (const m of sec.mt) for (let k=0;k<m.du;k++){
          const key = m.d*NSLOT + m.s + k;
          if (mask.has(key)) clash = true;
          mask.add(key);
        }
        if (clash) continue;                 // ders kendi recit'iyle çakışıyorsa ele
        next.push({picks:[...base.picks, {cls, sec}], mask});
      }
    }
    opts = next;
  }
  return opts;
}
function optsOf(code){
  if (_opts.has(code)) return _opts.get(code);
  const c = BY[code];
  if (!c) return [];                                 // veri değişiminde bilinmeyen kod gelirse patlama
  let o = buildOptions(c, true);
  if (!o.length) o = buildOptions(c, false);        // harf kuralı her şeyi elediyse gevşet
  if (!o.length){                                    // ders kendi içinde çakışıyor: yine de göster
    const picks = c.classes.map(cls => ({cls, sec: usableSections(cls)[0]}));
    const mask = new Set();
    picks.forEach(({sec}) => sec.mt.forEach(m => { for(let k=0;k<m.du;k++) mask.add(m.d*NSLOT+m.s+k); }));
    o = [{picks, mask, selfClash:true}];
  }
  _opts.set(code, o);
  return o;
}

/* ================= ikili çakışma (tembel) ================= */
const _pair = new Map();
function pairOf(a,b){
  const key = a < b ? a+"|"+b : b+"|"+a;
  if (_pair.has(key)) return _pair.get(key);
  let best = Infinity, when = null;
  outer:
  for (const x of optsOf(a)) for (const y of optsOf(b)){
    let n = 0, first = null;
    for (const k of x.mask) if (y.mask.has(k)){ n++; if (first===null) first = k; }
    if (n < best){ best = n; when = first; if (!best) break outer; }
  }
  const r = {n:best, when};
  _pair.set(key, r);
  return r;
}

/* ================= çözücü ================= */
function score(mask){
  const perDay = {};
  for (const k of mask){ const d = Math.floor(k/NSLOT); (perDay[d] = perDay[d]||[]).push(k%NSLOT); }
  const days = Object.keys(perDay).length;
  let span = 0, gaps = 0, early = 0, weekdays = 0;
  for (const d in perDay){
    const ss = perDay[d].sort((a,b)=>a-b);
    const lo = ss[0], hi = ss[ss.length-1];
    span += hi-lo+1;
    gaps += (hi-lo+1) - new Set(ss).size;
    if (lo === 0) early++;
    if (+d <= 4) weekdays++;
  }
  // "boş gün" hafta içi üzerinden sayılır; cumartesi dersi varsa ayrıca görünür zaten
  return {days, span, gaps, early, free: 5 - weekdays};
}
const cmpM = (a,b) => a.days-b.days || a.gaps-b.gaps || a.span-b.span || a.early-b.early;

const LEAF_CAP  = 120000;
const NODE_CAP  = 3000000;      /* tek geçişte gezilecek düğüm sınırı */
const MAX_CONF  = 24;   /* çakışma bütçesinde en fazla bu kadar yukarı çıkılır */
const SOLVE_BUDGET_MS = 4000;   /* tüm bütçe turları için üst süre sınırı */

/* Tek geçiş: yalnızca çakışması <= maxConf olan dizilimleri arar.
   Bütçe baştan belli olduğu için budama ilk daldan itibaren çalışır;
   maxConf=0 geçişi herhangi bir çakışmada anında geri döner.

   Sınır YAPRAK değil DÜĞÜM sayısına konur. Yalnız yaprak saymak, budamanın
   her dalı yaprağa varmadan kestiği durumlarda hiç devreye girmiyordu: 8 ağır
   ders + dar saat aralığında çakışmasız dizilim yok, dolayısıyla yaprak da yok,
   sayaç artmıyor ve arama pratikte hiç bitmiyordu. Süre sınırı da geçişler
   ARASINDA değil, aramanın içinde denetleniyor. */
function solvePass(oc, lists, maxConf, deadline){
  const count = new Map();
  let conf = 0, leaves = 0, nodes = 0, capped = false;
  const results = [];
  const walk = (i, picks) => {
    if (capped || conf > maxConf) return;
    if (++nodes > NODE_CAP){ capped = true; return; }
    if ((nodes & 8191) === 0 && Date.now() > deadline){ capped = true; return; }
    if (i === lists.length){
      if (++leaves > LEAF_CAP){ capped = true; return; }
      if (results.length < 300){
        const mask = new Set(), conflicts = new Set();
        for (const [k,n] of count){ mask.add(k); if (n>1) conflicts.add(k); }
        results.push({codes:oc.slice(), picks:picks.slice(), mask, conflicts, c:conf, m:score(mask)});
      }
      return;
    }
    for (const opt of lists[i]){
      /* çakışmasız turda (maxConf=0) çakışan seçeneği hiç açma: sayaçlara
         dokunmadan ve düğüm harcamadan geç. Bu tur en sık çalışan tur. */
      if (maxConf === 0){
        let bad = false;
        for (const k of opt.mask) if (count.has(k)){ bad = true; break; }
        if (bad) continue;
      }
      for (const k of opt.mask){
        const n = (count.get(k)||0) + 1;
        count.set(k, n);
        if (n === 2) conf++;
      }
      picks.push(opt);
      walk(i+1, picks);
      picks.pop();
      for (const k of opt.mask){
        const n = count.get(k) - 1;
        if (n === 1) conf--;
        if (n) count.set(k, n); else count.delete(k);
      }
      if (capped) return;
    }
  };
  walk(0, []);
  return {results, capped};
}

function solve(codes){
  if (!codes.length) return null;
  // az seçenekli dersi öne al: budama daha erken devreye girer
  const order = codes.map((c,i)=>i).sort((x,y)=>allowedOpts(codes[x]).length - allowedOpts(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(allowedOpts);
  if (lists.some(l => !l.length)) return null;

  /* çakışma bütçesini 0'dan başlatıp artır: çakışmasız bir dizilim varsa
     yaprak sınırına takılmadan önce mutlaka bulunur */
  let results = [], capped = false;
  const deadline = Date.now() + SOLVE_BUDGET_MS;
  for (let maxConf = 0; maxConf <= MAX_CONF; maxConf++){
    if (maxConf && Date.now() > deadline){ capped = true; break; }
    const pass = solvePass(oc, lists, maxConf, deadline);
    if (pass.results.length){
      results = pass.results;
      /* bu seviyede sonuç bulundu; arama yalnız bu seviyede kısaldıysa
         "daha iyisi olabilir" uyarısı gerekmez, daha azı zaten elenmişti */
      capped = capped && maxConf > 0;
      break;
    }
    if (pass.capped) capped = true;   // bu seviye taranamadı, atlanmış olabilir
  }
  /* hiçbir bütçe turu sonuç veremediyse (süre/yaprak sınırı) sınırsız bütçeyle
     tek tur: kullanıcı boş ekran yerine en azından bir dizilim görür */
  if (!results.length){
    /* maxConf=Infinity: budama yok, her dal yaprağa varır, hızla döner */
    results = solvePass(oc, lists, Infinity, Date.now() + SOLVE_BUDGET_MS).results;
    capped = true;
  }
  if (!results.length) return null;

  results.sort((a,b) => a.c - b.c || cmpM(a.m, b.m));
  const out = [], seen = new Set();
  for (const r of results){
    const key = r.picks.map(p => p.picks.map(x => x.sec.crn).join("")).join("|");
    if (seen.has(key)) continue;
    seen.add(key); out.push(r);
    if (out.length >= 8) break;
  }
  out.capped = capped;
  return out;
}

/* sadece tam çakışmasız atamalar — hızlı, otomatik öneri için.
   Çok section'lı derslerde çakışmasız dizilim sayısı milyonlara çıkabildiği
   için yaprak ve süre bütçesi var: bütçe dolunca o ana kadarki en iyi
   dizilim döner, arama asla kilitlenmez. */
const CF_LEAF_CAP = 40000;
const CF_NODE_CAP = 1500000;     // düğüm sınırı: budama yaprağa hiç varmasa da arama biter
let CF_DEADLINE = Infinity;      // autoSuggest bunu her çağrıda kurar
function solveCF(codes){
  const order = codes.map((c,i)=>i).sort((x,y)=>allowedOpts(codes[x]).length - allowedOpts(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(allowedOpts);
  if (lists.some(l => !l.length)) return null;
  const mask = new Set();
  let best = null, leaves = 0, nodes = 0, stop = false;
  const walk = (i, picks) => {
    if (stop) return;
    /* sınır düğüm sayısında: çakışma budaması her dalı yaprağa varmadan
       keserse yaprak sayacı hiç artmıyor ve arama bitmiyordu */
    if (++nodes > CF_NODE_CAP){ stop = true; return; }
    if ((nodes & 8191) === 0 && Date.now() > CF_DEADLINE){ stop = true; return; }
    if (i === lists.length){
      if (++leaves > CF_LEAF_CAP){ stop = true; return; }
      const m = score(mask);
      if (!best || cmpM(m, best.m) < 0)
        best = {codes:oc.slice(), picks:picks.slice(), mask:new Set(mask), conflicts:new Set(), c:0, m};
      return;
    }
    for (const opt of lists[i]){
      let ok = true;
      for (const k of opt.mask) if (mask.has(k)){ ok = false; break; }
      if (!ok) continue;
      for (const k of opt.mask) mask.add(k);
      picks.push(opt); walk(i+1, picks); picks.pop();
      for (const k of opt.mask) mask.delete(k);
      if (stop) return;
    }
  };
  walk(0, []);
  return best;
}

const PREFS = {early:0, late:NSLOT-1, off:[]};   // en erken dilim, en geç dilim, boş kalacak günler
/* Kullanıcının istediği boş günlerin gerçekten uygulanabilen alt kümesi.
   PREFS.off istek, OFF_EFF ise çözücünün uyduğu liste. İkisi ayrı olmazsa
   "Pzt + Sal boş" gibi birlikte tutmayan bir istekte, tutabileceğimiz Pazartesi
   de elden gidiyordu. render() her turda syncOffEff() ile bunu tazeler. */
let OFF_EFF = [];
const optInWindow = opt => {
  for (const k of opt.mask){ const s = k % NSLOT; if (s < PREFS.early || s > PREFS.late) return false; }
  return true;
};
const optOffDay = (opt, days) => {
  for (const k of opt.mask) if (days.includes(Math.floor(k/NSLOT))) return true;
  return false;
};
function prefAllows(opt){ return !optOffDay(opt, OFF_EFF) && optInWindow(opt); }
const prefsActive = () => PREFS.early > 0 || PREFS.late < NSLOT-1 || PREFS.off.length > 0;
const _allow = new Map();
function allowedOpts(code){
  const key = code + "|" + PREFS.early + "|" + PREFS.late + "|" + OFF_EFF.join("") + "|" + pinKey()
            + "|" + (INSTREQ[code] || "");
  if (_allow.has(key)) return _allow.get(key);
  const pins = pinsOf(code);
  const want = INSTREQ[code];
  const base = o => (!want || (o.picks[0].sec.inst || "").includes(want)) &&
                    (!pins || o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn));
  /* Kademeli geri düşüş. Boş gün listesi uygulanabilir olduğu doğrulanmış
     olduğu için saat aralığından önce gelir: saat yüzünden boşa düşen bir ders
     boş günü de deldirmesin. Elle sabitlenen section her şeyin üstünde. */
  let r = optsOf(code).filter(o => base(o) && !optOffDay(o, OFF_EFF) && (pins || optInWindow(o)));
  if (!r.length) r = optsOf(code).filter(o => base(o) && !optOffDay(o, OFF_EFF));  // saat aralığından vazgeç
  if (!r.length) r = optsOf(code).filter(base);                                    // boş günden de vazgeç
  if (!r.length) r = optsOf(code).slice();
  _allow.set(key, r);
  return r;
}
const prefBlocked = code => allowedOpts(code).length === 0;

/* ================= "boş kalsın" tanısı =================
   allowedOpts, bir tercih o ders için hiçbir section bırakmazsa tercihi sessizce
   yok sayıyor (geri düşüş). Kullanıcı açısından bu, "Cuma boş kalsın" dedikten
   sonra Cuma'da ders görmek demek. Aşağısı o durumu yakalayıp nedenini ve
   bunun yerine hangi günlerin boşaltılabileceğini söyler. */

const baseOk = code => {
  const pins = pinsOf(code), want = INSTREQ[code];
  return o => (!want || (o.picks[0].sec.inst || "").includes(want)) &&
              (!pins || o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn));
};
/* Boş gün tanısı için seçenek listesi. Saat aralığı allowedOpts'ta ders bazında
   geri düşebildiği için burada da öyle davranır: aralığa hiç sığmayan bir ders
   yüzünden gün suçlanmasın. Boş gün kısıtında geri düşüş YOK — boşsa gerçekten
   o gün boşaltılamıyor demektir. */
function strictOpts(code, offDays){
  const ok = baseOk(code), pins = pinsOf(code);
  const inDays = o => !optOffDay(o, offDays);
  let r = optsOf(code).filter(o => ok(o) && inDays(o) && (pins || optInWindow(o)));
  if (!r.length) r = optsOf(code).filter(o => ok(o) && inDays(o));
  return r;
}
/* Saat aralığı bu ders için hiç uygulanabiliyor mu (boş günler geçerliyken)? */
function windowFits(code, offDays){
  const ok = baseOk(code);
  return optsOf(code).some(o => ok(o) && !optOffDay(o, offDays) && optInWindow(o));
}

const CF_FAIL_BUDGET = 300000, CF_ALT_BUDGET = 40000;
/* İlk çakışmasız atamayı bulunca durur — tam çözümden çok daha ucuz.
   true = yerleşir, false = yerleşmez, null = bütçe doldu, bilinmiyor.
   "Bilinmiyor"u yanlış uyarı basmaktansa sessiz kalmak için ayırıyoruz. */
function existsCF(lists, budget, stat){
  const order = lists.map((l,i)=>i).sort((a,b)=>lists[a].length-lists[b].length).map(i=>lists[i]);
  const mask = new Set();
  let found = false, steps = 0, spent = false;
  const walk = i => {
    if (found || spent) return;
    if (++steps > budget){ spent = true; return; }
    if (i === order.length){ found = true; return; }
    for (const opt of order[i]){
      let ok = true;
      for (const k of opt.mask) if (mask.has(k)){ ok = false; break; }
      if (!ok) continue;
      for (const k of opt.mask) mask.add(k);
      walk(i+1);
      for (const k of opt.mask) mask.delete(k);
      if (found || spent) return;
    }
  };
  walk(0);
  if (stat) stat.steps = steps;               // tanı için: gerçekten harcanan adım
  return found ? true : (spent ? null : false);
}

/* ================= çakışma tanısı: "ne yaparsam düzelir" =================
   Çakışma varken "bir kısıtı gevşet" demek kullanıcıya iş bırakıyor. Burada
   olası tek hamleleri tek tek deneyip yalnızca gerçekten işe yarayanları
   döndürüyoruz: hangi dersi çıkarınca, hangi hoca kısıtını ya da kilidi
   kaldırınca, ya da tercihleri bırakınca kalanlar çakışmasız yerleşiyor. */
const FIX_BUDGET = 500000;     // tüm tanı için toplam adım bütçesi
const FIX_MS = 700;            // ve duvar saati sınırı: tanı hiçbir durumda ekranı bekletmesin
let _fixKey = "", _fixRes = null, _fixLeft = 0, _fixEnd = 0;

/* code'un seçenekleri; hoca kısıtı ve/veya kilit istenirse yok sayılır */
function optsRelaxed(code, dropInst, dropPin){
  const want = dropInst ? null : INSTREQ[code];
  const pins = dropPin ? null : pinsOf(code);
  return optsOf(code).filter(o =>
    (!want || (o.picks[0].sec.inst || "").includes(want)) &&
    (!pins || o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn)));
}
/* verilen ders kümesi çakışmasız yerleşiyor mu; over: {kod: seçenek listesi} */
function fitsCF(codes, optsFn, over){
  const lists = codes.map(c => (over && over[c]) ? over[c] : optsFn(c)).filter(l => l.length);
  if (lists.length < 2) return true;
  if (_fixLeft <= 0 || Date.now() > _fixEnd) return null;
  const stat = {steps:0};
  const r = existsCF(lists, Math.min(_fixLeft, 150000), stat);
  _fixLeft -= stat.steps;                     // yalnız gerçekten harcanan düşülür
  return r;                                   // null = bilinmiyor, öneri olarak sunulmaz
}
function fixKey(codes){
  return (codes || []).filter(c => optsOf(c).length).join(",") + "#" + MUST.join(",")
       + "#" + JSON.stringify(INSTREQ) + "#" + pinKey()
       + "#" + PREFS.early + "-" + PREFS.late + "#" + OFF_EFF.join("");
}
function fixHints(codes){
  const list = (codes || []).filter(c => optsOf(c).length);
  const key = fixKey(codes);
  if (key === _fixKey) return _fixRes;
  _fixKey = key; _fixLeft = FIX_BUDGET; _fixEnd = Date.now() + FIX_MS;
  const out = {pairs:[], drops:[], relax:[], pref:false, partial:false};
  _fixRes = out;
  if (list.length < 2) return out;
  if (fitsCF(list, allowedOpts) !== false) return out;   // zaten oluyor ya da bilinmiyor
  /* 1) hiçbir kombinasyonda bir arada olmayan ikililer */
  for (let i = 0; i < list.length; i++) for (let j = i+1; j < list.length; j++){
    if (fitsCF([list[i], list[j]], allowedOpts) === false) out.pairs.push([list[i], list[j]]);
  }
  /* 2) tek ders çıkarınca oluyor mu */
  for (const c of list){
    const rest = list.filter(x => x !== c);
    if (fitsCF(rest, allowedOpts) === true) out.drops.push(c);
  }
  /* 3) hoca kısıtı / section kilidi kaldırılınca oluyor mu */
  for (const c of list){
    if (INSTREQ[c]){
      const over = {}; over[c] = optsRelaxed(c, true, false);
      if (fitsCF(list, allowedOpts, over) === true) out.relax.push({code:c, kind:"inst", name:INSTREQ[c]});
    }
    if (pinsOf(c)){
      const over = {}; over[c] = optsRelaxed(c, false, true);
      if (fitsCF(list, allowedOpts, over) === true) out.relax.push({code:c, kind:"pin"});
    }
  }
  /* 4) saat aralığı / boş gün tercihleri bırakılırsa oluyor mu */
  const prefsOn = PREFS.off.length > 0 || PREFS.early > 0 || PREFS.late < NSLOT-1;
  if (prefsOn && fitsCF(list, c => optsRelaxed(c, false, false)) === true) out.pref = true;
  out.partial = _fixLeft <= 0 || Date.now() > _fixEnd;   // bütçe bitti: liste eksik olabilir
  return out;
}

/* Bir ders o günü neden boşaltamıyor?
   "day"  → dersin o günün dışında hiç section'ı yok
   "pin"  → sabitlediğin section o güne düşüyor, ders başka gün de açılıyor
   "inst" → seçtiğin hoca yalnız o gün ders veriyor
   "other"→ kısıtlar birlikte hiçbir section bırakmıyor
   Bu ayrım olmadan "NS 101 yalnız bu gün açılıyor" gibi yanlış bir cümle
   kuruluyordu: ders Salı da açılıyor, onu Pazartesi'ye çiviley hoca kısıtıydı. */
function stuckReason(code, offDays, cand){
  const opts = optsOf(code);
  const pins = pinsOf(code), want = INSTREQ[code];
  const avoids = o => !optOffDay(o, offDays);
  const instOk = want ? (o => (o.picks[0].sec.inst || "").includes(want)) : () => true;
  const pinOk  = pins ? (o => o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn)) : () => true;
  let why;
  if (!opts.some(o => instOk(o) && pinOk(o)))            why = "other";
  else if (!opts.some(avoids))                            why = "day";
  else if (pins && !opts.some(o => avoids(o) && pinOk(o))) why = "pin";
  else if (want && !opts.some(o => avoids(o) && instOk(o))) why = "inst";
  else                                                    why = "other";
  /* günün suçlu olduğu durumda hangi bileşen çiviliyor: ders mi, recitation mı */
  const parts = (why === "day" && BY[code])
    ? BY[code].classes.filter(cl => usableSections(cl).every(s => s.mt.some(m => m.d === cand))).map(cl => cl.type)
    : [];
  return {code, why, dayOnly: why === "day", parts};
}

/* Verilen günler boşken seçili dersler yerleşiyor mu, yerleşmiyorsa hangi ders yüzünden? */
function offCheck(offDays, cand, budget){
  const stuck = [], lists = [];
  for (const c of selected){
    const r = strictOpts(c, offDays);
    if (!r.length){
      stuck.push(stuckReason(c, offDays, cand));
    } else lists.push(r);
  }
  if (stuck.length) return {ok:false, stuck};
  if (!lists.length) return {ok:true, stuck:[]};
  const r = existsCF(lists, budget);
  return {ok: r !== false, unknown: r === null, stuck:[]};   // bilinmiyorsa uyarı basma
}

const _offRep = new Map();
function offDayReport(){
  if (!selected.length || !PREFS.off.length) return {kept:PREFS.off.slice(), fails:[], alts:[]};
  const key = selected.join(",") + "|" + PREFS.off.join(",") + "|" + PREFS.early + "|" + PREFS.late
            + "|" + pinKey() + "|" + selected.map(c => INSTREQ[c] || "").join(",");
  if (_offRep.has(key)) return _offRep.get(key);

  /* tıklama sırasına saygı: önce seçilen gün, tutmayan sonrakiler elenir */
  const wanted = PREFS.off.slice();
  const okDays = [], fails = [];
  for (const d of wanted){
    /* istenen gün: doğruluk önemli, geniş bütçe */
    const r = offCheck([...okDays, d], d, CF_FAIL_BUDGET);
    if (r.ok) okDays.push(d);
    else fails.push({day:d, stuck:r.stuck, kept:okDays.slice()});
  }
  const alts = [];
  if (fails.length){
    for (let d = 0; d <= 5; d++){
      if (wanted.includes(d)) continue;
      /* öneri listesi: dar bütçe, emin olamadığımız günü hiç yazmayız */
      const r = offCheck([...okDays, d], d, CF_ALT_BUDGET);
      if (r.ok && !r.unknown) alts.push(d);
    }
  }
  const rep = {kept:okDays, fails, alts};
  if (_offRep.size > 40) _offRep.clear(); _winRep.clear();
  _offRep.set(key, rep);
  return rep;
}

/* Çözücüye girmeden önce uygulanabilir boş gün listesini tazele. */
function syncOffEff(){
  const next = offDayReport().kept;
  if (next.join(",") !== OFF_EFF.join(",")) OFF_EFF = next.slice();
}

/* ---- saat aralığı tanısı ----
   Aralık ders bazında geri düşüyor: sığmayan ders aralığın dışına taşıyor.
   Sessiz kalmak yerine hangi derslerin taşıdığını ve bu ders setinin sığdığı
   en dar aralığı söyler. */
const _winRep = new Map();
function windowReport(){
  if (!selected.length) return null;
  if (PREFS.early === 0 && PREFS.late === NSLOT-1) return null;
  const key = selected.join(",") + "|" + PREFS.early + "|" + PREFS.late + "|" + OFF_EFF.join(",")
            + "|" + pinKey() + "|" + selected.map(c => INSTREQ[c] || "").join(",");
  if (_winRep.has(key)) return _winRep.get(key);

  const stuck = selected.filter(c => !windowFits(c, OFF_EFF));
  let best = null;
  if (stuck.length){
    /* her ders için seçeneklerin (en erken dilim, en geç dilim) çiftleri;
       hepsinin sığdığı en dar [a,b] aralığını ara — 14 dilim, kaba kuvvet yeter */
    const spans = selected.map(c => {
      const ok = baseOk(c);
      const out = [];
      for (const o of optsOf(c)){
        if (!ok(o) || optOffDay(o, OFF_EFF)) continue;
        let lo = NSLOT, hi = -1;
        for (const k of o.mask){ const s = k % NSLOT; if (s < lo) lo = s; if (s > hi) hi = s; }
        if (hi >= 0) out.push([lo, hi]);
      }
      return out;
    });
    if (spans.every(s => s.length)){
      for (let a = 0; a < NSLOT; a++) for (let b = a; b < NSLOT; b++){
        if (best && (b - a) >= best.b - best.a) continue;
        if (spans.every(s => s.some(([lo,hi]) => lo >= a && hi <= b))) best = {a, b};
      }
    }
  }
  const rep = stuck.length ? {stuck, best} : null;
  if (_winRep.size > 40) _winRep.clear();
  _winRep.set(key, rep);
  return rep;
}

/* neden cümlesi dile göre kendi bağlayıcısıyla gelebilir (TR ": ", EN " — ") */
const joinReason = (head, reason) => head + (/^[\s—:]/.test(reason) ? reason : ": " + reason);
function renderPrefs(){
  const bar = document.getElementById("prefBar");
  const S = T();
  const earlyOpts = [0,1,2,3,4].map(i =>
    `<option value="${i}"${PREFS.early===i?" selected":""}>${i===0?S.prefAny:slotStart(i)}</option>`).join("");
  const lateOpts = [NSLOT-1,10,9,8,7,6].map(i =>
    `<option value="${i}"${PREFS.late===i?" selected":""}>${i===NSLOT-1?S.prefAny:slotEnd(i)}</option>`).join("");
  const rep = offDayReport();
  const badDays = rep.fails.map(f => f.day);
  const dayChips = [0,1,2,3,4,5].map(d => {
    const on = PREFS.off.includes(d);
    const cls = "daych" + (on ? (badDays.includes(d) ? " bad" : " on") : "");
    const tip = badDays.includes(d) ? ` title="${S.offFailTip}"` : "";
    return `<button class="${cls}" data-day="${d}"${tip}>${S.daysS[d]}</button>`;
  }).join("");
  const lines = [];
  if (rep.fails.length){
    /* "MATH 101 (Recitation)" — günü zorlayan bileşen belliyse onu da yaz */
    const label = x => x.parts && x.parts.length
      ? `${x.code} (${x.parts.map(t => S.types[t] || t).join(", ")})` : x.code;
    rep.fails.forEach(f => {
      const day = S.days[f.day];
      const kept = f.kept.map(d => S.days[d]).join(", ");     // bu günle birlikte tutulamayan günler
      const multi = !!kept;
      const head = multi ? S.offHeadWith(kept, day) : S.offHeadOne(day);
      const by = w => f.stuck.filter(x => x.why === w);
      if (!f.stuck.length){
        lines.push(joinReason(head, S.reasonCombo));
      } else {
        const day1 = by("day"), pin1 = by("pin"), inst1 = by("inst"), oth1 = by("other");
        if (day1.length)  lines.push(joinReason(head, S.reasonDay(day1.map(label).join(", "), multi)));
        if (pin1.length)  lines.push(joinReason(head, S.reasonPin(pin1.map(x=>x.code).join(", "))));
        if (inst1.length) lines.push(joinReason(head, S.reasonInst(inst1.map(x=>x.code).join(", "), multi)));
        if (oth1.length)  lines.push(joinReason(head, S.reasonOther(oth1.map(x=>x.code).join(", "))));
      }
    });
    /* "şu günler boş tutuluyor" cümlesi bir kez, en sonda */
    if (rep.kept.length) lines.push(S.offKept(rep.kept.map(d => S.days[d]).join(", ")));
    lines.push(rep.alts.length ? S.offAlt(rep.alts.map(d => S.days[d]).join(", ")) : S.offAltNone);
  }
  const wrep = windowReport();
  if (wrep){
    lines.push(S.winFail(slotStart(PREFS.early), slotEnd(PREFS.late), wrep.stuck.join(", ")));
    if (wrep.best) lines.push(S.winBest(slotStart(wrep.best.a), slotEnd(wrep.best.b)));
    else lines.push(S.winBestNone);
  }
  const warn = lines.length ? `<div class="prefwarn">${lines.join(" ")}</div>` : "";
  bar.innerHTML =
    `<span class="qlbl">${S.prefTitle}</span>
     <label class="q">${S.prefFrom} <select id="pEarly">${earlyOpts}</select></label>
     <label class="q">${S.prefTo} <select id="pLate">${lateOpts}</select></label>
     <span class="q">${S.prefOff} <span class="dayrow">${dayChips}</span></span>
     ${prefsActive()?`<button class="btn tiny" id="pReset">${S.prefReset}</button>`:""}
     ${warn}`;
  const save = () => { try{ localStorage.setItem("dk-prefs", JSON.stringify(PREFS)); }catch(e){} };
  bar.querySelector("#pEarly").onchange = e => { PREFS.early = +e.target.value; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
  bar.querySelector("#pLate").onchange  = e => { PREFS.late  = +e.target.value; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
  bar.querySelectorAll(".daych").forEach(btn => btn.onclick = () => {
    const d = +btn.dataset.day;
    PREFS.off = PREFS.off.includes(d) ? PREFS.off.filter(x=>x!==d) : [...PREFS.off, d];
    _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render();
  });
  const rs = bar.querySelector("#pReset");
  if (rs) rs.onclick = () => { PREFS.early=0; PREFS.late=NSLOT-1; PREFS.off=[]; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
}

/* ================= durum ================= */
let pool = [];          // aday havuzu (ders kodları)
let selected = [];      // havuzdan programa katılanlar
let MUST = [];          // "bu dönem kesin alacağım" — otomatik seçim bunları asla elemez
let PREF = [];          // "olsa iyi" — kesinin yumuşak hâli: eşit ders sayısında kayrılır,
                        //             ama program küçülecekse düşebilir
let solutions = null, altIndex = 0;

const isMust = code => MUST.includes(code);
const isPref = code => PREF.includes(code);
/* Bir ders üç seviyeden yalnız birinde olabilir: kesin / olsa iyi / belki */
const tierOf = code => isMust(code) ? "must" : isPref(code) ? "pref" : "maybe";
/* Tanı ekranındaki düğmelerin uyguladığı hamleler */
function dropCourse(code){          // seviyesini belkiye indirip programdan çıkarır, havuzda kalır
  MUST = MUST.filter(c => c !== code);
  PREF = PREF.filter(c => c !== code);
  selected = selected.filter(c => c !== code);
  altIndex = 0; save(); render();
}
function resetPrefs(){
  PREFS.early = 0; PREFS.late = NSLOT-1; PREFS.off = [];
  _allow.clear(); _offRep.clear(); _winRep.clear();
  try{ localStorage.setItem("dk-prefs", JSON.stringify(PREFS)); }catch(e){}
  altIndex = 0; render();
}
/* Kesin ders sayısı limiti aşarsa bunu sessizce düzeltmiyoruz: ikisi çelişiyor,
   kullanıcı hangisini değiştireceğine kendi karar versin (hata ekranı çıkar). */
const mustOverflow = () => MUST.length > MAXSEL;
const effMax = () => MAXSEL;

/* mod: otomatik çözücü ya da tamamen elle (SUchedule tarzı) */
let MODE = "auto";
let MANUAL = {};        // {kod: {tür: crn}} — elle seçilen section'lar
function setMust(code, on){
  if (on){
    if (!MUST.includes(code)) MUST.push(code);
    PREF = PREF.filter(c => c !== code);                 // iki seviyede birden olamaz
    if (!selected.includes(code)) selected.push(code);   // kesin ders daima programda
    /* Kesin ders sınırı aşıyorsa sınır yükselir; aşmıyorsa ama tikli belki
       dersleri yüzünden taşıyorsa en düşük seviyeden yer açılır. */
    const raised = raiseCapForMust();
    const cut = trimToCap();
    if (cut.length && !raised) capNote(T().capTrim(cut.join(", "), MAXSEL));
  } else {
    MUST = MUST.filter(c => c !== code);
  }
  altIndex = 0; save(); render();
}
function setPref(code, on){
  if (on){
    if (!PREF.includes(code)) PREF.push(code);
    MUST = MUST.filter(c => c !== code);
  } else {
    PREF = PREF.filter(c => c !== code);
  }
  altIndex = 0; save(); render();
}
/* Üç bölmeli anahtar: hangi seviyeye basılırsa doğrudan oraya geçer */
function setTier(code, tier){
  if (tierOf(code) === tier) return;
  if (tier === "must") return setMust(code, true);
  if (tier === "pref") return setPref(code, true);
  MUST = MUST.filter(c => c !== code);
  PREF = PREF.filter(c => c !== code);
  altIndex = 0; save(); render();
}
