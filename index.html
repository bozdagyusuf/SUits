function addToPool(code){
  if (pool.includes(code)) return;
  pool.push(code);
  pool.sort((a,b)=>a.localeCompare(b,"tr"));
  render();
}
function removeFromPool(code){
  pool = pool.filter(c => c !== code);
  selected = selected.filter(c => c !== code);
  MUST = MUST.filter(c => c !== code);
  PREF = PREF.filter(c => c !== code);
  altIndex = 0; render();
}
/* ================= sınırlar: tek anlam, görünür gerekçe =================
   Ders sayısı üst sınırı her yerde aynı şekilde geçerli: elle tik, kesin
   işaretleme, manuel mod ve çözücü. Sınır bir işi engellediğinde sessizce
   hiçbir şey olmuyormuş gibi durmuyor; ne olduğunu ve tek tıkla nasıl
   düzelteceğini yazıyor. */
let CAP_TIMER = 0;
function capNote(msg, actLabel, actFn){
  const box = document.getElementById("capNote");
  if (!box) return;
  document.getElementById("capText").textContent = msg;
  const btn = document.getElementById("capAct");
  btn.hidden = !actLabel;
  if (actLabel){
    btn.textContent = actLabel;
    btn.onclick = () => { hideCapNote(); if (actFn) actFn(); };
  } else btn.onclick = null;
  box.hidden = false;
  clearTimeout(CAP_TIMER);
  CAP_TIMER = setTimeout(hideCapNote, 12000);
}
function hideCapNote(){
  const box = document.getElementById("capNote");
  if (box) box.hidden = true;
  clearTimeout(CAP_TIMER);
}
/* Üst sınırın altına inerken önce en düşük seviye düşer; kesin ders asla
   çıkarılmaz. Çıkarılanların listesi geri döner ki kullanıcıya yazılabilsin. */
function trimToCap(){
  const out = [];
  const rank = c => isMust(c) ? 2 : (isPref(c) ? 1 : 0);
  while (selected.length > MAXSEL){
    let idx = -1, low = 3;
    for (let i = selected.length - 1; i >= 0; i--){
      const r = rank(selected[i]);
      if (r < low){ low = r; idx = i; if (r === 0) break; }
    }
    if (idx < 0 || low === 2) break;            // hepsi kesin: sınırı zorlamıyoruz
    out.push(selected.splice(idx,1)[0]);
  }
  return out;
}
/* Kesin ders sayısı üst sınırı geçerse sınır ona yükselir: "kesin" sözü
   sınırdan güçlü, ama bu sessizce olmuyor. */
function raiseCapForMust(){
  if (MUST.length <= MAXSEL) return false;
  const target = Math.min(SEL_HI, MUST.length);
  if (target === MAXSEL) return false;      // zaten tavanda: hata ekranı devralır
  MAXSEL = target;
  if (MINSEL > MAXSEL) MINSEL = MAXSEL;
  normalizeRanges(); syncRangeUI(); saveRanges();
  capNote(T().capMustUp(MAXSEL));
  return true;
}
function toggle(code){
  const i = selected.indexOf(code);
  if (i >= 0){
    if (isMust(code)) return;      // kesin ders programdan çıkarılamaz
    selected.splice(i,1);
  }
  else {
    /* maksimumlar sert sınır: ne ders sayısı ne kredi üstüne çıkabilir */
    const overCount = selected.length >= effMax();
    const cr = selCred() + credOf(code);
    const overCred  = MAXCR < CRED_HI && cr > MAXCR;
    if (overCount || overCred){
      const el = document.getElementById("counter");
      el.classList.add("over"); setTimeout(()=>el.classList.remove("over"), 900);
      el.title = overCount ? T().overCount(MAXSEL) : T().overCred(MAXCR);
      if (overCount)
        capNote(T().capCount(MAXSEL), MAXSEL < SEL_HI ? T().capCountAct(MAXSEL+1) : null,
                MAXSEL < SEL_HI ? () => { setCap(MAXSEL+1); toggle(code); } : null);
      else
        capNote(T().capCred(MAXCR, cr), cr <= CRED_HI ? T().capCredAct(cr) : null,
                cr <= CRED_HI ? () => { MAXCR = cr; normalizeRanges(); syncRangeUI(); saveRanges(); toggle(code); } : null);
      return;
    }
    selected.push(code);
  }
  hideCapNote();
  altIndex = 0; render();
}
/* ders sayısı üst sınırını tek yerden değiştir */
function setCap(n){
  MAXSEL = clampInt(n, 1, SEL_HI, MAXSEL);
  if (MINSEL > MAXSEL) MINSEL = MAXSEL;
  normalizeRanges(); syncRangeUI(); saveRanges();
  altIndex = 0; render();
}

/* sayfaya gömülü müfredat: internet olmasa da (ve dosyadan açınca da) çalışır */
const CUR_LET = {u:"university", r:"required", c:"core", a:"area", f:"free"};
function builtCurriculum(major){
  if (typeof CURBUILT === "undefined" || !CURBUILT.m[major]) return null;
  const map = {};
  const s = CURBUILT.m[major];
  for (let i=0;i<CURBUILT.c.length;i++){
    const t = CUR_LET[s[i]];
    if (t) map[CURBUILT.c[i]] = {t, c: +CURBUILT.cr[i] || 0};
  }
  return {map, req: CURBUILT.q[major] ? {major, ...CURBUILT.q[major]} : null};
}

async function loadReq(){
  try{
    const r = await fetch(`https://beficent.github.io/surriculum/requirements/${ADMIT}.jsonl`, {cache:"no-store"});
    if (!r.ok) return null;
    for (const line of (await r.text()).split("\n")){
      const s = line.trim(); if (!s) continue;
      try{ const o = JSON.parse(s); if (o.major === MAJOR) return o; }catch(e){}
    }
  }catch(e){}
  return null;
}
async function loadCurriculum(){
  const note = document.getElementById("curNote");
  if (!MAJOR){ CURMAP = null; REQ = null; note.textContent = T().curHint; buildCurSelectors(); render(); return; }
  const key = `dk-cur2-${ADMIT}-${MAJOR}`;
  let usedBuilt = false;

  // 1) önbellek
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(key) || "null"); }catch(e){}
  const cacheOK = c => {
    if (!c || !c.m || typeof c.m !== "object") return false;
    const k = Object.keys(c.m)[0];
    return !!k && typeof c.m[k] === "object" && !!c.m[k].t;   // yeni biçim mi?
  };
  if (cached && cacheOK(cached) && Date.now() - cached.t < 7*24*3600*1000){
    CURMAP = cached.m; REQ = cached.r || null;
    note.textContent = T().curOk(MAJOR, ADMIT); buildCurSelectors(); render(); return;
  }

  // 2) gömülü kopya — anında göster, sonra canlıyı denemeye devam et
  const built = builtCurriculum(MAJOR);
  if (built && typeof CURBUILT !== "undefined" && ADMIT === CURBUILT.t){
    CURMAP = built.map; REQ = built.req;
    usedBuilt = true;
    note.textContent = T().curOk(MAJOR, ADMIT);
    buildCurSelectors(); render();
  } else {
    note.textContent = T().curLoading;
  }
  try{
    const r = await fetch(`${CUR_BASE}/${ADMIT}/${MAJOR}.jsonl`, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const map = {};
    for (const line of (await r.text()).split("\n")){
      const s = line.trim(); if (!s) continue;
      try{
        const o = JSON.parse(s);
        if (o.Major && o.Code && o.EL_Type)
          map[`${o.Major} ${o.Code}`] = {t:o.EL_Type, c: parseFloat(o.SU_credit) || 0};
      }catch(e){}
    }
    if (Object.keys(map).length < 20) throw new Error("boş müfredat");
    CURMAP = map;
    REQ = await loadReq();
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), m:map, r:REQ})); }catch(e){}
    note.textContent = T().curOk(MAJOR, ADMIT);
  }catch(e){
    if (usedBuilt) return;                      // gömülü kopya zaten yüklü
    const fb = builtCurriculum(MAJOR);          // farklı giriş dönemi + ağ yok
    if (fb){
      CURMAP = fb.map; REQ = fb.req;
      note.textContent = T().curBuilt(MAJOR, CURBUILT.t);
    } else {
      CURMAP = null; REQ = null;
      note.textContent = T().curFail;
    }
  }
  buildCurSelectors(); render();
}

     kaçının programa girdiği yazıyor. */
  const GT = [

function renderGrid(sol, ghostCrn){
  const t = document.getElementById("sched");
  const occ = {};
  let maxDay = 4, maxSlot = 10;   // en az 18:40'a kadar göster
  if (sol) sol.picks.forEach((opt,i) => {
    const code = sol.codes[i];
    opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
      if (m.d > maxDay) maxDay = m.d;
      for (let k=0;k<m.du;k++){
        if (m.s+k > maxSlot) maxSlot = m.s+k;
        (occ[m.d*NSLOT+m.s+k] = occ[m.d*NSLOT+m.s+k]||[]).push({
          code, type:cls.type, place:m.p, first:k===0, crn:sec.crn, inst:sec.inst,
          ghost: !!ghostCrn && sec.crn === ghostCrn
        });
      }
    }));
  });
  const nDays = maxDay + 1;
  let html = "<thead><tr><th class='tcol'></th>" +
    T().days.slice(0,nDays).map(d=>`<th>${d}</th>`).join("") + "</tr></thead><tbody>";
  const nRows = Math.min(NSLOT, maxSlot + 1);
  for (let s=0;s<nRows;s++){
    html += `<tr><td class="time">${slotStart(s)}</td>`;
    for (let d=0;d<nDays;d++){
      const items = occ[d*NSLOT+s] || [];
      let inner = "";
      items.slice(0,2).forEach((it,n) => {
        const cls = (items.length>1 ? (n===0?"blk half":"blk half half2") : "blk") + (it.ghost?" ghost":"");
        inner += `<div class="${cls}" style="background:${colorOf(it.code)}" title="${it.code}${it.type?" "+(T().types[it.type]||it.type):""} · ${it.place||"—"} · CRN ${it.crn}${it.inst?" · "+it.inst:""}">
            <span class="bc">${it.code}${it.type?" "+it.type:""}</span>
            ${it.first?`<span class="bm">${it.place||""}</span>`:""}
          </div>`;
      });
      html += `<td class="${items.length>1?"clash":""}">${inner}</td>`;
    }
    html += "</tr>";
  }
  t.innerHTML = html + "</tbody>";
  renderAgenda(occ, nDays);
}

/* ---- mobil: gün gün liste ---- */
function renderAgenda(occ, nDays){
  const el = document.getElementById("agenda");
  const S = T();
  let out = "";
  for (let d = 0; d < nDays; d++){
    const items = [];
    for (let s = 0; s < NSLOT; s++){
      const list = occ[d*NSLOT+s] || [];
      for (const it of list){
        if (it.first) items.push({...it, s, clash: list.length > 1});
      }
    }
    if (!items.length) continue;
    items.sort((a,b) => a.s - b.s);
    out += `<div class="agday"><div class="agd">${S.days[d]}</div>` + items.map(it => {
      const du = durationOf(it, d);
      return `<div class="agit${it.clash?" clash":""}" style="--ac:${colorOf(it.code)}">
        <span class="agtime">${slotStart(it.s)}<i>${slotEnd(it.s + du - 1)}</i></span>
        <span class="agmain"><b>${it.code}${it.type?" "+(S.types[it.type]||it.type):""}</b>
          <span>${it.place||"—"}${it.inst?" · "+it.inst:""}</span></span>
      </div>`;
    }).join("") + `</div>`;
  }
  el.innerHTML = out || `<div class="empty">${S.agEmpty}</div>`;
}
function durationOf(it, d){
  const c = BY[it.code]; if (!c) return 1;
  for (const cls of c.classes) for (const sec of cls.sections)
    if (sec.crn === it.crn) for (const m of sec.mt)
      if (m.d === d && m.s === it.s) return m.du;
  return 1;
}

/* kontenjan rozeti */
function seatChip(sec){
  const s = sec.seats;
  if (!s || !s.cap) return "";
  const left = s.cap - s.act;
  const cls = left <= 0 ? "seat none" : (left <= s.cap*0.1 ? "seat low" : "seat");
  const txt = left <= 0 ? T().noSeats : `${left}/${s.cap}`;
  return `<span class="${cls}">${txt}</span>`;
}

/* ================= verdict ================= */
function blockedByPrefs(){ return selected.filter(prefBlocked); }
/* Çakışma tanısını düğmelere çevirir. Her düğme, denenip çakışmasız sonuç
   verdiği doğrulanmış tek bir hamledir; tıklayınca uygulanır. */
/* Tanı, çakışma varken birkaç yüz milisaniye sürebiliyor. Ekranı bekletmemek
   için hesap bir sonraki karede yapılır; sonuç önbellekteyse anında basılır. */
let _fixSeq = 0;
function paintFix(codes){
  const box = document.getElementById("vFix");
  if (!box) return;
  const token = ++_fixSeq;
  if (fixKey(codes) === _fixKey){ drawFix(codes, box); return; }
  box.hidden = false;
  box.innerHTML = `<div class="fxl">${TX().fixTitle}</div><div class="fxn">${TX().fixWait}</div>`;
  setTimeout(() => {
    if (token !== _fixSeq) return;                 // arada yeni bir çizim oldu
    fixHints(codes);
    drawFix(codes, box);
  }, 30);
}
function drawFix(codes, box){
  const S = TX();
  const f = fixHints(codes);
  /* ucuz hamle önce: kısıt gevşetmek dersten vazgeçmekten iyidir,
     ders çıkarmak gerekiyorsa da önce "belki" olanlar */
  const acts = [];
  f.relax.forEach(r => acts.push(r.kind === "inst"
    ? {label:S.fixInst(r.code, r.name), run:() => setInstReq(r.code, "")}
    : {label:S.fixPin(r.code), run:() => clearPins(r.code)}));
  if (f.pref) acts.push({label:S.fixPref, run:resetPrefs});
  /* ucuzdan pahalıya: önce belki, sonra olsa iyi, en son kesin dersi bırak */
  const dropOrder = c => tierOf(c) === "maybe" ? 0 : tierOf(c) === "pref" ? 1 : 2;
  f.drops.slice().sort((a,b) => dropOrder(a) - dropOrder(b)).forEach(c => acts.push({
    label: tierOf(c) === "maybe" ? S.fixDropSel(c) : S.fixDropMust(c),
    tip: S.fixDropTip(c), run: () => dropCourse(c)
  }));
  const notes = [];
  /* verdict metni zaten "hiçbir kombinasyonda bir arada olmayan" ikilileri
     yazıyor; burada yalnız kısıtlar yüzünden doğanları, tekrar etmeden ekle */
  const softPairs = f.pairs.filter(([a,b]) => pairOf(a,b).n === 0);
  if (softPairs.length)
    notes.push(S.fixPairs(softPairs.slice(0,4).map(([a,b]) => `${a} ↔ ${b}`).join(", ")));
  if (!acts.length && f.pairs.length === 0 && !f.partial) notes.push(S.fixNone);
  if (f.partial) notes.push(S.fixPartial);
  if (!acts.length && !notes.length){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML =
    (acts.length ? `<div class="fxl">${S.fixTitle}</div><div class="fxr">` +
      acts.slice(0,6).map((a,i) =>
        `<button class="fx" data-i="${i}"${a.tip?` title="${a.tip.replace(/"/g,"&quot;")}"`:""}>${a.label}</button>`
      ).join("") + `</div>` : "") +
    (notes.length ? `<div class="fxn">${notes.join(" ")}</div>` : "");
  box.querySelectorAll(".fx").forEach(b =>
    b.onclick = () => { const a = acts[+b.dataset.i]; if (a) a.run(); });
}

function renderVerdict(sol){
  const v = document.getElementById("verdict");
  const T = document.getElementById("vTitle"), S = document.getElementById("vSub"), St = document.getElementById("vStats");
  v.className = "verdict";
  St.innerHTML = "";
  const fixBox = document.getElementById("vFix");
  if (fixBox){ fixBox.hidden = true; fixBox.innerHTML = ""; }
  const blk = blockedByPrefs();
  if (!sol && blk.length){
    v.classList.add("bad");
    T.textContent = TX().prefBlockT;
    S.innerHTML = TX().prefBlockS + " " +
      blk.map(c=>`<b class="mono">${c}</b>${INSTREQ[c]?` <span class="cat out">${INSTREQ[c]}</span>`:""}`).join(", ");
    document.getElementById("gridHint").textContent = "—";
    return;
  }
  if (!sol){
    v.classList.add("idle");
    T.textContent = pool.length ? TX().idleT2 : TX().idleT1;
    S.textContent = pool.length ? TX().idleS2 : TX().idleS1;
    document.getElementById("gridHint").textContent = "—";
    return;
  }
  const hard = [];
  for (let i=0;i<selected.length;i++) for (let j=i+1;j<selected.length;j++){
    const pr = pairOf(selected[i], selected[j]);
    if (pr.n > 0) hard.push([selected[i], selected[j]]);
  }
  if (sol.c === 0){
    v.classList.add("ok");
    T.textContent = TX().okT(selected.length);
    S.textContent = TX().okS;
  } else if (sol.manual){
    /* elle modda çakışmayı kullanıcı kendi kurdu: "en iyi ihtimalle" demek yanlış olur */
    v.classList.add(sol.c <= 1 ? "warn" : "bad");
    T.textContent = TX().manualBadT(sol.c);
    const over = [];
    for (let i=0;i<sol.codes.length;i++) for (let j=i+1;j<sol.codes.length;j++){
      const A = sol.picks[i].mask, B = sol.picks[j].mask;
      for (const k of A) if (B.has(k)){ over.push([sol.codes[i], sol.codes[j]]); break; }
    }
    S.innerHTML = over.length
      ? TX().manualBadS + " " + over.map(([a,b])=>`<b class="mono">${a} ↔ ${b}</b>`).join(", ") + "."
      : TX().manualBadS;
  } else {
    v.classList.add(sol.c <= 1 ? "warn" : "bad");
    T.textContent = TX().badT(sol.c);
    S.innerHTML = LOCK_CLASH ? TX().lockCause
      : hard.length
      ? TX().hardPairs + hard.map(([a,b])=>`<b class="mono">${a} ↔ ${b}</b>`).join(", ") + "."
      : TX().noPairClash;
    paintFix(selected);          // "ne yaparsam düzelir": doğrulanmış hamleler
  }
  const cred = credSum(selected);
  const parts = [];
  /* programa girenlerin kaçı kesin, kaçı belki: kesin/belki/otomatik seçim
     arasındaki bağ burada sayıyla görünür */
  if (selected.length){
    const mIn = selected.filter(isMust).length;
    const pIn = selected.filter(isPref).length;
    const yIn = selected.length - mIn - pIn;
    if (mIn) parts.push(`<span class="mix must">${TX().mixMust(mIn)}</span>`);
    if (pIn) parts.push(`<span class="mix pref">${TX().mixPref(pIn)}</span>`);
    if (yIn) parts.push(`<span class="mix maybe">${TX().mixMaybe(yIn)}</span>`);
  }
  if (CURMAP){
    const cnt = {}; let none = 0;
    selected.forEach(c => { const k = catOf(c); if (k) cnt[k] = (cnt[k]||0)+1; else none++; });
    CAT_ORDER.filter(k => cnt[k]).forEach(k =>
      parts.push(`<span class="mix ${k}"><b>${cnt[k]}</b>${TX().cats[k]}</span>`));
    if (none) parts.push(`<span class="mix out"><b>${none}</b>${TX().notInCur}</span>`);
  }
  /* 20 krediyi geçen program overload onayı isteyebilir: sessizce geçme */
  if (cred > OVERLOAD_CR)
    parts.push(`<span class="mix over" title="${TX().overloadTip(cred)}">${TX().overload(cred)}</span>`);
  /* kredi toplamı üstteki istatistiklerde duruyor; burada yalnız hedefin dışındaysa uyar */
  if (selected.length && !inRange())
    parts.push(`<span class="mix out">${TX().rangeHint(MINSEL, MAXSEL, MINCR, MAXCR)}</span>`);
  if (parts.length) S.innerHTML += `<div class="bd">${parts.join("")}</div>`;
  St.innerHTML = [selected.length, cred, sol.mask.size, sol.m.free, sol.m.gaps, sol.c]
    .map((n,i) => `<div class="stat"><div class="n">${n}</div><div class="l">${TX().stats[i]}</div></div>`).join("");
  document.getElementById("gridHint").textContent =
    sol.c === 0 ? TX().gridOk : TX().gridBad(sol.c);
  if (solutions && solutions.capped && sol.c > 0)
    S.innerHTML += ` <span style="color:var(--warn)">${TX().capped}</span>`;
}

/* ================= render ================= */
/* ================= elle seçim (manuel mod) =================
   SUchedule'ın alıştırdığı akış: soldan section'ları tıklarsın, program anında
   güncellenir, çakışma varsa kırmızı görünür. Çözücü hiç karışmaz. */

/* Elle seçilenlerden çözüm nesnesi üretir; render fonksiyonları bunu da anlar. */
/* pv verilirse o section geçici olarak seçilmiş sayılır: fareyle üstüne
   gelindiğinde "seçersem programım ne olur" önizlemesi bundan çıkıyor. */
function manualSol(pv){
  const codes = [], picks = [];
  const count = new Map();
  const list = (pv && !selected.includes(pv.code)) ? selected.concat([pv.code]) : selected;
  for (const code of list){
    const c = BY[code]; if (!c) continue;
    const chosen = [];
    for (const cls of c.classes){
      const want = (pv && pv.code === code && pv.type === cls.type)
        ? pv.crn : (MANUAL[code] && MANUAL[code][cls.type]);
      const sec = usableSections(cls).find(x => x.crn === want);
      if (sec) chosen.push({cls, sec});
    }
    if (!chosen.length) continue;
    const mask = new Set();
    chosen.forEach(({sec}) => sec.mt.forEach(m => { for (let k=0;k<m.du;k++) mask.add(m.d*NSLOT+m.s+k); }));
    mask.forEach(k => count.set(k, (count.get(k)||0)+1));
    codes.push(code);
    picks.push({picks:chosen, mask});
  }
  if (!codes.length) return null;
  const mask = new Set(), conflicts = new Set();
  for (const [k,n] of count){ mask.add(k); if (n > 1) conflicts.add(k); }
  return {codes, picks, mask, conflicts, c:conflicts.size, m:score(mask), manual:true};
}

/* Otomatik programı elle moda taşı: her dersin o anki section'ları başlangıç olur. */
function seedManual(){
  const sol = solutions ? solutions[altIndex] : null;
  MANUAL = {};
  if (sol) sol.codes.forEach((code,i) => {
    MANUAL[code] = {};
    sol.picks[i].picks.forEach(({cls,sec}) => { MANUAL[code][cls.type] = sec.crn; });
  });
  /* çözümde olmayan seçili dersler için ilk uygun section'ı ata */
  selected.forEach(code => {
    if (MANUAL[code] || !BY[code]) return;
    MANUAL[code] = {};
    BY[code].classes.forEach(cls => { const ss = usableSections(cls); if (ss.length) MANUAL[code][cls.type] = ss[0].crn; });
  });
}

function setMode(m){
  if (m === MODE) return;
  if (m === "manual") seedManual();
  MODE = m;
  try{ localStorage.setItem("dk-mode", MODE); }catch(e){}
  altIndex = 0; render();
}

function manualPick(code, type, crn){
  /* Üst sınır manuel modda da geçerli: aynı sayı iki modda iki şey demesin. */
  if (!selected.includes(code) && selected.length >= effMax()){
    capNote(T().capManual(MAXSEL), MAXSEL < SEL_HI ? T().capCountAct(MAXSEL+1) : null,
            MAXSEL < SEL_HI ? () => { setCap(MAXSEL+1); manualPick(code, type, crn); } : null);
    return;
  }
  hideCapNote();
  MANUAL[code] = MANUAL[code] || {};
  MANUAL[code][type] = crn;
  if (!selected.includes(code)) selected.push(code);
  try{ localStorage.setItem("dk-manual", JSON.stringify(MANUAL)); }catch(e){}
  render();
}

/* ================= manuel mod: section önizlemesi =================
   Fareyle bir section'ın üstüne gelince "bunu seçersem programım ne olur"
   sorusunun cevabı tabloda soluk olarak beliriyor; çakışma olacaksa o hücre
   kırmızıya döndüğü için karar tıklamadan önce veriliyor. */
const HOVER_FINE = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
let PREVIEW = null;
function previewGrid(pv){
  if (MODE !== "manual") return;
  const same = (a,b) => (!a && !b) || (a && b && a.code===b.code && a.type===b.type && a.crn===b.crn);
  if (same(pv, PREVIEW)) return;
  PREVIEW = pv;
  const sol = manualSol(pv);
  renderGrid(sol, pv ? pv.crn : null);
  const t = document.getElementById("sched");
  t.classList.toggle("previewing", !!pv);
  const hint = document.getElementById("gridHint");
  if (pv){
    if (hint.dataset.keep === undefined) hint.dataset.keep = hint.textContent;
    const n = sol ? sol.c : 0;
    hint.textContent = n ? T().previewBad(n) : T().previewOk;
    hint.classList.toggle("bad", !!n);
  } else {
    if (hint.dataset.keep !== undefined){ hint.textContent = hint.dataset.keep; delete hint.dataset.keep; }
    hint.classList.remove("bad");
  }
}

  list.forEach(code => {

        <span class="code">${code}</span>

      </div>` +
      c.classes.map(cls => {

        return `<div class="mtype">

let LOCK_CLASH = null;     // verdict de kilitleri suçlayabilsin diye render öncesi hesaplanır
/* Sabitlenen section'lar yüzünden çakışma çıkıyor mu? Çıkıyorsa hangi ikili? */
function lockClash(sol){
  if (!sol || sol.c === 0) return null;
  const locked = selected.filter(c => pinsOf(c));
  if (!locked.length) return null;
  /* 1) doğrudan: sabitlenen iki section aynı saatte mi */
  const slots = [];
  for (const code of locked){
    const pins = pinsOf(code) || {};
    for (const cls of BY[code].classes){
      const sec = usableSections(cls).find(x => x.crn === pins[cls.type]);
      if (!sec) continue;
      const set = new Set();
      sec.mt.forEach(m => { for (let k=0;k<m.du;k++) set.add(m.d*NSLOT+m.s+k); });
      slots.push({code, group:sec.group, set});
    }
  }
  for (let i=0;i<slots.length;i++) for (let j=i+1;j<slots.length;j++){
    if (slots[i].code === slots[j].code) continue;
    for (const k of slots[i].set) if (slots[j].set.has(k))
      return {pair:[`${slots[i].code} · ${slots[i].group}`, `${slots[j].code} · ${slots[j].group}`], locked};
  }
  /* 2) dolaylı: sabitler kalksa çakışmasız olabiliyor mu */
  const free = selected.map(c => {
    const ok = baseOk2(c);
    return optsOf(c).filter(ok);
  });
  if (free.some(l => !l.length)) return null;
  return existsCF(free, 800000) === true ? {pair:null, locked} : null;
}
/* sabitlemeleri yok sayan, yalnız hoca kısıtını uygulayan filtre */
function baseOk2(code){
  const want = INSTREQ[code];
  return o => !want || (o.picks[0].sec.inst || "").includes(want);
}

function render(){
  /* yeniden çizim önizlemeyi geçersiz kılar */
  PREVIEW = null;

  /* hiçbir yol geçersiz bir sınırla buraya gelmesin; düzeltme olduysa
     üst bardaki seçim kutuları ve kayıt da aynı değere getirilsin */
  if (normalizeRanges()){ try{ syncRangeUI(); saveRanges(); }catch(e){} }
  /* Tek değişmez kural: kesin dersler her zaman programda ve seçim üst sınırı
     asla aşmıyor. Hangi yoldan gelinirse gelinsin (plan, link, eski kayıt,
     kod) burada garanti altına alınıyor; düşen ders olursa yazılıyor. */
  try{
    MUST.forEach(c => { if (pool.includes(c) && !selected.includes(c)) selected.push(c); });
    raiseCapForMust();
    const _cut = trimToCap();
    if (_cut.length) capNote(T().capTrim(_cut.join(", "), MAXSEL));
  }catch(e){}
  syncOffEff();          // çözücüye girmeden önce: hangi boş günler gerçekten tutulabiliyor
  renderPlans();

  document.querySelectorAll("#modesw button").forEach(b => b.classList.toggle("on", b.dataset.mode === MODE));
  document.getElementById("btnAuto").hidden = manual;
  renderPool();

  if (manual){
    /* elle mod açıkken sayfa yenilendiyse seçim boş kalmasın: bir kez çözüp tohumla */
    if (selected.length && !Object.keys(MANUAL).length){
      solutions = solve(selected);
      seedManual();
    }
    solutions = null;
    LOCK_CLASH = null;
    const sol = manualSol();
    renderManual(sol);
    renderVerdict(sol);

    renderAlts();
    checkErrors(sol);
    save();
    syncRail();
    syncRailTop();   // manuel mod üst barı kısaltıyor: yapışma noktası da düşsün
    return;
  }
  solutions = selected.length ? solve(selected) : null;
  if (solutions && altIndex >= solutions.length) altIndex = 0;
  const sol = solutions ? solutions[altIndex] : null;
  LOCK_CLASH = lockClash(sol);
  renderVerdict(sol);
  renderGrid(sol);
  renderSections(sol);
  renderAlts();
  checkErrors(sol);
  save();
  syncRail();
  syncRailTop();     // panel yerleşimi bittikten sonra ölç
}

/* Kullanıcının kendi ayarlarının birbiriyle çeliştiği durumlar. */
function checkErrors(sol){
  const S = T();
  if (mustOverflow()){
    const acts = [];
    /* Limit en fazla SEL_HI olabildiği için, kesin ders sayısı bunun
       üstündeyse "limiti yükselt" düğmesi sorunu çözmez; gösterilmesin. */
    if (MUST.length <= SEL_HI){
      acts.push({label:S.errMustFix(MUST.length), primary:true, run:()=>{
        MAXSEL = MUST.length;
        MINSEL = Math.min(MINSEL, MAXSEL);
        normalizeRanges();
        syncRangeUI(); saveRanges(); altIndex=0; render();
      }});
    }
    acts.push({label:S.errMustClear, primary:acts.length===0, run:()=>{ MUST = []; altIndex=0; save(); render(); }});
    showError(S.errMustTitle, S.errMustBody(MUST.length, MAXSEL), acts);
    return;
  }
  const lc = MODE === "manual" ? null : LOCK_CLASH;
  if (lc){
    showError(S.errLockTitle,
      lc.pair ? S.errLockPair(lc.pair[0], lc.pair[1]) : S.errLockBody,
      [{label:S.errLockClear, primary:true, run:()=>{ clearPins(); }}]);
    return;
  }
  clearError();
}


/* ================= paylaşılabilir bağlantı ================= */
function encodeState(){
  const s = {p:pool, s:selected, q:MUST, w:PREF, md:MODE, mn:MANUAL,
             n:MAXSEL, nlo:MINSEL, clo:MINCR, chi:MAXCR,
             k:PINNED, i:INSTREQ,
             e:PREFS.early, l:PREFS.late, o:PREFS.off,
             m:MAJOR, a:ADMIT};
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(s))))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){ return ""; }
}
function decodeState(str){
  try{
    const t = str.replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(t))));
  }catch(e){ return null; }
}
function applyState(s){
  if (!s) return false;
  if (Array.isArray(s.p)) pool = s.p.filter(c => BY[c]);
  if (Array.isArray(s.s)) selected = s.s.filter(c => pool.includes(c));
  MUST = Array.isArray(s.q) ? s.q.filter(c => pool.includes(c)) : [];
  PREF = Array.isArray(s.w) ? s.w.filter(c => pool.includes(c) && !MUST.includes(c)) : [];
  if (s.md === "manual" || s.md === "auto") MODE = s.md;
  if (s.mn && typeof s.mn === "object") MANUAL = s.mn;
  MUST.forEach(c => { if (!selected.includes(c)) selected.push(c); });
  /* eski bağlantılarda yalnız s.n (tek limit) var, onlar da açılabilsin */
  if (Number.isInteger(s.n)   && s.n   >= 1 && s.n   <= SEL_HI)  MAXSEL = s.n;
  if (Number.isInteger(s.nlo) && s.nlo >= 1 && s.nlo <= SEL_HI)  MINSEL = s.nlo;
  if (Number.isInteger(s.clo) && s.clo >= 0 && s.clo <= CRED_HI) MINCR  = s.clo;
  if (Number.isInteger(s.chi) && s.chi >= 0 && s.chi <= CRED_HI) MAXCR  = s.chi;
  normalizeRanges();
  /* Plan ya da paylaşılan bağlantı da aynı kurala uyar: kesin dersler garanti,
     üst sınır sert; gerekiyorsa sınır kesin derslere göre yükselir. */
  if (MUST.length > MAXSEL) MAXSEL = Math.min(SEL_HI, MUST.length);
  if (MINSEL > MAXSEL) MINSEL = MAXSEL;
  normalizeRanges();
  const cut = trimToCap();
  syncRangeUI();
  if (cut.length) capNote(T().capTrim(cut.join(", "), MAXSEL));
  if (s.k && typeof s.k === "object"){ Object.keys(PINNED).forEach(k => delete PINNED[k]); Object.assign(PINNED, s.k); }
  if (s.i && typeof s.i === "object"){ Object.keys(INSTREQ).forEach(k => delete INSTREQ[k]); Object.assign(INSTREQ, s.i); }
  if (Number.isInteger(s.e)) PREFS.early = s.e;
  if (Number.isInteger(s.l)) PREFS.late = s.l;
  if (Array.isArray(s.o)) PREFS.off = s.o.filter(Number.isInteger);
  if (MAJORS.includes(s.m)) MAJOR = s.m;
  if (ADMITS.includes(s.a)) ADMIT = s.a;
  _allow.clear(); altIndex = 0;
  return true;
}

  navigator.clipboard.writeText(url).catch(()=>{});
  return url;
}

function wpDays(sol){
  const out = [];
  if (!sol) return out;

  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {

    out.push({d, items: occ[d].sort((a,b)=>a.s-b.s)});
  });

}

function drawWallpaper(){
  const cv = document.getElementById("wpCanvas");
  const size = WP_SIZES.find(s => s.id === WP.size) || WP_SIZES[0];
  const th = WP_THEMES.find(t => t.id === WP.theme) || WP_THEMES[0];
  cv.width = size.w; cv.height = size.h;
  const g = cv.getContext("2d");
  const W = size.w, H = size.h;
  const SANS = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const S = T();

  g.fillStyle = th.bg; g.fillRect(0,0,W,H);

  const sol = solutions ? solutions[altIndex] : null;
  const days = wpDays(sol);

  if (days.length && WP.format === "grid"){ drawWallpaperGrid(g, W, H, th, S); return; }

  if (!days.length){
    g.fillStyle = th.sub; g.textAlign = "center";
    g.font = `500 34px ${SANS}`;
    g.fillText(S.wpEmpty, W/2, H/2);
    return;
  }

  const M = Math.round(W * 0.072);          // kenar boşluğu
  const top = Math.round(H * 0.285);        // üstte saat için boşluk
  const bottom = H - Math.round(H * 0.085);
  const avail = bottom - top;

  // ölçek: kart içi satır yüksekliği + kart başlıkları + aralar
  const rows = days.reduce((a,d) => a + d.items.length, 0);
  let rowH = 86, headH = 64, padY = 24, gap = 22;
  const need = () => days.length*(headH + 2*padY + gap) + rows*rowH;
  const scale = Math.max(0.58, Math.min(1, avail / need()));
  rowH = Math.round(rowH*scale); headH = Math.round(headH*scale);
  padY = Math.round(padY*scale); gap = Math.round(gap*scale);
  const fCode = Math.round(36*scale), fTime = Math.round(25*scale),
        fRoom = Math.round(24*scale), fDay = Math.round(25*scale), fMark = Math.round(22*scale);

  const total = days.length*(headH + 2*padY + gap) - gap + rows*rowH;
  let y = top + Math.max(0, Math.round((avail - total) * 0.40));

  const rr = (x,yy,w,h,r) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,yy,w,h,r);
    else {
      g.moveTo(x+r,yy); g.arcTo(x+w,yy,x+w,yy+h,r); g.arcTo(x+w,yy+h,x,yy+h,r);
      g.arcTo(x,yy+h,x,yy,r); g.arcTo(x,yy,x+w,yy,r); g.closePath();
    }
  };

  for (const day of days){
    const cardH = headH + 2*padY + day.items.length*rowH - Math.round(10*scale);
    g.fillStyle = th.card;
    rr(M, y, W-2*M, cardH, Math.round(34*scale)); g.fill();

    // gün başlığı
    g.textAlign = "left";
    g.fillStyle = th.sub;
    g.font = `680 ${fDay}px ${SANS}`;
    g.fillText(S.days[day.d].toLocaleUpperCase(LANG === "tr" ? "tr" : "en"), M + Math.round(34*scale), y + padY + Math.round(30*scale));

    let ry = y + padY + headH;
    for (const it of day.items){
      const cy = ry + Math.round(rowH*0.40);
      let x = M + Math.round(34*scale);

      if (WP.accent){
        g.fillStyle = cssVar(PALETTE[Math.max(0, selected.indexOf(it.code)) % PALETTE.length]);
        const r = Math.round(6.5*scale);
        rr(x, cy - Math.round(20*scale), r*2, Math.round(30*scale), r); g.fill();
        x += Math.round(28*scale);
      }

      g.fillStyle = th.ink;
      g.font = `680 ${fCode}px ${SANS}`;
      g.fillText(it.code + (it.type ? " " + it.type : ""), x, cy);

      g.fillStyle = th.sub;
      g.font = `500 ${fTime}px ${MONO}`;
      const tline = slotStart(it.s) + "–" + slotEnd(it.s + it.du - 1);
      g.fillText(tline, x, cy + Math.round(33*scale));
      const kat = WP.cat ? wpCatOf(it.code) : "";
      if (kat){
        const tw = g.measureText(tline).width;
        g.font = `600 ${Math.round(fTime*0.92)}px ${SANS}`;
        g.globalAlpha = .8;
        g.fillText(" · " + kat, x + tw, cy + Math.round(33*scale));
        g.globalAlpha = 1;
      }

      if (WP.room && it.p){
        g.textAlign = "right";
        g.fillStyle = th.sub;
        g.font = `500 ${fRoom}px ${SANS}`;
        g.fillText(it.p, W - M - Math.round(34*scale), cy);
        g.textAlign = "left";
      }
      ry += rowH;
    }
    y += cardH + gap;
  }

  // alt imza
  g.textAlign = "center";
  g.fillStyle = th.sub;
  g.font = `600 ${fMark}px ${SANS}`;
  g.globalAlpha = .75;
  g.fillText("SUits" + (TERM ? "  ·  " + TERM : ""), W/2, H - Math.round(H*0.042));
  g.globalAlpha = 1;
}

function hexA(hex, a){
  const h = (hex||"#888").replace("#","");
  const n = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const r = parseInt(n.slice(0,2),16), g2 = parseInt(n.slice(2,4),16), b2 = parseInt(n.slice(4,6),16);
  return `rgba(${r},${g2},${b2},${a})`;
}
/* Aynı gün içinde çakışan bloklar üst üste binmesin: çakışan öbeğe (bağlı
   bileşen) kaç eşzamanlı ders varsa sütun o kadar şeride bölünür ve her blok
   kendi şeridine oturur. Çakışması olmayan blok tam genişlikte kalır. */
function layoutDay(items){
  const list = items.map((it,i) => ({...it, _i:i, lane:0, lanes:1}));
  const hits = (a,b) => a.s < b.s + b.du && b.s < a.s + a.du;
  /* bağlı bileşenler */
  const comp = new Array(list.length).fill(-1);
  let nc = 0;
  for (let i = 0; i < list.length; i++){
    if (comp[i] >= 0) continue;
    const stack = [i]; comp[i] = nc;
    while (stack.length){
      const k = stack.pop();
      for (let j = 0; j < list.length; j++)
        if (comp[j] < 0 && hits(list[k], list[j])){ comp[j] = nc; stack.push(j); }
    }
    nc++;
  }
  for (let c = 0; c < nc; c++){
    const grp = list.filter((_,i) => comp[i] === c)
                    .sort((a,b) => a.s - b.s || b.du - a.du);
    const laneEnd = [];
    grp.forEach(it => {
      let l = 0;
      while (l < laneEnd.length && laneEnd[l] > it.s) l++;
      it.lane = l; laneEnd[l] = it.s + it.du;
    });
    grp.forEach(it => { it.lanes = laneEnd.length; });
  }
  return list;
}

function drawWallpaperGrid(g, W, H, th, S){
  const SANS = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const sol = solutions ? solutions[altIndex] : null;

  // hücreleri topla
  const occ = {}; let minS = NSLOT, maxS = 0, maxD = 4;
  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    if (m.d > maxD) maxD = m.d;
    if (m.s < minS) minS = m.s;
    if (m.s + m.du > maxS) maxS = m.s + m.du;
    (occ[m.d] = occ[m.d] || []).push({code:sol.codes[i], type:cls.type, s:m.s, du:m.du, p:m.p});
  })));
  minS = Math.max(0, minS); maxS = Math.min(NSLOT, maxS);
  const nD = maxD + 1, nS = Math.max(1, maxS - minS);

  const M = Math.round(W * 0.045);
  const gut = Math.round(W * 0.085);
  const top = Math.round(H * 0.255);
  const bottom = H - Math.round(H * 0.085);
  const headH = Math.round(H * 0.022);
  const gridTop = top + headH + Math.round(14);
  const rowH = Math.min(Math.round((bottom - gridTop) / nS), Math.round(H*0.055));
  const colW = (W - 2*M - gut) / nD;
  const gridH = rowH * nS;

  // gün başlıkları
  g.textAlign = "center";
  g.fillStyle = th.sub;
  g.font = `680 ${Math.round(24)}px ${SANS}`;
  for (let d=0; d<nD; d++){
    g.fillText(S.daysS[d].toLocaleUpperCase(LANG==="tr"?"tr":"en"), M + gut + colW*(d+0.5), top + headH);
  }

  // saat çizgileri
  g.textAlign = "right";
  for (let s=0; s<=nS; s++){
    const y = gridTop + s*rowH;
    g.strokeStyle = hexA(th.sub, s === 0 || s === nS ? .28 : .14);
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(M + gut - 12, y); g.lineTo(W - M, y); g.stroke();
    if (s < nS){
      g.fillStyle = th.sub;
      g.font = `500 ${Math.round(21)}px ${MONO}`;
      g.globalAlpha = .85;
      g.fillText(slotStart(minS + s), M + gut - 26, y + Math.round(rowH*0.42));
      g.globalAlpha = 1;
    }
  }

  const rr = (x,y,w,h,r) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,y,w,h,r);
    else { g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  };

  // bloklar
  g.textAlign = "left";
  for (let d=0; d<nD; d++){
    for (const it of layoutDay(occ[d] || [])){
      const lw = (colW - 8) / it.lanes;              // çakışanlar şeridi paylaşır
      const x = M + gut + colW*d + 4 + it.lane*lw;
      const y = gridTop + (it.s - minS)*rowH + 3;
      const w = lw - (it.lanes > 1 ? 4 : 0), h = it.du*rowH - 6;
      const col = cssVar(PALETTE[Math.max(0, selected.indexOf(it.code)) % PALETTE.length]);
      g.fillStyle = WP.accent ? hexA(col, th.id === "ink" || th.id === "night" ? .26 : .16) : th.card;
      rr(x, y, w, h, Math.round(14)); g.fill();
      if (WP.accent){
        g.fillStyle = col;
        rr(x, y, Math.round(5), h, Math.round(3)); g.fill();
      }
      g.fillStyle = th.ink;
      g.font = `680 ${Math.round(23)}px ${SANS}`;
      const pad = it.lanes > 1 ? 10 : 16;
      g.fillText(fitText(g, it.code + (it.type ? " " + it.type : ""), w - pad - 6), x + pad, y + Math.round(30));
      const kat = WP.cat ? wpCatOf(it.code, true) : "";   // tablo sütunu dar: kısa etiket
      const sub = [WP.room && it.p ? it.p : "", kat].filter(Boolean).join(" · ");
      if (sub && h > 58){
        g.fillStyle = th.sub;
        g.font = `500 ${Math.round(18)}px ${SANS}`;
        /* sütunlar dar: sığmayan alt satırı kısalt, komşu güne taşmasın */
        g.fillText(fitText(g, sub, w - (it.lanes > 1 ? 16 : 26)), x + (it.lanes > 1 ? 10 : 16), y + Math.round(56));
      }
    }
  }

  // alt imza
  g.textAlign = "center";
  g.fillStyle = th.sub; g.globalAlpha = .75;
  g.font = `600 ${Math.round(22)}px ${SANS}`;
  g.fillText("SUits" + (TERM ? "  ·  " + TERM : ""), W/2, H - Math.round(H*0.042));
  g.globalAlpha = 1;
}
function spaced(s){ return s.split("").join(" "); }
/* ================= yatay A4 tablosu =================
   "Tabloyu indir": sayfayı yazıcıya göndermek yerine programın A4 yatay
   (2339×1654 px, 200 dpi) PNG'sini üretir. Bloklar layoutDay ile yerleşir,
   yani aynı saatte iki section varsa sütun şeritlere bölünür, üst üste
   binmez. Sağ sütunda CRN listesi var: kayıtta okumak için. */
const A4 = {w:2339, h:1654};
const a4Sol = () => MODE === "manual" ? manualSol() : (solutions ? solutions[altIndex] : null);

function drawA4(cv){
  const S = T();
  const W = A4.w, H = A4.h;
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const SANS = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const INK = "#0f172a", SUB = "#5b6472", LINE = "#dbe0e8", HEADBG = "#f4f6f9";
  const used = [];

  g.fillStyle = "#ffffff"; g.fillRect(0,0,W,H);
  const sol = a4Sol();

  const rr = (x,y,w,h,r) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,y,w,h,r);
    else { g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  };

  /* ---- başlık ---- */
  const M = 78;
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillStyle = INK; g.font = `700 52px ${SANS}`;
  g.fillText("SUits", M, 84);
  const brandW = g.measureText("SUits").width;
  g.fillStyle = SUB; g.font = `500 26px ${SANS}`;
  g.fillText(`${S.uni}${TERM ? "  ·  " + TERM : ""}`, M + brandW + 20, 82);
  if (sol){
    g.textAlign = "right"; g.fillStyle = INK; g.font = `600 27px ${SANS}`;
    const meta = `${sol.codes.length} ${S.psCourses}  ·  ${S.credits(credSum(sol.codes))}  ·  ${sol.mask.size} ${S.psHours}`;
    g.fillText(meta, W - M, 80);
  }
  g.strokeStyle = LINE; g.lineWidth = 2;
  g.beginPath(); g.moveTo(M, 112); g.lineTo(W - M, 112); g.stroke();

  if (!sol){
    g.textAlign = "center"; g.fillStyle = SUB; g.font = `500 40px ${SANS}`;
    g.fillText(S.wpEmpty, W/2, H/2);
    return {used, W, H};
  }

  /* ---- hücreleri topla ---- */
  const occ = {}; let minS = NSLOT, maxS = 0, maxD = 4;
  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    if (m.d > maxD) maxD = m.d;
    if (m.s < minS) minS = m.s;
    if (m.s + m.du > maxS) maxS = m.s + m.du;
    (occ[m.d] = occ[m.d] || []).push({code:sol.codes[i], type:cls.type, s:m.s, du:m.du, p:m.p, inst:sec.inst||"", crn:sec.crn});
  })));
  if (!Object.keys(occ).length){ minS = 0; maxS = 1; }
  minS = Math.max(0, minS); maxS = Math.min(NSLOT, Math.max(minS+1, maxS));
  const nD = maxD + 1, nS = maxS - minS;

  /* ---- ölçüler: solda tablo, sağda CRN sütunu ---- */
  const SIDE = 470, GAP = 34;
  const gutter = 116;                              // saat sütunu
  const gLeft = M + gutter, gRight = W - M - SIDE - GAP;
  const colW = (gRight - gLeft) / nD;
  const headY = 150, headH = 52;
  const gTop = headY + headH, gBottom = H - 96;
  const rowH = (gBottom - gTop) / nS;

  /* gün başlıkları */
  g.fillStyle = HEADBG; rr(M, headY, gRight - M, headH, 12); g.fill();
  g.textAlign = "center"; g.fillStyle = INK; g.font = `700 27px ${SANS}`;
  for (let d=0; d<nD; d++) g.fillText(S.days[d], gLeft + colW*(d+0.5), headY + 35);

  /* saat satırları */
  for (let s=0; s<=nS; s++){
    const y = gTop + s*rowH;
    g.strokeStyle = (s === 0 || s === nS) ? "#c3cad6" : LINE;
    g.lineWidth = (s === 0 || s === nS) ? 2 : 1.4;
    g.beginPath(); g.moveTo(M, y); g.lineTo(gRight, y); g.stroke();
    if (s < nS){
      g.textAlign = "right"; g.fillStyle = SUB; g.font = `500 24px ${MONO}`;
      g.fillText(slotStart(minS+s), gLeft - 22, y + rowH*0.42);
    }
  }
  /* gün ayırıcıları */
  for (let d=0; d<=nD; d++){
    const x = gLeft + colW*d;
    g.strokeStyle = LINE; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x, gTop); g.lineTo(x, gBottom); g.stroke();
  }

  /* ---- bloklar ---- */
  for (let d=0; d<nD; d++){
    for (const it of layoutDay(occ[d] || [])){
      const lw = (colW - 10) / it.lanes;
      const x = gLeft + colW*d + 5 + it.lane*lw;
      const y = gTop + (it.s - minS)*rowH + 4;
      const w = lw - (it.lanes > 1 ? 5 : 0), h = it.du*rowH - 8;
      const col = cssVar(PALETTE[Math.max(0, selected.indexOf(it.code)) % PALETTE.length]);
      used.push({d, x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h),
                 code:it.code, lane:it.lane, lanes:it.lanes});
      g.fillStyle = hexA(col, .15); rr(x, y, w, h, 12); g.fill();
      g.strokeStyle = hexA(col, .5); g.lineWidth = 1.5; rr(x, y, w, h, 12); g.stroke();
      g.fillStyle = col; rr(x, y, 7, h, 3.5); g.fill();

      const pad = it.lanes > 1 ? 16 : 22;
      const tx = x + pad, tw = w - pad - 12;
      g.textAlign = "left"; g.fillStyle = INK; g.font = `700 27px ${SANS}`;
      g.fillText(fitText(g, it.code + (it.type ? " " + it.type : ""), tw), tx, y + 38);
      g.fillStyle = SUB; g.font = `500 21px ${MONO}`;
      g.fillText(fitText(g, rangeLabel(it.s, it.du), tw), tx, y + 68);
      if (h > 108 && it.p){
        g.font = `500 21px ${SANS}`;
        g.fillText(fitText(g, it.p, tw), tx, y + 96);
      }
      if (h > 140 && it.inst){
        g.font = `500 20px ${SANS}`;
        g.fillText(fitText(g, it.inst, tw), tx, y + 122);
      }
    }
  }

  /* ---- sağ sütun: ders + CRN listesi ---- */
  const sx = W - M - SIDE;
  g.fillStyle = HEADBG; rr(sx, headY, SIDE, headH, 12); g.fill();
  g.textAlign = "left"; g.fillStyle = INK; g.font = `700 25px ${SANS}`;
  g.fillText(`${S.psCode}  ·  CRN`, sx + 20, headY + 35);

  const lines = [];
  const order = sol.codes.map((c,i)=>i)
    .sort((a,b) => selected.indexOf(sol.codes[a]) - selected.indexOf(sol.codes[b]));
  order.forEach(i => {
    const code = sol.codes[i];
    sol.picks[i].picks.forEach(({cls,sec}) => {
      const t = sec.mt.map(m => `${S.daysS[m.d]} ${rangeLabel(m.s,m.du)}`).join(", ") || "TBA";
      const pl = [...new Set(sec.mt.map(m=>m.p).filter(Boolean))].join(", ");
      lines.push({code: code + (cls.type ? " " + cls.type : ""), crn: sec.crn,
                  sub: [t, pl].filter(Boolean).join("  ·  "),
                  col: cssVar(PALETTE[Math.max(0, selected.indexOf(code)) % PALETTE.length])});
    });
  });
  const availH = gBottom - (gTop + 14);
  const lineH = Math.max(40, Math.min(84, availH / Math.max(1, lines.length)));
  const fTop = Math.min(25, lineH*0.36), fSub = Math.min(20, lineH*0.29);
  let ly = gTop + 14;
  lines.forEach(L => {
    g.fillStyle = L.col; rr(sx + 2, ly + 6, 6, Math.max(6, lineH - 16), 3); g.fill();
    g.textAlign = "left"; g.fillStyle = INK; g.font = `650 ${fTop}px ${SANS}`;
    g.fillText(fitText(g, L.code, SIDE - 170), sx + 22, ly + fTop + 8);
    g.textAlign = "right"; g.font = `600 ${fTop}px ${MONO}`;
    g.fillText(L.crn, sx + SIDE - 8, ly + fTop + 8);
    if (lineH > 52){
      g.textAlign = "left"; g.fillStyle = SUB; g.font = `500 ${fSub}px ${SANS}`;
      g.fillText(fitText(g, L.sub, SIDE - 30), sx + 22, ly + fTop + fSub + 16);
    }
    g.strokeStyle = LINE; g.lineWidth = 1;
    g.beginPath(); g.moveTo(sx, ly + lineH); g.lineTo(sx + SIDE, ly + lineH); g.stroke();
    ly += lineH;
  });

  /* ---- alt şerit ---- */
  g.textAlign = "left"; g.fillStyle = SUB; g.font = `500 22px ${MONO}`;
  g.fillText(fitText(g, "CRN  " + lines.map(L => L.crn).join("   "), gRight - M), M, H - 46);
  g.textAlign = "right"; g.font = `500 21px ${SANS}`;
  g.fillText("bozdagyusuf.github.io/SUits", W - M, H - 46);
  return {used, W, H};
}

function downloadA4(){
  const cv = document.createElement("canvas");
  drawA4(cv);
  const name = "suits-program" +
    (TERM ? "-" + TERM.replace(/[^0-9A-Za-z]+/g, "-").toLowerCase().replace(/^-+|-+$/g, "") : "") + ".png";
  const save = url => {
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  if (cv.toBlob) cv.toBlob(b => {
    if (!b) return save(cv.toDataURL("image/png"));
    const u = URL.createObjectURL(b); save(u);
    setTimeout(() => URL.revokeObjectURL(u), 8000);
  }, "image/png");
  else save(cv.toDataURL("image/png"));
}

/* verilen genişliğe sığmayan metni kısaltır */
function fitText(g, text, maxW){
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}
function openWallpaper(){
  document.getElementById("wpSheet").classList.add("open");
  buildWpOptions();
  drawWallpaper();
}
function buildWpOptions(){
  const S = T();
  const fmt = document.getElementById("wpFormat");
  fmt.querySelector('[data-f="cards"]').textContent = S.wpCards;
  fmt.querySelector('[data-f="grid"]').textContent = S.wpGrid;
  fmt.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.f === WP.format));
  document.getElementById("wpSwatches").innerHTML = WP_THEMES.map(t =>
    `<button class="sw${t.id===WP.theme?" on":""}" data-th="${t.id}" style="background:${t.bg}" title="${t.id}"></button>`).join("");
  document.querySelectorAll("#wpSwatches .sw").forEach(el => el.onclick = () => {
    WP.theme = el.dataset.th; buildWpOptions(); drawWallpaper();
  });
  document.getElementById("wpSize").innerHTML = WP_SIZES.map(s =>
    `<option value="${s.id}"${s.id===WP.size?" selected":""}>${s.w} × ${s.h}</option>`).join("");
  document.getElementById("wpRoom").checked = WP.room;
  document.getElementById("wpAccent").checked = WP.accent;
  const catBox = document.getElementById("wpCat");
  catBox.checked = WP.cat;
  catBox.closest("label").hidden = !CURMAP;   // müfredat yoksa yazacak kategori de yok
}
function downloadWallpaper(){
  const cv = document.getElementById("wpCanvas");
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "suits-wallpaper.png";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }, "image/png");
}

/* ================= yazdırma sayfası ================= */
function buildPrintSheet(){
  const el = document.getElementById("printsheet");
  const sol = solutions ? solutions[altIndex] : null;
  const S = T();
  if (!sol){ el.innerHTML = ""; return; }

  const occ = {}; let maxDay = 4, maxSlot = 10;
  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    if (m.d > maxDay) maxDay = m.d;
    if (m.s + m.du - 1 > maxSlot) maxSlot = m.s + m.du - 1;
    occ[m.d*NSLOT+m.s] = occ[m.d*NSLOT+m.s] || [];
    occ[m.d*NSLOT+m.s].push({code:sol.codes[i], type:cls.type, p:m.p, du:m.du});
    for (let k=1;k<m.du;k++) occ[m.d*NSLOT+m.s+k] = occ[m.d*NSLOT+m.s+k] || ["skip"];
  })));
  const nD = maxDay+1, nS = Math.min(NSLOT, maxSlot+1);

  let grid = `<table class="ps-grid"><thead><tr><th></th>` +
    S.days.slice(0,nD).map(d=>`<th>${d}</th>`).join("") + `</tr></thead><tbody>`;
  for (let s=0;s<nS;s++){
    grid += `<tr><td class="pt">${slotStart(s)}</td>`;
    for (let d=0;d<nD;d++){
      const cell = occ[d*NSLOT+s];
      if (!cell) { grid += `<td></td>`; continue; }
      const real = cell.filter(x => x !== "skip");
      grid += `<td>` + real.map(it =>
        `<div class="ps-blk"><b>${it.code}${it.type?" "+it.type:""}</b><i>${it.p||""}</i></div>`).join("") + `</td>`;
    }
    grid += `</tr>`;
  }
  grid += `</tbody></table>`;

  const crns = [];
  const order = sol.codes.map((c,i)=>i).sort((a,b)=>selected.indexOf(sol.codes[a]) - selected.indexOf(sol.codes[b]));
  const rows = order.map(i => {
    const code = sol.codes[i], c = BY[code];
    return sol.picks[i].picks.map(({cls,sec}) => {
      crns.push(sec.crn);
      const t = sec.mt.map(m => `${S.daysS[m.d]} ${rangeLabel(m.s,m.du)}`).join(", ") || "TBA";
      const pl = [...new Set(sec.mt.map(m=>m.p).filter(Boolean))].join(", ");
      return `<tr>
        <td class="c">${code}${cls.type?" "+cls.type:""}</td>
        <td>${cls.type?"":c.name}</td>
        <td class="crn">${sec.crn}</td>
        <td>${sec.group!=="0"?sec.group:""}</td>
        <td>${t}</td>
        <td>${pl}</td>
        <td>${sec.inst||""}</td>
      </tr>`;
    }).join("");
  }).join("");

  el.innerHTML =
    `<div class="ps-head"><h2>${S.psTitle}</h2><span class="ps-term">${TERM||""}</span>
       <span class="ps-meta">${selected.length} ${S.psCourses} · ${sol.mask.size} ${S.psHours}</span></div>
     ${grid}
     <table class="ps-list"><thead><tr>
       <th>${S.psCode}</th><th>${S.psName}</th><th>CRN</th><th>${S.psSection}</th>
       <th>${S.psTime}</th><th>${S.psRoom}</th><th>${S.psInst}</th>
     </tr></thead><tbody>${rows}</tbody></table>
     <div class="ps-crns"><b>CRN</b> &nbsp; <span>${crns.join("  ")}</span></div>`;
}
/* Artık düğmeyle sayfa yazdırılmıyor (onun yerine "Tabloyu indir" A4 PNG
   üretiyor). Kullanıcı kendi isteğiyle Ctrl+P yaparsa yazdırma sayfası yine
   düzgün çıksın diye tarayıcının kendi olayına bağlandı. */
window.addEventListener("beforeprint", buildPrintSheet);

/* ================= kayıtlı planlar ================= */
let PLANS = [];
let ACTIVE_PLAN = "";
function savePlans(){ try{ localStorage.setItem("dk-plans", JSON.stringify(PLANS)); }catch(e){} }
function planState(){
  return {p:pool.slice(), s:selected.slice(), q:MUST.slice(), w:PREF.slice(), md:MODE, mn:JSON.parse(JSON.stringify(MANUAL)),
          n:MAXSEL, nlo:MINSEL, clo:MINCR, chi:MAXCR,
          k:JSON.parse(JSON.stringify(PINNED)),
          i:JSON.parse(JSON.stringify(INSTREQ)),
          e:PREFS.early, l:PREFS.late, o:PREFS.off.slice(), m:MAJOR, a:ADMIT};
}
function planSummary(st){
  const codes = (st.s && st.s.length) ? st.s : (st.p || []);
  return codes.slice(0,3).join(" · ") + (codes.length > 3 ? " +" + (codes.length-3) : "");
}
function savePlan(){
  const inp = document.getElementById("planName");
  const name = (inp.value || "").trim() || `${T().planWord} ${PLANS.length + 1}`;
  const st = planState();
  const i = PLANS.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
  if (i >= 0) PLANS[i] = {name, st}; else PLANS.push({name, st});
  ACTIVE_PLAN = name;
  inp.value = "";
  savePlans(); renderPlans();
}
function loadPlan(name){
  const p = PLANS.find(x => x.name === name);
  if (!p) return;
  applyState(p.st);
  ACTIVE_PLAN = name;
  if (p.st.m !== MAJOR || !CURMAP) loadCurriculum(); else render();
  renderPlans();
}
function deletePlan(name){
  PLANS = PLANS.filter(p => p.name !== name);
  if (ACTIVE_PLAN === name) ACTIVE_PLAN = "";
  savePlans(); renderPlans();
}
function renderPlans(){
  const bar = document.getElementById("planBar");
  const S = T();
  bar.innerHTML =
    `<span class="qlbl">${S.plans}</span>` +
    (PLANS.length
      ? `<span class="planlist">` + PLANS.map(p =>
          `<button class="planch${p.name===ACTIVE_PLAN?" on":""}" data-name="${p.name.replace(/"/g,"&quot;")}" title="${planSummary(p.st)}">
             ${p.name}<span class="x" data-del="1">×</span></button>`).join("") + `</span>`
      : `<span class="planempty">${S.plansEmpty}</span>`) +
    `<input id="planName" placeholder="${S.planPh}" maxlength="24">
     <button class="btn tiny" id="btnSavePlan">${S.planSave}</button>
     <span class="planacts">
       <button class="btn tiny" id="btnShare">${S.share}</button>
       <button class="btn tiny" id="btnWall">${S.wallpaper}</button>
       <button class="btn tiny" id="btnShot">${S.shot}</button>
     </span>`;
  bar.querySelectorAll(".planch").forEach(el => el.onclick = e => {
    if (e.target.dataset.del) deletePlan(el.dataset.name);
    else loadPlan(el.dataset.name);
  });
  bar.querySelector("#btnSavePlan").onclick = savePlan;
  bar.querySelector("#btnShare").onclick = e => {
    shareLink();
    e.target.textContent = T().shareOk;
    setTimeout(()=>e.target.textContent = T().share, 1800);
  };
  bar.querySelector("#btnShot").onclick = downloadA4;
  bar.querySelector("#btnWall").onclick = openWallpaper;
  bar.querySelector("#planName").addEventListener("keydown", e => { if (e.key === "Enter") savePlan(); });
}

/* ================= otomatik öneri =================
   Eski sürüm önce C(havuz, n) alt kümelerini sayıyor, her biri için ayrı bir
   çakışmasız arama çalıştırıyordu. 8-10 derslik havuzda bu, seviye başına
   ayrılan süreyi doldurup "kısaltıldı" diyerek olduğundan küçük bir program
   öneriyordu.

   Yenisi tek bir aramada hem hangi derslerin alınacağını hem de her dersin
   hangi section'ını kullanacağını birlikte seçiyor. Arama YALNIZCA çakışmasız
   dizilimler üretiyor: sitenin birinci amacı çakışmasız program, ders sayısı
   ve kredi ondan sonra geliyor. Her adımda ders ya uyan bir section'la alınır
   ya da (kesin değilse) atlanır; "kalanların hepsini alsam bile eldekini
   geçemem" olan dallar budanır. */
const PLAN_BUDGET_MS = 6000;    // tüm arama için üst süre
const PLAN_TARGET_MS = 1400;    // tek bir ders sayısı hedefine ayrılan süre
const PLAN_POLISH_MS = 400;     // hedef tutunca krediyi iyileştirmek için ek süre
const PLAN_NODE_CAP  = 6000000;

/* Belirli bir ders sayısını (target) tam olarak tutturan, çakışmasız bir seçim ara.
   Hedefin sabit olması budamayı çok güçlendiriyor: "kalanların hepsini alsam bile
   hedefe ulaşamam" olan dallar anında kesiliyor. Bu yüzden hedef yüksekten başlayıp
   iner; ilk tutan hedef kazanır, yani ders sayısı her zaman önceliklidir. */
/* Hedef ders sayısı sabitken iki plan arasında sıralama:
   önce "olsa iyi" dersinin sayısı, sonra kredi. Ders sayısı bu fonksiyonun
   dışında, hedefin kendisiyle zaten sabitlenmiş durumda; yani "olsa iyi"
   hiçbir zaman ders sayısından feragat ettirmez. */
const betterPlan = (pf, cr, best) => pf > best.pf || (pf === best.pf && cr > best.cr);

function searchTarget(items, target, deadline, st){
  const mask = new Set();
  let best = null, hitAt = 0;
  const walk = (i, chosen, cr, pf) => {
    if (st.stopped) return;
    if (++st.nodes > PLAN_NODE_CAP){ st.stopped = true; return; }
    if ((st.nodes & 4095) === 0){
      const now = Date.now();
      if (now > deadline || (best && now > hitAt + PLAN_POLISH_MS)){ st.stopped = true; return; }
    }
    if (chosen.length === target){
      if (cr < MINCR){ st.credMiss = true; return; }
      if (!best){ best = {n:target, cr, pf, codes:chosen.slice()}; hitAt = Date.now(); }
      else if (betterPlan(pf, cr, best)) best = {n:target, cr, pf, codes:chosen.slice()};
      return;
    }
    if (i === items.length) return;
    if (chosen.length + (items.length - i) < target) return;   // hedefe ulaşılamaz
    const it = items[i];
    if (cr + it.cr <= MAXCR){
      for (const opt of it.opts){
        let bad = false;
        for (const k of opt.mask) if (mask.has(k)){ bad = true; break; }
        if (bad) continue;
        for (const k of opt.mask) mask.add(k);
        chosen.push(it.code);
        walk(i+1, chosen, cr + it.cr, pf + (it.pref ? 1 : 0));
        chosen.pop();
        for (const k of opt.mask) mask.delete(k);
        if (st.stopped) return;
      }
    } else st.credMiss = true;
    if (!it.must) walk(i+1, chosen, cr, pf);      // kesin dersler atlanamaz
  };
  walk(0, [], 0, 0);
  return best;
}

/* Saat aralığına ve boş gün isteğine BİREBİR uyan seçenekler; geri düşüş yok.
   Bunlarla bir plan kurulabiliyorsa tercih o plandan yana kullanılır. */
function prefOpts(code){
  const ok = baseOk(code);
  return optsOf(code).filter(o => ok(o) && !optOffDay(o, PREFS.off) && optInWindow(o));
}

function planRun(optsOfCode, budgetMs){
  const items = pool
    .map(c => ({code:c, opts:optsOfCode(c), cr:credOf(c), must:isMust(c), pref:isPref(c)}))
    .filter(it => it.opts.length)
    /* Sıra: kesin → olsa iyi → belki, her grupta az seçenekli önce.
       Budama erken devreye girsin diye; ayrıca ilk bulunan plan çoğunlukla
       "olsa iyi" dersleri zaten içerir, cilalama turu da onu iyileştirir. */
    .sort((a,b) => (b.must?1:0)-(a.must?1:0) || (b.pref?1:0)-(a.pref?1:0) || a.opts.length-b.opts.length);
  const mustCount = items.filter(i => i.must).length;
  /* kesin bir ders bu seçenek kümesiyle hiç yerleşemiyorsa bu tur baştan geçersiz */
  if (mustCount < MUST.filter(c => allowedOpts(c).length).length)
    return {best:null, capped:false, credMiss:false, mustCount, hiN:0};
  const hiN = Math.min(effMax(), items.length);
  /* Alt sınır bir dilek: hedeflenen en küçük sayı wantN, ama oraya
     ulaşılamıyorsa arama daha aşağı devam eder. Eskiden burada duruyordu ve
     "havuzda çakışmasız hiçbir ikili bile yok" gibi yanlış bir cevap
     dönüyordu; oysa daha az dersle program kurulabiliyordu. */
  const wantN = Math.max(1, Math.min(MINSEL, hiN), mustCount);
  const loN = Math.max(1, mustCount);

  /* Her hedefe kendi süre dilimi veriliyor. Üstteki hedefin "olmuyor" ispatı
     pahalı olabiliyor; tüm bütçeyi orada harcayıp alttaki hedeflere hiç sıra
     gelmemesi, kullanıcıya boş sonuç dönmek demekti. */
  const deadline = Date.now() + budgetMs;
  const st = {nodes:0, stopped:false, credMiss:false};
  let best = null, higherCut = false;
  for (let target = hiN; target >= loN; target--){
    const now = Date.now();
    if (now > deadline){ higherCut = true; break; }
    st.stopped = false;
    const r = searchTarget(items, target, Math.min(deadline, now + PLAN_TARGET_MS), st);
    if (r){ best = r; break; }                 // hedef tuttu, daha büyüğü zaten denendi
    if (st.stopped) higherCut = true;          // bu hedef taranamadı, mümkün olabilirdi
  }
  return {best, capped:higherCut, credMiss:st.credMiss, mustCount, hiN, wantN,
          belowMin: !!best && best.n < wantN};
}

/* Önce tercihlere birebir uyan bir plan aranır. Aynı ders sayısına ulaşabiliyorsa
   o kazanır; ulaşamıyorsa ders sayısı tercihten önce gelir ve gevşek tur seçilir.
   Tercih yoksa tek tur yeter. */
function bestPlan(){
  const prefsOn = PREFS.off.length > 0 || PREFS.early > 0 || PREFS.late < NSLOT-1;
  if (!prefsOn) return planRun(allowedOpts, PLAN_BUDGET_MS);
  const strict = planRun(prefOpts, Math.round(PLAN_BUDGET_MS * 0.45));
  const loose  = planRun(allowedOpts, Math.round(PLAN_BUDGET_MS * 0.55));
  if (strict.best && (!loose.best || strict.best.n >= loose.best.n)) return strict;
  return loose;
}

function autoSuggest(){
  if (!pool.length) return {n:0};
  const r = bestPlan();
  if (!r.best){
    /* kesin dersler kendi aralarında yerleşmiyorsa bunu ayrıca söyle */
    if (r.mustCount > 1){
      const m = MUST.filter(c => allowedOpts(c).length);
      const lists = m.map(c => allowedOpts(c));
      if (m.length && existsCF(lists, 1000000) === false)
        return {n:0, mustClash:m.slice()};
    }
    return {n:0, credMiss:r.credMiss, capped:r.capped};
  }
  /* Otomatik kurulum tikleri baştan yazar: ne eklendi ne çıkarıldı, söylenir.
     "Mavi tik" = programda olan ders; bu düğme o kümeyi yeniden kuruyor. */
  const was = selected.slice();
  selected = r.best.codes.slice().sort((a,b)=>pool.indexOf(a)-pool.indexOf(b));
  altIndex = 0; render();
  const dropped = pool.filter(c => !selected.includes(c));
  return {n:r.best.n, cred:r.best.cr, capped:r.capped,
          short: r.best.n < r.hiN, belowMin:r.belowMin, wantN:r.wantN, dropped,
          added: selected.filter(c => !was.includes(c)),
          removed: was.filter(c => !selected.includes(c))};
}

/* ================= olaylar ================= */
document.getElementById("btnAuto").onclick = e => {
  const label = T().auto;
  e.target.textContent = T().calc;
  setTimeout(() => {
    const r = autoSuggest();
    e.target.textContent = label;
    const S = document.getElementById("vSub");
    if (!r.n){
      S.textContent = r.mustClash ? T().mustClash(r.mustClash.join(", "))
                    : r.credMiss  ? T().autoNoRange(MINSEL, effMax(), MINCR, MAXCR)
                                  : T().autoNone;
      if (r.mustClash) paintFix(r.mustClash);
    } else {
      /* Neden bu program: kaç ders oldu, alt sınır tutmadıysa niye, hangi
         dersler dışarıda kaldı ve tiklerde ne değişti. Hepsi tek satırda. */
      const parts = [];
      if (r.belowMin) parts.push(T().autoBelowMin(r.wantN, r.n));
      else if (r.short) parts.push(T().autoShort(effMax(), r.n));
      if ((r.short || r.belowMin) && r.dropped && r.dropped.length)
        parts.push(T().autoDropped(r.dropped.join(", ")));
      if ((r.added && r.added.length) || (r.removed && r.removed.length))
        parts.push(T().autoChanged((r.added||[]).join(", "), (r.removed||[]).join(", ")));
      if (parts.length) S.textContent = parts.join(" ");
    }
    if (r.capped) S.textContent += T().autoCapped;
  }, 20);
};

const selMinSel = document.getElementById("selMin");
const selMaxSel = document.getElementById("selMax");
const crMinSel  = document.getElementById("crMin");
const crMaxSel  = document.getElementById("crMax");

const fillRange = (el, lo, hi, val) => {
  el.innerHTML = "";
  for (let i = lo; i <= hi; i++) el.insertAdjacentHTML("beforeend", `<option value="${i}">${i}</option>`);
  el.value = String(Math.min(Math.max(val, lo), hi));
};
function syncRangeUI(){
  fillRange(selMinSel, 1, SEL_HI, MINSEL);
  fillRange(selMaxSel, 1, SEL_HI, MAXSEL);
  fillRange(crMinSel, 0, CRED_HI, MINCR);
  fillRange(crMaxSel, 0, CRED_HI, MAXCR);
}
function saveRanges(){
  try{
    localStorage.setItem("dk-range", JSON.stringify({a:MINSEL, b:MAXSEL, c:MINCR, d:MAXCR}));
  }catch(e){}
}
/* bir uç değişince diğerini geçmesin: min büyürse max onu takip eder, tersi de */
function onRangeChange(which){
  const before = {a:MINSEL, b:MAXSEL, c:MINCR, d:MAXCR};
  /* Boş ya da listede olmayan bir değer okunursa (+"" === 0) sınırı
     bozmak yerine mevcut değeri koru. */
  MINSEL = clampInt(selMinSel.value, 1, SEL_HI, MINSEL);
  MAXSEL = clampInt(selMaxSel.value, 1, SEL_HI, MAXSEL);
  MINCR  = clampInt(crMinSel.value,  0, CRED_HI, MINCR);
  MAXCR  = clampInt(crMaxSel.value,  0, CRED_HI, MAXCR);
  if (which === "selMin" && MAXSEL < MINSEL) MAXSEL = MINSEL;
  if (which === "selMax" && MINSEL > MAXSEL) MINSEL = MAXSEL;
  if (which === "crMin"  && MAXCR  < MINCR)  MAXCR  = MINCR;
  if (which === "crMax"  && MINCR  > MAXCR)  MINCR  = MAXCR;
  normalizeRanges();
  /* Eskiden sınır düşünce seçim sondan kesiliyordu: kesin bir ders bile
     sessizce programdan düşebiliyordu. Artık önce sınır kesin derslere göre
     yükselir, sonra en düşük seviyeden yer açılır ve çıkarılanlar yazılır. */
  const oldMax = before.b;
  raiseCapForMust();
  const cut = trimToCap();
  syncRangeUI(); saveRanges();
  altIndex = 0; render();
  if (cut.length)
    capNote(T().capTrim(cut.join(", "), MAXSEL), T().capTrimAct(oldMax), () => {
      MAXSEL = clampInt(oldMax, 1, SEL_HI, MAXSEL);
      if (MINSEL > MAXSEL) MINSEL = MAXSEL;
      cut.forEach(c => { if (pool.includes(c) && !selected.includes(c)) selected.push(c); });
      normalizeRanges(); syncRangeUI(); saveRanges();
      altIndex = 0; render();
      capNote(T().capUndo);
    });
}
selMinSel.onchange = () => onRangeChange("selMin");
selMaxSel.onchange = () => onRangeChange("selMax");
crMinSel.onchange  = () => onRangeChange("crMin");
crMaxSel.onchange  = () => onRangeChange("crMax");

/* ================= başlangıç ================= */
try{
  const L = +localStorage.getItem("dk-limit");          // eski sürüm: tek limit
  if (L >= 1 && L <= SEL_HI) MAXSEL = L;
  const R = JSON.parse(localStorage.getItem("dk-range") || "null");
  if (R && typeof R === "object"){
    if (R.a >= 1 && R.a <= SEL_HI)  MINSEL = R.a;
    if (R.b >= 1 && R.b <= SEL_HI)  MAXSEL = R.b;
    if (R.c >= 0 && R.c <= CRED_HI) MINCR  = R.c;
    if (R.d >= 0 && R.d <= CRED_HI) MAXCR  = R.d;
  }
  normalizeRanges();
  const P = JSON.parse(localStorage.getItem("dk-pool") || "[]");
  if (Array.isArray(P)) pool = P.filter(c => BY[c]);
  const MD = localStorage.getItem("dk-mode"); if (MD === "manual" || MD === "auto") MODE = MD;
  const MN = JSON.parse(localStorage.getItem("dk-manual") || "null");
  if (MN && typeof MN === "object") MANUAL = MN;
  const MU = JSON.parse(localStorage.getItem("dk-must") || "[]");
  if (Array.isArray(MU)) MUST = MU.filter(c => pool.includes(c));
  const PF = JSON.parse(localStorage.getItem("dk-pref") || "[]");
  if (Array.isArray(PF)) PREF = PF.filter(c => pool.includes(c) && !MUST.includes(c));
  const S = JSON.parse(localStorage.getItem("dk-sel") || "[]");
  /* Kayıttan geleni sondan kesmiyoruz: önce kesin dersler garanti, sonra
     gerekiyorsa en düşük seviyeden yer açılır (bozuk kayda karşı koruma). */
  if (Array.isArray(S)) selected = S.filter(c => pool.includes(c));
  MUST.forEach(c => { if (!selected.includes(c)) selected.push(c); });   // kesin ders daima seçili
  if (MUST.length > MAXSEL) MAXSEL = Math.min(SEL_HI, MUST.length);
  BOOT_TRIM = trimToCap();
  const M = localStorage.getItem("dk-major"); if (MAJORS.includes(M)) MAJOR = M;
  const A = localStorage.getItem("dk-admit"); if (ADMITS.includes(A)) ADMIT = A;
  const PR = JSON.parse(localStorage.getItem("dk-prefs") || "null");
  if (PR && typeof PR === "object"){
    if (Number.isInteger(PR.early)) PREFS.early = PR.early;
    if (Number.isInteger(PR.late)) PREFS.late = PR.late;
    if (Array.isArray(PR.off)) PREFS.off = PR.off.filter(Number.isInteger);
  }
  const PN = JSON.parse(localStorage.getItem("dk-pins") || "{}");
  if (PN && typeof PN === "object") Object.assign(PINNED, PN);
  const IQ = JSON.parse(localStorage.getItem("dk-inst") || "{}");
  if (IQ && typeof IQ === "object") Object.assign(INSTREQ, IQ);
  const PL = JSON.parse(localStorage.getItem("dk-plans") || "[]");
  if (Array.isArray(PL)) PLANS = PL.filter(x => x && x.name && x.st);
}catch(e){}

/* ================= kullanım rehberi =================
   İlk açılışta bir kez gösterilir (dk-guide), sonra üstteki "?" ile açılır.
   Görseller SVG olarak burada üretiliyor: dış dosya yok, file:// ile de çalışır. */
const GD_SEEN = "dk-guide";
let gdI = 0;
const gdBox   = document.getElementById("guide");
/* küçük çizim parçaları */
const gdRect = (x,y,w,h,f,r=4,o=1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" opacity="${o}"/>`;
const gdLine = (x1,y1,x2,y2) => `<path d="M${x1} ${y1}H${x2}" stroke="var(--line2)" stroke-width="1"/>`;
const gdCard = (x,y,w,h) => gdRect(x,y,w,h,"var(--surface)",8) +
  `<rect x="${x+.5}" y="${y+.5}" width="${w-1}" height="${h-1}" rx="8" fill="none" stroke="var(--line2)"/>`;
/* 5 günlük mini takvim; blocks: [gün(0-4), üstten oran, yükseklik, renk] */
function gdMini(x, y, w, h, blocks, dim = -1, band = null){
  const cw = w / 5;
  let s = gdCard(x, y, w, h);
  for (let d = 1; d < 5; d++) s += `<path d="M${x + d*cw} ${y+12}V${y+h-4}" stroke="var(--line)" stroke-width="1"/>`;
  s += gdLine(x, y+12, x+w, y+12);
  if (dim >= 0) s += gdRect(x + dim*cw + 1, y+13, cw-2, h-16, "var(--sunken)", 3);
  if (band){                                   // kapalı saat aralığı (tercih ekranı)
    const [top, ht] = band;
    s += gdRect(x+1, y+13+top, w-2, ht, "var(--sunken)", 3, .95) +
      `<path d="M${x+1} ${y+13+top+ht}H${x+w-1}" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>`;
  }
  for (const [d, top, ht, c] of blocks)
    s += gdRect(x + d*cw + 2.5, y + 14 + top, cw - 5, ht, c, 3, .9);
  return s;
}
const gdWrap = (inner) => `<svg viewBox="0 0 320 132" role="img" aria-hidden="true">${inner}</svg>`;
const GD_ARROW = (x,y) => `<path d="M${x} ${y}h20m-6-5 6 5-6 5" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;

function gdPaint(){
  const S = T(), steps = S.gdSteps, n = steps.length;
  gdI = Math.min(Math.max(gdI, 0), n - 1);
  document.getElementById("gdArt").innerHTML = (GD_ART[gdI] || GD_ART[0])();
  document.getElementById("gdStep").textContent = S.gdStep(gdI + 1, n);
  document.getElementById("gdTitle").textContent = steps[gdI].t;
  document.getElementById("gdText").innerHTML = steps[gdI].d;
  document.getElementById("gdDots").innerHTML =
    steps.map((_, i) => `<button class="gddot${i === gdI ? " on" : ""}" data-i="${i}" aria-label="${i+1}"></button>`).join("");
  const back = document.getElementById("gdBack"), skip = document.getElementById("gdSkip"), next = document.getElementById("gdNext");
  back.textContent = S.gdBack; skip.textContent = S.gdSkip;
  next.textContent = gdI === n - 1 ? S.gdDone : S.gdNext;
  back.hidden = gdI === 0;
  skip.hidden = gdI === n - 1;
}
function gdOpen(i){
  gdI = i || 0;
  gdBox.hidden = false;
  gdPaint();
  document.getElementById("gdNext").focus({preventScroll:true});
}
function gdClose(){
  gdBox.hidden = true;
  try{ localStorage.setItem(GD_SEEN, "1"); }catch(e){}
}
function gdGo(d){
  const n = T().gdSteps.length;
  if (gdI + d >= n){ gdClose(); return; }
  gdI = Math.max(0, gdI + d);
  gdPaint();
}
document.getElementById("btnHelp").onclick = () => gdOpen(0);
document.getElementById("gdNext").onclick  = () => gdGo(1);
document.getElementById("gdBack").onclick  = () => gdGo(-1);
document.getElementById("gdSkip").onclick  = gdClose;
document.getElementById("gdClose").onclick = gdClose;
document.getElementById("gdDots").addEventListener("click", e => {
  const b = e.target.closest(".gddot");
  if (b){ gdI = +b.dataset.i; gdPaint(); }
});
gdBox.addEventListener("click", e => { if (e.target === gdBox) gdClose(); });
document.addEventListener("keydown", e => {
  if (gdBox.hidden) return;
  if (e.key === "Escape"){ gdClose(); }
  else if (e.key === "ArrowRight"){ gdGo(1); }
  else if (e.key === "ArrowLeft"){ gdGo(-1); }
});
/* ilk ziyaret: veriler yerleşsin diye kısa bir gecikmeyle aç */
try{
  if (!localStorage.getItem(GD_SEEN)) setTimeout(() => { if (gdBox.hidden) gdOpen(0); }, 700);
}catch(e){}

function setLang(l){
  if (l === LANG) return;
  LANG = l;
  try{ localStorage.setItem("dk-lang", l); }catch(e){}
  applyStatic(); refreshBrand(); rebuildSubjects(); buildLvl(); buildCurSelectors(); render(); repaintChip();
  const note = document.getElementById("curNote");
  if (note) note.textContent = !MAJOR ? T().curHint : (CURMAP ? T().curOk(MAJOR, ADMIT) : T().curFail);
}
document.getElementById("modesw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
