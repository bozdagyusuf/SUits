});
document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (btn) setLang(btn.dataset.lang);
});
/* üst barın gerçek yüksekliğini ölç: dil, pencere genişliği ve sarma
   durumuna göre değiştiği için sabit bir sayı tutmuyor */
function syncRailTop(){
  const h = document.querySelector("header.top");
  if (!h) return;
  const fixed = getComputedStyle(h).position === "sticky";
  const t = fixed ? Math.round(h.getBoundingClientRect().height) + 12 : 12;
  document.documentElement.style.setProperty("--railtop", t + "px");
}
window.addEventListener("resize", syncRailTop);

/* ================= panelleri katlama =================
   Program kurulduktan sonra sol havuz paneli yer kaplıyor; her panelin
   başlığındaki ok düğmesiyle içeri kapanabiliyor ve tercih hatırlanıyor. */
const FOLDABLE = ["poolPanel","manualPanel","gridPanel","altPanel","secPanel","mtxPanel"];
/* katlama oku: yönü CSS döndürüyor, ikon hep aynı */
const CHEV = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>';
let FOLDED = {};
try{ FOLDED = JSON.parse(localStorage.getItem("dk-fold") || "{}") || {}; }catch(e){}
function setFold(id, on){
  const p = document.getElementById(id);
  if (!p) return;
  p.classList.toggle("folded", on);
  FOLDED[id] = on;
  const b = p.querySelector(":scope > h2 > .foldbtn");
  if (b){ b.setAttribute("aria-expanded", String(!on)); b.title = T().foldTip; }
  syncRail();
  try{ localStorage.setItem("dk-fold", JSON.stringify(FOLDED)); }catch(e){}
}
/* soldaki panel kapaliysa sutunu daralt: kazanilan yer programa gitsin */
function syncRail(){
  const cols = document.querySelector(".cols");
  if (!cols) return;
  const p = document.getElementById(MODE === "manual" ? "manualPanel" : "poolPanel");
  cols.classList.toggle("railfold", !!p && p.classList.contains("folded"));
}
function setFoldCtl(on){
  const c = document.getElementById("controls");
  if (!c) return;
  c.classList.toggle("folded", on);
  FOLDED.controls = on;
  const b = document.getElementById("ctFold");
  if (b){ b.setAttribute("aria-expanded", String(!on)); b.title = T().foldTip; }
  try{ localStorage.setItem("dk-fold", JSON.stringify(FOLDED)); }catch(e){}
}
function setupFolds(){
  const cb = document.getElementById("ctFold");
  if (cb && !cb.dataset.on){
    cb.dataset.on = "1";
    cb.onclick = () => setFoldCtl(!document.getElementById("controls").classList.contains("folded"));
    document.getElementById("ctSum").onclick = () => setFoldCtl(false);
  }
  setFoldCtl(!!FOLDED.controls);
  FOLDABLE.forEach(id => {
    const p = document.getElementById(id);
    if (!p) return;
    p.classList.add("foldable");
    const h = p.querySelector(":scope > h2");
    if (!h) return;
    if (!h.querySelector(".foldbtn")){
      const b = document.createElement("button");
      b.type = "button"; b.className = "foldbtn"; b.innerHTML = CHEV;
      b.setAttribute("aria-controls", id);
      b.setAttribute("aria-label", T().foldTip);
      h.appendChild(b);
      h.addEventListener("click", e => {
        /* başlıktaki diğer düğmeler (Temizle, kilitleri aç) kendi işini yapsın */
        if (e.target.closest("button") && !e.target.closest(".foldbtn")) return;
        setFold(id, !p.classList.contains("folded"));
      });
    }
    setFold(id, !!FOLDED[id]);
  });
}

function refreshBrand(){
  /* Üniversite adı her dilde ve her durumda görünür kalsın: SUits'in hangi
     okula ait olduğu sayfanın kendi metninden okunabilsin (arama motorları
     bunu meta etiketten değil, görünen içerikten çıkarıyor). */
  const S = T();
  const rest = TERM ? `${TERM} · ${S.poolCount(DATA.length)}` : S.tagline(DATA.length);
  document.getElementById("brandSub").textContent = `${S.uni} · ${rest}`;
}
applyStatic();
setupFolds();
refreshBrand();
syncRangeUI();
render();
if (BOOT_TRIM.length) capNote(T().capTrim(BOOT_TRIM.join(", "), MAXSEL));
buildLvl();
buildCurSelectors();
loadCurriculum();
document.getElementById("srcTxt").textContent = embeddedLabel();

/* ================= canlı veri: dene, olmazsa gömülüye düş =================
   Sıra:
   1) ./data.json      — kendi sitenin yanındaki dosya (kendi güncelleme işin buraya yazabilir)
   2) SUchedule deposundaki güncel data-vXX.min.json (sürümü GitHub API ile bulur)
   Hiçbiri olmazsa sayfa zaten gömülü veriyle açılmış durumda kalır. */
const SELF_SRC   = new URL("data.json", location.href).href;
/* 1. tercih: bannerweb-fetch — Sabancı BannerWeb'den her gün otomatik çekilir (AGPL-3.0) */
const BW_TERM    = "202601";
const BW_SRC     = `https://omerrifat.github.io/bannerweb-fetch/dist/${BW_TERM}-pretty.json`;
/* 2. tercih: SUchedule */
const GH_REPO    = "mustafacani/suchedule";
const GH_API     = `https://api.github.com/repos/${GH_REPO}/contents/`;
const GH_FALLBACK= `https://raw.githubusercontent.com/${GH_REPO}/master/data-v93.min.json`;
const CACHE_KEY  = "dk-data-cache";
const MAX_AGE_MS = 12 * 60 * 60 * 1000;

let chipInfo = {state:"embedded", key:"emb", when:""};
function setChip(state, text, title){
  const chip = document.getElementById("srcChip");
  chip.className = "srcchip " + state;
  document.getElementById("srcTxt").textContent = text;
  if (title) chip.title = title;
}
/* rozeti içinde bulunduğu duruma göre yeniden çiz (dil değişince) */
function repaintChip(){
  const S = T();
  if (chipInfo.key === "loading") setChip("loading", S.chipLoading, S.chipTitle);
  else if (chipInfo.key === "self") setChip("live", S.chipSelf, S.chipLiveTitle(chipInfo.when));
  else if (chipInfo.key === "live") setChip("live", chipInfo.label, S.chipLiveTitle(chipInfo.when));
  else setChip("embedded", embeddedLabel(), S.chipEmbTitle);
}
async function getJSON(url, ms=8000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function applyData(list, label, stamp){
  DATA = list;
  BY = Object.fromEntries(DATA.map(c => [c.code, c]));
  _opts.clear(); _pair.clear(); _allow.clear(); _offRep.clear(); _winRep.clear();
  pool = pool.filter(c => BY[c]);
  selected = selected.filter(c => pool.includes(c));
  altIndex = 0;
  rebuildSubjects(); refreshBrand(); render();
  const when = stamp ? new Date(stamp).toLocaleDateString(T().locale) : "";
  chipInfo = (label === T().chipSelf) ? {key:"self", when} : {key:"live", label, when};
  setChip("live", label, T().chipLiveTitle(when));
}

async function loadLive(force){
  // önbellek
  if (!force) try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < MAX_AGE_MS){
      const list = normalize(c.d);
      if (sane(list)){ applyData(list, c.label === "__SELF__" ? T().chipSelf : c.label, c.t); return; }
    }
  }catch(e){}

  chipInfo = {key:"loading"};
  setChip("loading", T().chipLoading, T().chipTitle);

  // 1) kendi sitendeki data.json — file:// ile açıldığında fetch bu şemayı
  //    desteklemiyor, boşuna denenip konsola hata basmasın
  try{
    if (location.protocol === "file:") throw 0;
    const j = await getJSON(SELF_SRC, 4000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, T().chipSelf, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label:"__SELF__"})); }catch(e){}
      return;
    }
  }catch(e){}

  // 2) bannerweb-fetch — Sabancı'nın kendi verisi, günlük güncel
  try{
    const j = await getJSON(BW_SRC, 9000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, "BannerWeb", Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label:"BannerWeb"})); }catch(e){}
      return;
    }
  }catch(e){}

  // 3) SUchedule — önce güncel dosya adını bul, bulamazsan bilinen sürümü dene
  let url = GH_FALLBACK, label = "SUchedule";
  try{
    const files = await getJSON(GH_API, 4000);
    const cand = files
      .filter(f => /^data-v\d+\.min\.json$/.test(f.name))
      .sort((a,b) => (+b.name.match(/\d+/)[0]) - (+a.name.match(/\d+/)[0]))[0];
    if (cand){ url = cand.download_url; label = "SUchedule · " + cand.name.match(/v\d+/)[0]; }
  }catch(e){}
  try{
    const j = await getJSON(url, 6000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, label, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label})); }catch(e){}
      return;
    }
  }catch(e){}

  chipInfo = {key:"emb"};
  setChip("embedded", embeddedLabel(), T().chipEmbTitle);
}

document.getElementById("srcChip").onclick = () => {
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  loadLive(true);
};
loadLive(false);
