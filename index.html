<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='description' content='Sabancı Üniversitesi ders programı planlayıcısı — çakışmasız kombinasyonları bulur.'><title>SUits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --surface2:#F5F8F8; --sunken:#E4E9EA;
  --ink:#111A1D; --muted:#5C6B70; --faint:#87979C; --line:#D2DADC; --line2:#BFCACD;
  --accent:#0B6E7F; --accent-ink:#FFFFFF; --accent-soft:#D9EDF0;
  --ok:#276E52; --ok-soft:#DBEDE4;
  --warn:#9A6608; --warn-soft:#F5E9CE;
  --bad:#A8352A; --bad-soft:#F6DFDC;
  --shadow:0 1px 2px rgba(17,26,29,.06), 0 8px 24px -12px rgba(17,26,29,.18);
  --c1:#0B6E7F; --c2:#7A4E9B; --c3:#B0561B; --c4:#2C6A3F; --c5:#9A2B58; --c6:#3B5BA5;
  --c7:#8A6A12; --c8:#1F6C86; --c9:#6B3F86; --c10:#8C3A2E; --blk-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1113; --surface:#121C1F; --surface2:#172327; --sunken:#0E181B;
    --ink:#DEE8EA; --muted:#8A9BA0; --faint:#6B7C81; --line:#223136; --line2:#2E4046;
    --accent:#4CC3D6; --accent-ink:#07191D; --accent-soft:#11313A;
    --ok:#5CBE8D; --ok-soft:#123024;
    --warn:#DCA845; --warn-soft:#33280E;
    --bad:#E5786A; --bad-soft:#381915;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --c1:#4CC3D6; --c2:#B18CD9; --c3:#E09455; --c4:#6FC08C; --c5:#E082A8; --c6:#7E9EE8;
    --c7:#D9C05C; --c8:#6FBBD4; --c9:#C79BE8; --c10:#E8917F; --blk-ink:#08161A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1113; --surface:#121C1F; --surface2:#172327; --sunken:#0E181B;
  --ink:#DEE8EA; --muted:#8A9BA0; --faint:#6B7C81; --line:#223136; --line2:#2E4046;
  --accent:#4CC3D6; --accent-ink:#07191D; --accent-soft:#11313A;
  --ok:#5CBE8D; --ok-soft:#123024;
  --warn:#DCA845; --warn-soft:#33280E;
  --bad:#E5786A; --bad-soft:#381915;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --c1:#4CC3D6; --c2:#B18CD9; --c3:#E09455; --c4:#6FC08C; --c5:#E082A8; --c6:#7E9EE8;
    --c7:#D9C05C; --c8:#6FBBD4; --c9:#C79BE8; --c10:#E8917F; --blk-ink:#08161A;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo, ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- shell ---------- */
.wrap{max-width:1280px; margin:0 auto; padding:0 20px 72px}

header.top{
  border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.top-in{max-width:1280px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{font-size:19px; font-weight:700; letter-spacing:-.02em}
.brand .sub{font-size:12px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; font-weight:500}
.counter{
  font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;
  padding:5px 11px; border-radius:999px; background:var(--sunken); border:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.counter.full{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.counter.over{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.btn{
  border:1px solid var(--line2); background:var(--surface2); padding:6px 13px;
  border-radius:7px; font-size:13.5px; font-weight:500; transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--sunken); border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.srcchip{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-family:"IBM Plex Mono",monospace;
  padding:4px 9px; border-radius:999px; border:1px solid var(--line); background:var(--sunken);
  color:var(--muted); cursor:pointer; transition:border-color .12s, background .12s;
}
.srcchip:hover{border-color:var(--accent); color:var(--accent)}
.srcchip .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.srcchip.live .dot{background:var(--ok)}
.srcchip.loading .dot{background:var(--warn)}
.srcchip.embedded .dot{background:var(--faint)}
.langsw{display:inline-flex; border:1px solid var(--line2); border-radius:999px; overflow:hidden; background:var(--surface2)}
.langsw button{
  border:0; background:transparent; padding:4px 11px; font-size:11.5px; font-weight:600;
  font-family:"IBM Plex Mono",monospace; color:var(--faint); letter-spacing:.04em;
}
.langsw button:hover{color:var(--ink)}
.langsw button.on{background:var(--accent); color:var(--accent-ink)}
.limitbox{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
.limitbox select{
  font:inherit; font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;
  background:var(--surface2); color:var(--ink); border:1px solid var(--line2);
  border-radius:7px; padding:5px 8px; cursor:pointer;
}

/* ---------- verdict ---------- */
.verdict{
  margin:22px 0 0; padding:18px 22px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow);
  display:flex; gap:20px; align-items:center; flex-wrap:wrap;
}
.verdict.ok{border-left:5px solid var(--ok)}
.verdict.warn{border-left:5px solid var(--warn)}
.verdict.bad{border-left:5px solid var(--bad)}
.verdict.idle{border-left:5px solid var(--line2)}
.v-main{flex:1 1 320px; min-width:0}
.v-title{font-family:Archivo,sans-serif; font-size:21px; font-weight:700; letter-spacing:-.015em}
.v-sub{color:var(--muted); font-size:14px; margin-top:4px}
.v-stats{display:flex; gap:26px; flex-wrap:wrap}
.stat{min-width:74px}
.stat .n{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1}
.stat .l{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:500; margin-top:3px}

/* ---------- layout ---------- */
.cols{display:grid; grid-template-columns:322px minmax(0,1fr); gap:22px; margin-top:22px; align-items:start}
@media (max-width:960px){ .cols{grid-template-columns:minmax(0,1fr)} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.panel > h2{
  font-size:12px; letter-spacing:.11em; text-transform:uppercase; font-weight:600; color:var(--muted);
  padding:13px 16px; border-bottom:1px solid var(--line); background:var(--surface2);
  display:flex; align-items:center; gap:8px;
}
.panel > h2 .hint{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; color:var(--faint); font-size:11.5px}
.pbody{padding:14px 16px}

/* ---------- search + pool ---------- */
.searchwrap{padding:12px 14px; border-bottom:1px solid var(--line); background:var(--surface2); position:relative}
.searchrow{display:flex; gap:8px; flex-wrap:wrap}
#q{
  flex:1; min-width:0; font:inherit; font-size:13.5px; padding:8px 11px; border-radius:8px;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink);
}
#q::placeholder{color:var(--faint)}
#subj{
  font:inherit; font-family:"IBM Plex Mono",monospace; font-size:12px; padding:8px 6px; border-radius:8px;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink); max-width:96px; cursor:pointer;
}
.results{max-height:290px; overflow-y:auto; border-top:1px solid var(--line); background:var(--surface)}
.res{
  display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line);
  cursor:pointer; font-size:12.5px;
}
.res:hover{background:var(--accent-soft)}
.res .code{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; flex:none; width:78px}
.res .nm{color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.res .add{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:700; flex:none}
.res.have{opacity:.45; cursor:default}
.res.have .add{color:var(--faint)}
.resnote{padding:9px 14px; font-size:12px; color:var(--faint); border-bottom:1px solid var(--line)}
.poolhead{
  display:flex; align-items:baseline; gap:8px; padding:10px 16px 4px;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600;
}
.rm{
  flex:none; border:0; background:transparent; color:var(--faint); font-size:15px; line-height:1;
  padding:2px 4px; border-radius:5px;
}
.rm:hover{background:var(--bad-soft); color:var(--bad)}
.warnbar{
  margin:10px 0 0; padding:9px 12px; border-radius:8px; background:var(--warn-soft); color:var(--warn);
  font-size:12.5px; line-height:1.45;
}

/* ---------- course picker ---------- */
.rail{position:sticky; top:78px; min-width:0}
.clist{max-height:min(46vh,430px); overflow-y:auto}
@media (max-width:960px){ .rail{position:static} }
.clist{display:flex; flex-direction:column; gap:0}
.crow{
  display:flex; gap:11px; padding:11px 16px; border-bottom:1px solid var(--line);
  cursor:pointer; transition:background .1s; align-items:flex-start;
}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface2)}
.crow.on{background:var(--accent-soft)}
.crow.dim{opacity:.45}
.crow input{margin:3px 0 0; accent-color:var(--accent); width:15px; height:15px; flex:none; cursor:pointer}
.crow .txt{min-width:0; flex:1}
.crow .code{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600; letter-spacing:-.01em}
.crow .nm{font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:1px}
.crow .tags{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap}
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:500; padding:1.5px 6px;
  border-radius:4px; background:var(--sunken); color:var(--muted); border:1px solid var(--line);
}
.tag.r{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.crow .swatch{width:4px; align-self:stretch; border-radius:2px; flex:none; background:transparent}

/* ---------- grid ---------- */
.gridwrap{overflow-x:auto}
table.sched{border-collapse:separate; border-spacing:0; width:100%; min-width:660px; table-layout:fixed}
table.sched th{
  font-family:Archivo,sans-serif; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:9px 6px; border-bottom:1px solid var(--line2);
  background:var(--surface2);
}
table.sched th.tcol{width:66px}
table.sched td{
  border-bottom:1px solid var(--line); border-right:1px solid var(--line);
  height:44px; padding:0; vertical-align:top; position:relative;
}
table.sched td:last-child{border-right:0}
table.sched td.time{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--faint);
  text-align:right; padding:4px 8px 0 0; background:var(--surface2); font-variant-numeric:tabular-nums;
  border-right:1px solid var(--line2); white-space:nowrap;
}
.blk{
  position:absolute; inset:2px; border-radius:6px; padding:5px 7px; overflow:hidden;
  color:var(--blk-ink); display:flex; flex-direction:column; justify-content:flex-start;
}
.blk .bc{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; line-height:1.2}
.blk .bm{font-size:10px; opacity:.85; line-height:1.25; margin-top:1px}
.blk.half{inset:2px 2px 2px 2px; width:calc(50% - 3px)}
.blk.half2{left:50%; width:calc(50% - 3px)}
td.clash{background:
  repeating-linear-gradient(45deg, var(--bad-soft) 0 6px, transparent 6px 12px);
}
td.clash::after{
  content:""; position:absolute; inset:0; border:2px solid var(--bad); border-radius:2px; pointer-events:none;
}

/* ---------- sections ---------- */
.secgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:11px}
.sec{border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:var(--surface2); border-left-width:4px}
.sec h3{font-family:"IBM Plex Mono",monospace; font-size:13.5px; font-weight:600; display:flex; align-items:baseline; gap:7px}
.sec .cn{font-size:12px; color:var(--muted); margin:2px 0 8px; font-family:"IBM Plex Sans",sans-serif; line-height:1.35}
.sec .row{display:flex; gap:8px; font-size:12px; padding:3px 0; border-top:1px solid var(--line); align-items:baseline}
.sec .row:first-of-type{border-top:0}
.sec .k{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600; color:var(--faint); width:34px; flex:none; letter-spacing:.04em}
.sec .v{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-variant-numeric:tabular-nums}
.sec .pl{color:var(--muted); font-family:"IBM Plex Sans",sans-serif; font-size:11.5px}

/* ---------- matrix ---------- */
.mtx{overflow-x:auto}
table.matrix{border-collapse:collapse; font-family:"IBM Plex Mono",monospace; font-size:10.5px}
table.matrix th{font-weight:500; color:var(--muted); padding:3px 5px; white-space:nowrap}
table.matrix th.rowh{text-align:right; padding-right:9px; color:var(--ink); font-weight:600}
table.matrix th.colh{writing-mode:vertical-rl; transform:rotate(180deg); height:78px; vertical-align:bottom; padding-bottom:5px}
table.matrix td{width:26px; height:26px; text-align:center; border:1px solid var(--surface); border-radius:0}
.m-ok{background:var(--ok-soft); color:var(--ok)}
.m-bad{background:var(--bad-soft); color:var(--bad); font-weight:600}
.m-self{background:var(--sunken); color:var(--faint)}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--muted); align-items:center}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px}

.alts{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.altbtn{
  border:1px solid var(--line2); background:var(--surface2); border-radius:7px; padding:7px 11px;
  font-size:12px; text-align:left; line-height:1.35; min-width:132px;
}
.altbtn.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.altbtn b{display:block; font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600}
.altbtn span{color:var(--muted); font-size:10.5px}
.altbtn.on span{color:var(--accent); opacity:.8}

.empty{padding:34px 20px; text-align:center; color:var(--faint); font-size:13.5px}
.note{font-size:12.5px; color:var(--muted); line-height:1.55}
.stack{display:flex; flex-direction:column; gap:22px; min-width:0}
.pairlist{display:flex; flex-direction:column; gap:6px; margin-top:2px}
.pair{
  display:flex; align-items:center; gap:9px; font-size:12.5px; padding:6px 9px;
  border-radius:7px; background:var(--bad-soft); border:1px solid transparent;
}
.pair .mono{font-weight:600; font-size:12px}
.pair .x{color:var(--bad); font-weight:700}
.pair .when{margin-left:auto; color:var(--muted); font-size:11px; font-family:"IBM Plex Mono",monospace}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head><body><header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>SUits</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <span class="langsw" id="langsw">
      <button data-lang="tr">TR</button><button data-lang="en">EN</button>
    </span>
    <button class="srcchip embedded" id="srcChip">
      <span class="dot"></span><span id="srcTxt"></span>
    </button>
    <span class="limitbox"><span id="lblLimit"></span>
      <select id="limit">
        <option>3</option><option>4</option><option>5</option><option selected>6</option>
        <option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
    </span>
    <span class="counter" id="counter">0 / 6</span>
    <button class="btn" id="btnClear"></button>
    <button class="btn primary" id="btnAuto"></button>
  </div>
</header>

<div class="wrap">

  <div class="verdict idle" id="verdict">
    <div class="v-main">
      <div class="v-title" id="vTitle"></div>
      <div class="v-sub" id="vSub"></div>
    </div>
    <div class="v-stats" id="vStats"></div>
  </div>

  <div class="cols">

    <div class="rail">
      <div class="panel">
        <h2><span id="lblPool"></span> <span class="hint" id="poolHint"></span></h2>

        <div class="searchwrap">
          <div class="searchrow">
            <input id="q" type="search" autocomplete="off">
            <select id="subj"><option value="">Tümü</option></select>
          </div>
        </div>
        <div class="results" id="results" hidden></div>

        <div class="poolhead" id="poolHead" hidden></div>
        <div class="clist" id="clist"></div>
      </div>
    </div>

    <div class="stack">

      <div class="panel">
        <h2><span id="lblGrid"></span> <span class="hint" id="gridHint">—</span></h2>
        <div class="gridwrap"><table class="sched" id="sched"></table></div>
      </div>

      <div class="panel" id="altPanel" hidden>
        <h2><span id="lblAlt"></span> <span class="hint" id="hintAlt"></span></h2>
        <div class="pbody"><div class="alts" id="alts"></div></div>
      </div>

      <div class="panel" id="secPanel" hidden>
        <h2><span id="lblSec"></span> <span class="hint" id="crnHint"></span></h2>
        <div class="pbody">
          <div class="secgrid" id="secgrid"></div>
          <div style="margin-top:13px"><button class="btn" id="btnCrn"></button></div>
        </div>
      </div>

      <div class="panel" id="mtxPanel" hidden>
        <h2><span id="lblMtx"></span> <span class="hint" id="hintMtx"></span></h2>
        <div class="pbody">
          <div class="mtx"><table class="matrix" id="matrix"></table></div>
          <div class="legend">
            <span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i><span id="lgOk"></span></span>
            <span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i><span id="lgBad"></span></span>
          </div>
          <div id="pairbox"></div>
        </div>
      </div>

    </div>
  </div>
</div>

   B) SUchedule ham biçimi        {places:[…], instructors:[…], courses:[{code,name,classes:[{type,sections:[…]}]}]} */
function normalize(json){
  if (json && Array.isArray(json.c) && Array.isArray(json.p)){
    const P = json.p, I = json.i || [];
    return json.c.map(([code,name,classes]) => ({
      code, name,
      classes: classes.map(([type,secs]) => ({
        type,
        sections: secs.map(([crn,group,ii,mt]) => ({
          crn, group, inst: ii >= 0 ? (I[ii]||"") : "",
          mt: mt.map(([d,s,du,p]) => ({d, s, du, p: P[p]||""}))
        }))
      }))
    }));
  }
  if (json && Array.isArray(json.courses)){
    const P = json.places || [], I = json.instructors || [];
    return json.courses.map(c => ({
      code: c.code, name: (c.name||"").trim(),
      classes: (c.classes||[]).map(cl => ({
        type: cl.type || "",
        sections: (cl.sections||[]).map(s => ({
          crn: String(s.crn), group: s.group ?? "0",
          inst: typeof s.instructors === "number" ? (I[s.instructors]||"") : "",
          mt: (s.schedule||[]).map(x => ({
            d: x.day, s: x.start, du: x.duration, p: P[x.place] || ""
          }))
        }))
      }))
    }));
  }
  throw new Error("Tanınmayan veri biçimi");
}

/* ================= section kombinasyonları (tembel) ================= */
const _opts = new Map();
function buildOptions(course, enforceLetters){
  const lecGroups = course.classes[0].sections.map(s => s.group);
  const lettered = ENFORCE_GROUP_LETTERS && enforceLetters && lecGroups.some(g => /^[A-Za-z]+$/.test(g));
  let opts = [{picks:[], mask:new Set()}];
  for (const cls of course.classes){
    const next = [];
    for (const base of opts){
      const lecG = base.picks.length ? base.picks[0].sec.group : null;
      for (const sec of cls.sections){
        // ders section'ı harfliyse alt grup da aynı harfle başlamalı
        if (lecG !== null && lettered && /^[A-Za-z]+$/.test(lecG) &&
            !norm(sec.group).startsWith(norm(lecG))) continue;
        const mask = new Set(base.mask);
        let clash = false;
        for (const m of sec.mt) for (let k=0;k<m.du;k++){
          const key = m.d*NSLOT + m.s + k;
          if (mask.has(key)) clash = true;
          mask.add(key);
        }
        if (clash) continue;                 // ders kendi recit'iyle çakışıyorsa ele
        next.push({picks:[...base.picks, {cls, sec}], mask});
      }
    }
    opts = next;
  }
  return opts;
}
function optsOf(code){
  if (_opts.has(code)) return _opts.get(code);
  const c = BY[code];
  let o = buildOptions(c, true);
  if (!o.length) o = buildOptions(c, false);        // harf kuralı her şeyi elediyse gevşet
  if (!o.length){                                    // ders kendi içinde çakışıyor: yine de göster
    const picks = c.classes.map(cls => ({cls, sec: cls.sections[0]}));
    const mask = new Set();
    picks.forEach(({sec}) => sec.mt.forEach(m => { for(let k=0;k<m.du;k++) mask.add(m.d*NSLOT+m.s+k); }));
    o = [{picks, mask, selfClash:true}];
  }
  _opts.set(code, o);
  return o;
}

/* ================= ikili çakışma (tembel) ================= */
const _pair = new Map();
function pairOf(a,b){
  const key = a < b ? a+"|"+b : b+"|"+a;
  if (_pair.has(key)) return _pair.get(key);
  let best = Infinity, when = null;
  outer:
  for (const x of optsOf(a)) for (const y of optsOf(b)){
    let n = 0, first = null;
    for (const k of x.mask) if (y.mask.has(k)){ n++; if (first===null) first = k; }
    if (n < best){ best = n; when = first; if (!best) break outer; }
  }
  const r = {n:best, when};
  _pair.set(key, r);
  return r;
}

/* ================= çözücü ================= */
function score(mask){
  const perDay = {};
  for (const k of mask){ const d = Math.floor(k/NSLOT); (perDay[d] = perDay[d]||[]).push(k%NSLOT); }
  const days = Object.keys(perDay).length;
  let span = 0, gaps = 0, early = 0, weekdays = 0;
  for (const d in perDay){
    const ss = perDay[d].sort((a,b)=>a-b);
    const lo = ss[0], hi = ss[ss.length-1];
    span += hi-lo+1;
    gaps += (hi-lo+1) - new Set(ss).size;
    if (lo === 0) early++;
    if (+d <= 4) weekdays++;
  }
  // "boş gün" hafta içi üzerinden sayılır; cumartesi dersi varsa ayrıca görünür zaten
  return {days, span, gaps, early, free: 5 - weekdays};
}
const cmpM = (a,b) => a.days-b.days || a.gaps-b.gaps || a.span-b.span || a.early-b.early;

const LEAF_CAP = 120000;
function solve(codes){
  if (!codes.length) return null;
  // az seçenekli dersi öne al: budama daha erken devreye girer
  const order = codes.map((c,i)=>i).sort((x,y)=>optsOf(codes[x]).length - optsOf(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(optsOf);
  const count = new Map();
  let conf = 0, bestC = Infinity, leaves = 0, capped = false;
  let results = [];
  const walk = (i, picks) => {
    if (capped || conf > bestC) return;
    if (i === lists.length){
      if (++leaves > LEAF_CAP){ capped = true; return; }
      if (conf < bestC){ bestC = conf; results = []; }
      if (conf === bestC && results.length < 300){
        const mask = new Set(), conflicts = new Set();
        for (const [k,n] of count){ mask.add(k); if (n>1) conflicts.add(k); }
        results.push({codes:oc.slice(), picks:picks.slice(), mask, conflicts, c:conf, m:score(mask)});
      }
      return;
    }
    for (const opt of lists[i]){
      let added = 0;
      for (const k of opt.mask){
        const n = (count.get(k)||0) + 1;
        count.set(k, n);
        if (n === 2) conf++;
        added++;
      }
      picks.push(opt);
      walk(i+1, picks);
      picks.pop();
      for (const k of opt.mask){
        const n = count.get(k) - 1;
        if (n === 1) conf--;
        if (n) count.set(k, n); else count.delete(k);
      }
      if (capped) return;
    }
  };
  walk(0, []);
  if (!results.length) return null;
  results.sort((a,b) => a.c - b.c || cmpM(a.m, b.m));
  const out = [], seen = new Set();
  for (const r of results){
    const key = r.picks.map(p => p.picks.map(x => x.sec.crn).join("")).join("|");
    if (seen.has(key)) continue;
    seen.add(key); out.push(r);
    if (out.length >= 8) break;
  }
  out.capped = capped;
  return out;
}

/* sadece tam çakışmasız atamalar — hızlı, otomatik öneri için */
function solveCF(codes){
  const order = codes.map((c,i)=>i).sort((x,y)=>optsOf(codes[x]).length - optsOf(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(optsOf);
  const mask = new Set();
  let best = null;
  const walk = (i, picks) => {
    if (i === lists.length){
      const m = score(mask);
      if (!best || cmpM(m, best.m) < 0)
        best = {codes:oc.slice(), picks:picks.slice(), mask:new Set(mask), conflicts:new Set(), c:0, m};
      return;
    }
    for (const opt of lists[i]){
      let ok = true;
      for (const k of opt.mask) if (mask.has(k)){ ok = false; break; }
      if (!ok) continue;
      for (const k of opt.mask) mask.add(k);
      picks.push(opt); walk(i+1, picks); picks.pop();
      for (const k of opt.mask) mask.delete(k);
    }
  };
  walk(0, []);
  return best;
}

/* ================= durum ================= */
let pool = [];          // aday havuzu (ders kodları)
let selected = [];      // havuzdan programa katılanlar
let solutions = null, altIndex = 0;

const save = () => { try{
  localStorage.setItem("dk-pool", JSON.stringify(pool));
  localStorage.setItem("dk-sel", JSON.stringify(selected));
  localStorage.setItem("dk-limit", String(MAXSEL));
}catch(e){} };

function addToPool(code){
  if (pool.includes(code)) return;
  pool.push(code);
  pool.sort((a,b)=>a.localeCompare(b,"tr"));
  render();
}
function removeFromPool(code){
  pool = pool.filter(c => c !== code);
  selected = selected.filter(c => c !== code);
  altIndex = 0; render();
}
function toggle(code){
  const i = selected.indexOf(code);
  if (i >= 0) selected.splice(i,1);
  else {
    if (selected.length >= MAXSEL){
      const el = document.getElementById("counter");
      el.classList.add("over"); setTimeout(()=>el.classList.remove("over"), 700);
      return;
    }
    selected.push(code);
  }
  altIndex = 0; render();
}
const colorOf = code => `var(${PALETTE[Math.max(0,selected.indexOf(code)) % PALETTE.length]})`;

/* ================= arama ================= */
let subjects = [];
const subjSel = document.getElementById("subj");
function rebuildSubjects(){
  const keep = subjSel.value;
  subjects = [...new Set(DATA.map(c => c.code.split(" ")[0]))].sort();
  subjSel.innerHTML = `<option value="">${T().all}</option>`;
  subjects.forEach(s => { const o = document.createElement("option"); o.value = o.textContent = s; subjSel.appendChild(o); });
  if (subjects.includes(keep)) subjSel.value = keep;
}
rebuildSubjects();

function renderResults(){
  const box = document.getElementById("results");
  const q = norm(document.getElementById("q").value.trim());
  const sub = subjSel.value;
  if (!q && !sub){ box.hidden = true; box.innerHTML = ""; return; }
  const hits = DATA.filter(c => {
    if (sub && c.code.split(" ")[0] !== sub) return false;
    if (!q) return true;
    return norm(c.code).includes(q) || norm(c.name).includes(q);
  });
  box.hidden = false;
  if (!hits.length){ box.innerHTML = `<div class="resnote">${T().noMatch}</div>`; return; }
  const shown = hits.slice(0, 60);
  box.innerHTML =
    (hits.length > shown.length ? `<div class="resnote">${T().tooMany(hits.length, shown.length)}</div>` : "") +
    shown.map(c => {
      const have = pool.includes(c.code);
      return `<div class="res${have?" have":""}" data-code="${c.code}">
        <span class="code">${c.code}</span>
        <span class="nm">${c.name}</span>
        <span class="add">${have?"✓":"+"}</span>
      </div>`;
    }).join("");
  box.querySelectorAll(".res:not(.have)").forEach(el =>
    el.addEventListener("click", () => addToPool(el.dataset.code)));
}
document.getElementById("q").addEventListener("input", renderResults);
subjSel.addEventListener("change", renderResults);

/* ================= havuz listesi ================= */
function renderPool(){
  const el = document.getElementById("clist"); el.innerHTML = "";
  document.getElementById("poolHead").hidden = !pool.length;
  document.getElementById("poolHint").textContent = pool.length ? T().poolCount(pool.length) : T().poolEmpty;
  if (!pool.length){
    el.innerHTML = `<div class="empty">${T().emptyPool}</div>`;
  }
  pool.forEach(code => {
    const c = BY[code];
    const on = selected.includes(code);
    const blocked = !on && selected.some(s => pairOf(s, code).n > 0);
    const extras = c.classes.filter(cl => cl.type !== "");
    const selfClash = optsOf(code)[0].selfClash;
    const row = document.createElement("div");
    row.className = "crow" + (on?" on":"") + (blocked?" dim":"");
    row.innerHTML =
      `<span class="swatch" style="background:${on?colorOf(code):"transparent"}"></span>
       <input type="checkbox" ${on?"checked":""} aria-label="${c.code}">
       <span class="txt">
         <span class="code">${c.code}</span>
         <div class="nm">${c.name}</div>
         <div class="tags">
           <span class="tag">${T().secTag(c.classes[0].sections.length)}</span>
           ${extras.map(cl=>`<span class="tag r">${T().types[cl.type]||cl.type} ×${cl.sections.length}</span>`).join("")}
           ${selfClash?`<span class="tag r">${T().selfClash}</span>`:""}
         </div>
       </span>
       <button class="rm" title="${T().removeTitle}">×</button>`;
    row.querySelector("input").addEventListener("change", () => toggle(code));
    row.querySelector(".txt").addEventListener("click", () => toggle(code));
    row.querySelector(".rm").addEventListener("click", e => { e.stopPropagation(); removeFromPool(code); });
    el.appendChild(row);
  });
  document.getElementById("poolHint").textContent = pool.length ? T().poolCount(pool.length) : T().poolEmpty;
  const cn = document.getElementById("counter");
  cn.textContent = selected.length + " / " + MAXSEL;
  cn.classList.toggle("full", selected.length === MAXSEL && MAXSEL > 0);
}

/* ================= program tablosu ================= */
function renderGrid(sol){
  const t = document.getElementById("sched");
  const occ = {};
  let maxDay = 4;
  if (sol) sol.picks.forEach((opt,i) => {
    const code = sol.codes[i];
    opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
      if (m.d > maxDay) maxDay = m.d;
      for (let k=0;k<m.du;k++){
        (occ[m.d*NSLOT+m.s+k] = occ[m.d*NSLOT+m.s+k]||[]).push({
          code, type:cls.type, place:m.p, first:k===0, crn:sec.crn
        });
      }
    }));
  });
  const nDays = maxDay + 1;
  let html = "<thead><tr><th class='tcol'></th>" +
    T().days.slice(0,nDays).map(d=>`<th>${d}</th>`).join("") + "</tr></thead><tbody>";
  for (let s=0;s<NSLOT;s++){
    html += `<tr><td class="time">${slotStart(s)}</td>`;
    for (let d=0;d<nDays;d++){
      const items = occ[d*NSLOT+s] || [];
      let inner = "";
      items.slice(0,2).forEach((it,n) => {
        const cls = items.length>1 ? (n===0?"blk half":"blk half half2") : "blk";
        inner += `<div class="${cls}" style="background:${colorOf(it.code)}" title="${it.code}${it.type?" "+(T().types[it.type]||it.type):""} · ${it.place||"—"} · CRN ${it.crn}">
            <span class="bc">${it.code}${it.type?" "+it.type:""}</span>
            ${it.first?`<span class="bm">${it.place||""}</span>`:""}
          </div>`;
      });
      html += `<td class="${items.length>1?"clash":""}">${inner}</td>`;
    }
    html += "</tr>";
  }
  t.innerHTML = html + "</tbody>";
}

/* ================= section kartları ================= */
function renderSections(sol){
  const p = document.getElementById("secPanel");
  if (!sol){ p.hidden = true; return; }
  p.hidden = false;
  const grid = document.getElementById("secgrid"); grid.innerHTML = "";
  const crns = [];
  const order = sol.codes.map((c,i)=>i).sort((a,b)=>selected.indexOf(sol.codes[a]) - selected.indexOf(sol.codes[b]));
  order.forEach(i => {
    const code = sol.codes[i], c = BY[code];
    const rows = sol.picks[i].picks.map(({cls,sec}) => {
      crns.push(sec.crn);
      const times = sec.mt.map(m => `${T().daysS[m.d]} ${rangeLabel(m.s,m.du)}`).join(" · ") || "TBA";
      const place = [...new Set(sec.mt.map(m=>m.p).filter(Boolean))].join(", ");
      return `<div class="row">
        <span class="k">${(T().types[cls.type]||cls.type).slice(0,4).toUpperCase()}</span>
        <span class="v">${sec.crn}</span>
        <span class="pl">${sec.group!=="0"?sec.group+" · ":""}${times}${place?" · "+place:""}</span>
      </div>`;
    }).join("");
    const div = document.createElement("div");
    div.className = "sec";
    div.style.borderLeftColor = colorOf(code);
    div.innerHTML = `<h3>${code}</h3><div class="cn">${c.name}</div>${rows}`;
    grid.appendChild(div);
  });
  document.getElementById("crnHint").textContent = T().crnCount(crns.length);
  document.getElementById("btnCrn").onclick = e => {
    navigator.clipboard.writeText(crns.join(", "));
    e.target.textContent = T().copied;
    setTimeout(()=>e.target.textContent = T().copyCrn, 1600);
  };
}

/* ================= alternatifler ================= */
function renderAlts(){
  const p = document.getElementById("altPanel");
  if (!solutions || solutions.length < 2){ p.hidden = true; return; }
  p.hidden = false;
  const box = document.getElementById("alts"); box.innerHTML = "";
  const varying = new Set();
  solutions.forEach(s => s.picks.forEach((opt,i) => opt.picks.forEach(({sec},j) => {
    if (solutions[0].picks[i].picks[j].sec.crn !== sec.crn) varying.add(i+":"+j);
  })));
  solutions.forEach((s,i) => {
    const b = document.createElement("button");
    b.className = "altbtn" + (i===altIndex?" on":"");
    const diff = [];
    s.picks.forEach((opt,ci) => {
      const g = opt.picks.filter((_,j)=>varying.has(ci+":"+j)).map(({sec})=>sec.group);
      if (g.length) diff.push(`${s.codes[ci]} · ${g.join("/")}`);
    });
    b.innerHTML = `<b>${diff.length ? diff.join(" · ") : (i===0?T().recommended:T().option(i+1))}</b>
      <span>${i===0?T().recLower+" · ":""}${s.c ? T().altClash(s.c)+" · " : ""}${T().altFree(s.m.free)} · ${T().altGaps(s.m.gaps)}</span>`;
    b.onclick = () => { altIndex = i; render(); };
    box.appendChild(b);
  });
}

/* ================= verdict ================= */
function renderVerdict(sol){
  const v = document.getElementById("verdict");
  const T = document.getElementById("vTitle"), S = document.getElementById("vSub"), St = document.getElementById("vStats");
  v.className = "verdict";
  St.innerHTML = "";
  if (!sol){
    v.classList.add("idle");
    T.textContent = pool.length ? TX().idleT2 : TX().idleT1;
    S.textContent = pool.length ? TX().idleS2 : TX().idleS1;
    document.getElementById("gridHint").textContent = "—";
    return;
  }
  const hard = [];
  for (let i=0;i<selected.length;i++) for (let j=i+1;j<selected.length;j++){
    const pr = pairOf(selected[i], selected[j]);
    if (pr.n > 0) hard.push([selected[i], selected[j]]);
  }
  if (sol.c === 0){
    v.classList.add("ok");
    T.textContent = TX().okT(selected.length);
    S.textContent = TX().okS;
  } else {
    v.classList.add(sol.c <= 1 ? "warn" : "bad");
    T.textContent = TX().badT(sol.c);
    S.innerHTML = hard.length
      ? TX().hardPairs + hard.map(([a,b])=>`<b class="mono">${a} ↔ ${b}</b>`).join(", ") + "."
      : TX().noPairClash;
  }
  St.innerHTML = [selected.length, sol.mask.size, sol.m.free, sol.m.gaps, sol.c]
    .map((n,i) => `<div class="stat"><div class="n">${n}</div><div class="l">${TX().stats[i]}</div></div>`).join("");
  document.getElementById("gridHint").textContent =
    sol.c === 0 ? TX().gridOk : TX().gridBad(sol.c);
  if (solutions && solutions.capped && sol.c > 0)
    S.innerHTML += ` <span style="color:var(--warn)">${TX().capped}</span>`;
}

/* ================= çakışma matrisi ================= */
function renderMatrix(){
  const p = document.getElementById("mtxPanel");
  if (pool.length < 2){ p.hidden = true; return; }
  p.hidden = false;
  const t = document.getElementById("matrix");
  let html = "<thead><tr><th></th>" + pool.map(c=>`<th class="colh">${c}</th>`).join("") + "</tr></thead><tbody>";
  for (const a of pool){
    html += `<tr><th class="rowh">${a}</th>`;
    for (const b of pool){
      if (a === b){ html += `<td class="m-self">·</td>`; continue; }
      const pr = pairOf(a,b);
      html += pr.n === 0
        ? `<td class="m-ok" title="${T().mtxOk(a,b)}">✓</td>`
        : `<td class="m-bad" title="${T().mtxBad(a,b,pr.n)}">✕</td>`;
    }
    html += "</tr>";
  }
  t.innerHTML = html + "</tbody>";

  const bad = [];
  for (let i=0;i<pool.length;i++) for (let j=i+1;j<pool.length;j++){
    const pr = pairOf(pool[i], pool[j]);
    if (pr.n > 0) bad.push([pool[i], pool[j], pr]);
  }
  document.getElementById("pairbox").innerHTML = bad.length
    ? `<div class="note" style="margin-top:14px">${T().pairIntro(bad.length)}</div>
       <div class="pairlist">` + bad.map(([a,b,pr]) => {
         const d = Math.floor(pr.when/NSLOT), s = pr.when%NSLOT;
         return `<div class="pair"><span class="mono">${a}</span><span class="x">✕</span><span class="mono">${b}</span>
           <span class="when">${T().pairWhen(pr.n)} · ${T().daysS[d]} ${slotStart(s)}</span></div>`;
       }).join("") + `</div>`
    : `<div class="note" style="margin-top:14px">${T().pairNone}</div>`;
}

/* ================= render ================= */
function render(){
  renderPool();
  renderResults();
  renderMatrix();
  solutions = selected.length ? solve(selected) : null;
  if (solutions && altIndex >= solutions.length) altIndex = 0;
  const sol = solutions ? solutions[altIndex] : null;
  renderVerdict(sol);
  renderGrid(sol);
  renderSections(sol);
  renderAlts();
  save();
}

/* ================= otomatik öneri ================= */
const SUBSET_CAP = 40000;
function autoSuggest(){
  if (pool.length < 2) return {n:0};
  for (let n = Math.min(MAXSEL, pool.length); n >= 2; n--){
    let best = null, bestSol = null, tried = 0, capped = false;
    const rec = (start, acc) => {
      if (capped) return;
      if (acc.length === n){
        if (++tried > SUBSET_CAP){ capped = true; return; }
        const sol = solveCF(acc);
        if (sol && (!bestSol || cmpM(sol.m, bestSol.m) < 0)){ best = acc.slice(); bestSol = sol; }
        return;
      }
      if (pool.length - start < n - acc.length) return;
      for (let i=start;i<pool.length;i++){
        if (acc.some(a => pairOf(a, pool[i]).n > 0)) continue;
        acc.push(pool[i]); rec(i+1, acc); acc.pop();
        if (capped) return;
      }
    };
    rec(0, []);
    if (best){
      selected = best.slice().sort((a,b)=>pool.indexOf(a)-pool.indexOf(b));
      altIndex = 0; render();
      return {n, capped, short: n < Math.min(MAXSEL, pool.length)};
    }
  }
  return {n:0};
}

/* ================= olaylar ================= */
document.getElementById("btnAuto").onclick = e => {
  const label = T().auto;
  e.target.textContent = T().calc;
  setTimeout(() => {
    const r = autoSuggest();
    e.target.textContent = label;
    const S = document.getElementById("vSub");
    if (!r.n){
      S.textContent = T().autoNone;
    } else if (r.short){
      S.textContent = T().autoShort(MAXSEL, r.n);
    }
    if (r.capped) S.textContent += T().autoCapped;
  }, 20);
};
document.getElementById("btnClear").onclick = () => { selected = []; altIndex = 0; render(); };

const limitSel = document.getElementById("limit");
limitSel.onchange = () => {
  MAXSEL = +limitSel.value;
  if (selected.length > MAXSEL) selected = selected.slice(0, MAXSEL);
  altIndex = 0; render();
};

}

/* ================= canlı veri: dene, olmazsa gömülüye düş =================
   Sıra:
   1) ./data.json      — kendi sitenin yanındaki dosya (kendi güncelleme işin buraya yazabilir)
   2) SUchedule deposundaki güncel data-vXX.min.json (sürümü GitHub API ile bulur)
   Hiçbiri olmazsa sayfa zaten gömülü veriyle açılmış durumda kalır. */
const SELF_SRC   = new URL("data.json", location.href).href;
const GH_REPO    = "mustafacani/suchedule";
const GH_API     = `https://api.github.com/repos/${GH_REPO}/contents/`;
const GH_FALLBACK= `https://raw.githubusercontent.com/${GH_REPO}/master/data-v93.min.json`;
const CACHE_KEY  = "dk-data-cache";
const MAX_AGE_MS = 12 * 60 * 60 * 1000;

let chipInfo = {state:"embedded", key:"emb", when:""};
function setChip(state, text, title){
  const chip = document.getElementById("srcChip");
  chip.className = "srcchip " + state;
  document.getElementById("srcTxt").textContent = text;
  if (title) chip.title = title;
}
/* rozeti içinde bulunduğu duruma göre yeniden çiz (dil değişince) */
function repaintChip(){
  const S = T();
  if (chipInfo.key === "loading") setChip("loading", S.chipLoading, S.chipTitle);
  else if (chipInfo.key === "self") setChip("live", S.chipSelf, S.chipLiveTitle(chipInfo.when));
  else if (chipInfo.key === "live") setChip("live", chipInfo.label, S.chipLiveTitle(chipInfo.when));
  else setChip("embedded", embeddedLabel(), S.chipEmbTitle);
}
async function getJSON(url, ms=8000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function applyData(list, label, stamp){
  DATA = list;
  BY = Object.fromEntries(DATA.map(c => [c.code, c]));
  _opts.clear(); _pair.clear();
  pool = pool.filter(c => BY[c]);
  selected = selected.filter(c => pool.includes(c));
  altIndex = 0;
  rebuildSubjects(); refreshBrand(); render();
  const when = stamp ? new Date(stamp).toLocaleDateString(T().locale) : "";
  chipInfo = (label === T().chipSelf) ? {key:"self", when} : {key:"live", label, when};
  setChip("live", label, T().chipLiveTitle(when));
}

async function loadLive(force){
  // önbellek
  if (!force) try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < MAX_AGE_MS){
      const list = normalize(c.d);
      if (sane(list)){ applyData(list, c.label === "__SELF__" ? T().chipSelf : c.label, c.t); return; }
    }
  }catch(e){}

  chipInfo = {key:"loading"};
  setChip("loading", T().chipLoading, T().chipTitle);

  // 1) kendi sitendeki data.json
  try{
    const j = await getJSON(SELF_SRC, 4000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, T().chipSelf, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label:"__SELF__"})); }catch(e){}
      return;
    }
  }catch(e){}

  // 2) SUchedule — önce güncel dosya adını bul, bulamazsan bilinen sürümü dene
  let url = GH_FALLBACK, label = "SUchedule";
  try{
    const files = await getJSON(GH_API, 4000);
    const cand = files
      .filter(f => /^data-v\d+\.min\.json$/.test(f.name))
      .sort((a,b) => (+b.name.match(/\d+/)[0]) - (+a.name.match(/\d+/)[0]))[0];
    if (cand){ url = cand.download_url; label = "SUchedule · " + cand.name.match(/v\d+/)[0]; }
  }catch(e){}
  try{
    const j = await getJSON(url, 6000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, label, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label})); }catch(e){}
      return;
    }
  }catch(e){}

  chipInfo = {key:"emb"};
  setChip("embedded", embeddedLabel(), T().chipEmbTitle);
}

document.getElementById("srcChip").onclick = () => {
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  loadLive(true);
};
loadLive(false);
