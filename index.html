<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='description' content='Sabancı Üniversitesi ders programı planlayıcısı — çakışmasız kombinasyonları bulur.'><title>SUits</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F7F7FA; --sunken:#EDEDF2;
  --ink:#111114; --muted:#6C6C74; --faint:#A0A0A8;
  --line:#E6E6EC; --line2:#D6D6DE;
  --accent:#0A7CFF; --accent-ink:#FFFFFF; --accent-soft:#E4F0FF;
  --ok:#1E8E4A; --ok-soft:#E1F5E8;
  --warn:#A26A00; --warn-soft:#FDF0D8;
  --bad:#C7362B; --bad-soft:#FCE6E4;
  --shadow-sm:0 1px 2px rgba(16,18,26,.05);
  --shadow:0 1px 2px rgba(16,18,26,.05), 0 8px 22px -14px rgba(16,18,26,.28);
  --r-card:16px; --r-chip:8px;
  --c1:#0A7CFF; --c2:#8E52D6; --c3:#E07B1E; --c4:#22A06B; --c5:#E0457B; --c6:#4B5BD7;
  --c7:#B08300; --c8:#0E9FB5; --c9:#7A45B5; --c10:#D2453A; --blk-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#141416; --surface2:#1C1C1F; --sunken:#242427;
    --ink:#F2F2F7; --muted:#9A9AA2; --faint:#6E6E76;
    --line:#2A2A2E; --line2:#3A3A40;
    --accent:#3B93FF; --accent-ink:#04121F; --accent-soft:#132840;
    --ok:#45C57A; --ok-soft:#102A1B;
    --warn:#E0AC48; --warn-soft:#2E2410;
    --bad:#F0685C; --bad-soft:#331613;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
    --c1:#4FA3FF; --c2:#B98CE8; --c3:#F0A050; --c4:#4FC48C; --c5:#F07AA5; --c6:#8090EE;
    --c7:#DCBB4A; --c8:#4EC0D2; --c9:#B08AE0; --c10:#F0766A; --blk-ink:#0A0A0C;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#141416; --surface2:#1C1C1F; --sunken:#242427;
  --ink:#F2F2F7; --muted:#9A9AA2; --faint:#6E6E76;
  --line:#2A2A2E; --line2:#3A3A40;
  --accent:#3B93FF; --accent-ink:#04121F; --accent-soft:#132840;
  --ok:#45C57A; --ok-soft:#102A1B;
  --warn:#E0AC48; --warn-soft:#2E2410;
  --bad:#F0685C; --bad-soft:#331613;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
  --c1:#4FA3FF; --c2:#B98CE8; --c3:#F0A050; --c4:#4FC48C; --c5:#F07AA5; --c6:#8090EE;
  --c7:#DCBB4A; --c8:#4EC0D2; --c9:#B08AE0; --c10:#F0766A; --blk-ink:#0A0A0C;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.02em; text-wrap:balance}
.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer; letter-spacing:inherit}
input,select,textarea{font:inherit; letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

.wrap{max-width:1300px; margin:0 auto; padding:0 20px 72px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1300px; margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand h1{font-size:20px; font-weight:700; letter-spacing:-.03em}
.brand .sub{font-size:12px; color:var(--faint); font-weight:450; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.counter{
  font-size:12.5px; font-weight:600;
  padding:5px 9px; border-radius:999px; background:var(--sunken); color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.counter.full{background:var(--accent-soft); color:var(--accent)}
.counter.over{background:var(--bad-soft); color:var(--bad)}
/* üst barda dört seçim daha var: buradaki düğmeler biraz daha dar dursun ki
   başlık 1300px'lik yerleşimde tek satırda kalsın */
.top-in .btn{padding:7px 12px}

.btn{
  border:0; background:var(--sunken); color:var(--ink);
  padding:7px 14px; border-radius:999px; font-size:13.5px; font-weight:550;
  transition:background .14s ease, transform .08s ease, opacity .14s;
}
.btn:hover{background:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent); opacity:.88}
.btn.tiny{padding:4px 10px; font-size:12px}

.langsw, .modesw{display:inline-flex; background:var(--sunken); border-radius:9px; padding:2px; gap:2px}
.langsw button, .modesw button{
  border:0; background:transparent; color:var(--muted);
  padding:4px 11px; font-size:12.5px; font-weight:550; border-radius:7px;
  transition:background .16s, color .16s, box-shadow .16s;
}
.langsw button.on, .modesw button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.srcchip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:999px; border:0; background:var(--sunken); color:var(--muted)}
.srcchip:hover{color:var(--ink)}
.srcchip .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.srcchip.live .dot{background:var(--ok)}
.srcchip.loading .dot{background:var(--warn)}
.limitbox{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--muted)}
.limitbox .rng{color:var(--faint); font-size:12px; margin:0 -1px}
.limitbox .sep{width:1px; height:15px; background:var(--line); margin:0 3px}
/* üst barda dört seçim var, dar tutulmazsa başlık ikinci satıra kaçıyor */
.limitbox select{
  padding:6px 5px; padding-right:18px;
  background-position:calc(100% - 10px) 52%, calc(100% - 6px) 52%;
}
.limitbox select, .ctrow select, .currow select, #subj, #lvl, #cat, .instsel, .secsel{
  border:0; background:var(--sunken); color:var(--ink);
  border-radius:9px; padding:6px 9px; font-size:13px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%, calc(100% - 9px) 52%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat; padding-right:26px;
}

/* ---------- verdict ---------- */
.verdict{
  margin:20px 0 0; padding:20px 22px; border-radius:var(--r-card);
  background:var(--surface); box-shadow:var(--shadow);
  display:flex; gap:20px; align-items:center; flex-wrap:wrap; position:relative; overflow:hidden;
}
.verdict::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line2)}
.verdict.ok::before{background:var(--ok)}
.verdict.warn::before{background:var(--warn)}
.verdict.bad::before{background:var(--bad)}
.v-main{flex:1 1 320px; min-width:0}
.v-title{font-size:23px; font-weight:700; letter-spacing:-.03em}
.v-sub{color:var(--muted); font-size:14px; margin-top:4px}
.v-stats{display:flex; gap:26px; flex-wrap:wrap}
.stat{min-width:74px}
.stat .n{font-size:26px; font-weight:680; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .l{font-size:11px; color:var(--faint); font-weight:500; margin-top:2px}
.v-sub .bd{margin-top:12px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.mix{
  display:inline-flex; align-items:baseline; gap:5px; font-size:12px; font-weight:550;
  padding:5px 11px 5px 8px; border-radius:999px; background:var(--sunken); color:var(--muted);
}
.mix b{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.mix.required{background:#E07B1E1E; color:#B36414}
.mix.core{background:#0A7CFF1E; color:#0A6ADB}
.mix.area{background:#8E52D61E; color:#7442B5}
.mix.university{background:#22A06B1E; color:#1B825A}
.mix.free{background:var(--sunken); color:var(--muted)}
.mix.out{background:var(--bad-soft); color:var(--bad)}
.mix.cred{background:var(--accent-soft); color:var(--accent)}
:root:not([data-theme="light"]) .mix.required, :root[data-theme="dark"] .mix.required{background:#F0A0501E; color:#F0A050}
:root:not([data-theme="light"]) .mix.core, :root[data-theme="dark"] .mix.core{background:#4FA3FF1E; color:#4FA3FF}
:root:not([data-theme="light"]) .mix.area, :root[data-theme="dark"] .mix.area{background:#B98CE81E; color:#B98CE8}
:root:not([data-theme="light"]) .mix.university, :root[data-theme="dark"] .mix.university{background:#4FC48C1E; color:#4FC48C}
.v-sub .bdl{font-size:12px; color:var(--faint); font-weight:550; margin-right:2px}
.credchip{font-size:11px; font-weight:650; padding:3px 8px; border-radius:var(--r-chip); background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.controls{margin-top:12px; background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden}
.ctrow{display:flex; gap:12px; flex-wrap:wrap; align-items:center; padding:12px 18px; border-top:1px solid var(--line); min-height:50px}
.ctrow:first-child{border-top:0}
.ctrow .qlbl{font-size:12px; color:var(--faint); font-weight:600}
.ctrow .q{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.planlist{display:flex; gap:6px; flex-wrap:wrap}
.planch{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:520; padding:5px 11px; border-radius:999px; border:0; background:var(--sunken); color:var(--ink)}
.planch:hover{background:var(--line2)}
.planch.on{background:var(--accent); color:var(--accent-ink)}
.planch .x{opacity:.45; font-size:15px; line-height:1}
.planch .x:hover{opacity:1}
.planacts{margin-left:auto; display:flex; gap:7px; flex-wrap:wrap}
.planempty{font-size:13px; color:var(--faint)}
#planName{border:0; background:var(--sunken); color:var(--ink); font-size:13px; padding:6px 11px; border-radius:999px; width:130px}
#planName::placeholder{color:var(--faint)}
.dayrow{display:inline-flex; gap:5px; margin-left:2px}
.daych{border:0; background:var(--sunken); color:var(--muted); font-size:12px; font-weight:550; padding:5px 10px; border-radius:999px}
.daych:hover{background:var(--line2); color:var(--ink)}
.daych.on{background:var(--accent); color:var(--accent-ink)}
/* istenen ama tutturulamayan boş gün: mavi yerine kırmızı, nedeni altta yazar */
.daych.bad{background:var(--bad-soft); color:var(--bad)}
.prefwarn{
  flex-basis:100%; margin-top:-2px; font-size:12.5px; line-height:1.55;
  color:var(--bad); background:var(--bad-soft); border-radius:10px; padding:8px 11px;
}

/* ---------- layout ---------- */
.cols{display:grid; grid-template-columns:330px minmax(0,1fr); gap:18px; margin-top:18px; align-items:start}
@media (max-width:960px){ .cols{grid-template-columns:minmax(0,1fr)} }
.rail{position:sticky; top:74px; min-width:0; z-index:1}
.stack{display:flex; flex-direction:column; gap:18px; min-width:0; position:relative; z-index:0}
.panel{background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden}
.panel > h2{
  font-size:13px; font-weight:650; color:var(--ink);
  padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
}
.panel > h2 > span:first-child{white-space:nowrap}
.panel > h2 .hint{margin-left:auto; display:flex; align-items:center; gap:7px; font-weight:450; color:var(--faint); font-size:12px; white-space:nowrap}
.pbody{padding:16px 18px}

/* ---------- search + pool ---------- */
.searchwrap{padding:12px 14px; border-bottom:1px solid var(--line)}
.modesw{width:100%; margin-bottom:10px}
.modesw button{flex:1}
.modesw .cnt{align-self:center; font-size:11px; font-weight:650; color:var(--muted); padding:0 8px; font-variant-numeric:tabular-nums}
.searchrow{display:flex; gap:8px; flex-wrap:wrap}
#q{flex:1 1 100%; min-width:0; border:0; background:var(--sunken); color:var(--ink); font-size:14px; padding:9px 13px; border-radius:11px}
#q::placeholder{color:var(--faint)}
#subj{flex:0 1 100px}
#lvl{flex:0 1 108px}
#cat{flex:1 1 124px; min-width:0}
.results{max-height:300px; overflow-y:auto; border-top:1px solid var(--line)}
.res{display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px}
.res:last-child{border-bottom:0}
.res:hover{background:var(--surface2)}
.res .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; font-weight:600; flex:none; width:80px}
.res .nm{color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.res .add{color:var(--accent); font-weight:600; flex:none; font-size:16px; line-height:1}
.res.have{background:var(--accent-soft)}
.res.have .code, .res.have .nm{opacity:.65}
.res .add .del{display:none}
.res.have:hover .add .chk{display:none}
.res.have:hover .add .del{display:inline; color:var(--bad)}
.res.have:hover{background:var(--bad-soft)}
.resnote{padding:10px 16px; font-size:12.5px; color:var(--faint); border-bottom:1px solid var(--line)}
.curbox{padding:12px 14px; border-bottom:1px solid var(--line)}
.currow{display:flex; gap:8px}
.currow select{flex:1; min-width:0; font-size:13px}
.curnote{font-size:12px; color:var(--faint); line-height:1.4; margin-top:8px}
.poolhead{padding:12px 18px 2px; font-size:12px; color:var(--faint); font-weight:600;
  display:flex; align-items:center; gap:8px; justify-content:space-between}
.clist{max-height:min(46vh,440px); overflow-y:auto; display:flex; flex-direction:column}
.crow{display:flex; gap:11px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface2)}
.crow.on{background:var(--accent-soft)}
.crow.dim{opacity:.42}
.crow input[type=checkbox]{margin:2px 0 0; accent-color:var(--accent); width:17px; height:17px; flex:none; cursor:pointer}
.crow .txt{min-width:0; flex:1}
.crow .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:650}
.crow .nm{font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:1px}
.crow .tags{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; align-items:center}
.crow .swatch{width:3px; align-self:stretch; border-radius:999px; flex:none; background:transparent}
.tag{font-size:11px; font-weight:500; padding:2px 7px; border-radius:var(--r-chip); background:var(--sunken); color:var(--muted)}
.tag.r{background:var(--warn-soft); color:var(--warn)}
.tag.p{background:var(--accent-soft); color:var(--accent)}
.rm{flex:none; align-self:center; border:0; background:transparent; color:var(--faint); font-size:17px; line-height:1; width:28px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; transition:background .14s, color .14s}
.crow:hover .rm{background:var(--sunken)}
.rm:hover{background:var(--bad) !important; color:#fff !important}
.instrow{display:flex; align-items:center; gap:7px; margin-top:7px}
.instrow .ilbl{font-size:11px; color:var(--faint); font-weight:550; flex:none}
.instsel{flex:1; min-width:0; font-size:12px; padding:4px 8px; padding-right:24px; background-color:var(--surface2)}
.cat{font-size:10px; font-weight:700; padding:2.5px 7px; border-radius:var(--r-chip); white-space:nowrap; flex:none}
.cat.required{background:#E07B1E22; color:#B36414}
.cat.core{background:#0A7CFF22; color:#0A6ADB}
.cat.area{background:#8E52D622; color:#7442B5}
.cat.university{background:#22A06B22; color:#1B825A}
.cat.free{background:var(--sunken); color:var(--muted)}
.cat.out{background:var(--bad-soft); color:var(--bad)}
:root:not([data-theme="light"]) .cat.required, :root[data-theme="dark"] .cat.required{background:#F0A05022; color:#F0A050}
:root:not([data-theme="light"]) .cat.core, :root[data-theme="dark"] .cat.core{background:#4FA3FF22; color:#4FA3FF}
:root:not([data-theme="light"]) .cat.area, :root[data-theme="dark"] .cat.area{background:#B98CE822; color:#B98CE8}
:root:not([data-theme="light"]) .cat.university, :root[data-theme="dark"] .cat.university{background:#4FC48C22; color:#4FC48C}

/* ---------- weekly grid ---------- */
.gridwrap{overflow-x:auto}
table.sched{border-collapse:separate; border-spacing:0; width:100%; min-width:680px; table-layout:fixed}
table.sched thead th{position:sticky; top:0; z-index:2}
table.sched th{font-size:12px; font-weight:600; color:var(--muted); padding:11px 6px; border-bottom:1px solid var(--line); background:var(--surface)}
table.sched th.tcol{width:64px}
table.sched td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); height:46px; padding:0; vertical-align:top; position:relative}
table.sched td:last-child{border-right:0}
table.sched tbody tr:last-child td{border-bottom:0}
table.sched td.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:var(--faint); text-align:right; padding:5px 9px 0 0; background:var(--surface2); border-right:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums}
.blk{position:absolute; inset:3px; border-radius:10px; padding:6px 8px; overflow:hidden; color:var(--blk-ink); display:flex; flex-direction:column; box-shadow:0 1px 3px rgba(0,0,0,.16)}
.blk .bc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; font-weight:650; line-height:1.2}
.blk .bm{font-size:9.5px; opacity:.8; line-height:1.25; margin-top:2px}
.blk.half{width:calc(50% - 4px)}
.blk.half2{left:50%; width:calc(50% - 4px)}
td.clash{background:repeating-linear-gradient(45deg, var(--bad-soft) 0 7px, transparent 7px 14px)}
td.clash::after{content:""; position:absolute; inset:0; border:2px solid var(--bad); border-radius:4px; pointer-events:none}

/* ---------- agenda ---------- */
.agenda{display:none; padding:4px 0 12px}
.agday{padding:12px 16px 4px}
.agd{font-size:12px; color:var(--faint); font-weight:650; margin-bottom:9px}
.agit{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; margin-bottom:7px; border-radius:12px; background:var(--surface2); border-left:3px solid var(--ac)}
.agit.clash{background:var(--bad-soft); border-left-color:var(--bad)}
.agtime{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; font-weight:650; color:var(--ink); flex:none; width:52px; line-height:1.35; font-variant-numeric:tabular-nums}
.agtime i{display:block; font-style:normal; font-weight:400; color:var(--faint); font-size:11px}
.agmain{min-width:0; display:flex; flex-direction:column; gap:2px}
.agmain b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px; font-weight:650}
.agmain span{font-size:12px; color:var(--muted); line-height:1.35}

/* ---------- sections ---------- */
.secgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.sec{border-radius:13px; padding:13px 15px; background:var(--surface2); border-left:3px solid}
.sec h3{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; font-weight:650}
.sec .cn{font-size:12.5px; color:var(--muted); margin:2px 0 3px; line-height:1.35}
.sec .who{font-size:12px; color:var(--accent); margin:0 0 9px; line-height:1.35; font-weight:500}
.sec .pre{font-size:12px; color:var(--muted); margin:0 0 9px}
.sec .pre b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); font-weight:600}

/* ---------- matrix ---------- */
.mtx{overflow-x:auto}
table.matrix{border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px}

/* ---------- wallpaper sheet ---------- */
.sheet{position:fixed; inset:0; z-index:80; display:none; background:rgba(10,10,14,.44); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px}

.swatches{display:flex; gap:9px; flex-wrap:wrap}
.sw{width:34px; height:34px; border-radius:999px; border:2px solid var(--line2); padding:0}
.sw.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

/* --- üç veri biçimini de kabul eden çözümleyici ---
   A) gömülü sıkıştırılmış biçim (v2): {v,term,p,i,c:[[code,name,pre[],[[type,[[crn,sec,instIdx,seats,[[d,s,du,pIdx]]]]]]]]}
   B) bannerweb-fetch dizisi: [{subject,code,name,crn,section,type,schedule:[{days,time,where,instructors}],availability,prerequisites}]
   C) SUchedule ham biçimi: {places,instructors,courses:[{code,name,classes:[{type,sections:[…]}]}]} */
let TERM = "";
const DAYCH = {M:0, T:1, W:2, R:3, F:4, S:5, U:6};
function hour24(t){
  const m = /^(\d{1,2}):(\d{2})\s*([ap])m$/i.exec((t||"").trim());
  if (!m) return null;
  return (parseInt(m[1],10) % 12) + (m[3].toLowerCase() === "p" ? 12 : 0);
}
function normalize(json){
  // A) gömülü sıkıştırılmış
  if (json && Array.isArray(json.c) && Array.isArray(json.p)){
    const P = json.p, I = json.i || [];
    TERM = json.term || "";
    return json.c.map(([code,name,pre,classes]) => ({
      code, name, pre: pre || [],
      classes: classes.map(([type,secs]) => ({
        type,
        sections: secs.map(([crn,group,ii,seats,mt]) => ({
          crn, group, inst: ii >= 0 ? (I[ii]||"") : "",
          seats: (seats && seats.length) ? {cap:seats[0], act:seats[1]} : null,
          mt: mt.map(([d,s,du,p]) => ({d, s, du, p: P[p]||""}))
        }))
      }))
    }));
  }
  // B) bannerweb-fetch
  if (Array.isArray(json) && json.length && json[0] && json[0].crn !== undefined && json[0].subject !== undefined){
    const map = new Map();
    for (const r of json){
      const code = r.subject + " " + r.code;
      if (!TERM && r.term) TERM = r.term;
      let c = map.get(code);
      if (!c){ c = {code, name:"", pre:new Set(), cls:new Map(), cr:0}; map.set(code, c); }
      if (r.scheduleType === "Lecture" || !c.name) c.name = (r.name || "").trim();
      /* SU kredisi: recitation satırlarında 0 görünebiliyor, dersin en büyüğünü al */
      c.cr = Math.max(c.cr, +r.credits || 0);
      (r.prerequisites || []).forEach(p => c.pre.add(p));
      const mt = [];
      let inst = "";
      for (const s of (r.schedule || [])){
        const t = s.time || {};
        const a = hour24(t.from), z = hour24(t.to);
        if (!s.days || a === null || z === null) continue;
        if (!inst && (s.instructors || []).length) inst = s.instructors.join(", ");
        for (const ch of s.days){
          const d = DAYCH[ch.toUpperCase()];
          if (d === undefined) continue;
          mt.push({d, s: a-8, du: (z-9) - (a-8) + 1, p: s.where || ""});
        }
      }
      let seats = null;
      for (const a of (r.availability || [])) if (a.title === "Seats") seats = {cap:a.capacity||0, act:a.actual||0};
      const ty = r.type || "";
      if (!c.cls.has(ty)) c.cls.set(ty, []);
      c.cls.get(ty).push({crn:String(r.crn), group: r.section || "0", inst, seats, mt});
    }
    return [...map.values()].map(c => ({
      code: c.code, name: c.name || c.code, pre: [...c.pre].sort(), cr: c.cr || 0,
      classes: [...c.cls.entries()]
        .sort((a,b) => (a[0]==="" ? -1 : b[0]==="" ? 1 : a[0].localeCompare(b[0])))
        .map(([type,sections]) => ({type, sections}))
    })).sort((a,b) => a.code.localeCompare(b.code));
  }
  // C) SUchedule ham
  if (json && Array.isArray(json.courses)){
    const P = json.places || [], I = json.instructors || [];
    TERM = "";
    return json.courses.map(c => ({
      code: c.code, name: (c.name||"").trim(), pre: [],
      classes: (c.classes||[]).map(cl => ({
        type: cl.type || "",
        sections: (cl.sections||[]).map(s => ({
          crn: String(s.crn), group: s.group ?? "0",
          inst: typeof s.instructors === "number" ? (I[s.instructors]||"") : "",
          seats: null,
          mt: (s.schedule||[]).map(x => ({d:x.day, s:x.start, du:x.duration, p: P[x.place] || ""}))
        }))
      }))
    }));
  }
  throw new Error("Tanınmayan veri biçimi");
}
function sane(list){
  return Array.isArray(list) && list.length > 50 &&
    list.every(c => c && typeof c.code === "string" && Array.isArray(c.classes) && c.classes.length) &&
    list.some(c => c.classes[0].sections.some(s => s.mt.length));
}

const slotStart = i => String(8+i).padStart(2,"0") + ":40";
const slotEnd   = i => String(9+i).padStart(2,"0") + ":30";

const norm = s => s.toLocaleLowerCase("tr")
  .replace(/ı/g,"i").replace(/İ/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");

/* ================= section kombinasyonları (tembel) ================= */
const _opts = new Map();
function buildOptions(course, enforceLetters){
  const lecGroups = course.classes[0].sections.map(s => s.group);
  const lettered = ENFORCE_GROUP_LETTERS && enforceLetters && lecGroups.some(g => /^[A-Za-z]+$/.test(g));
  let opts = [{picks:[], mask:new Set()}];
  for (const cls of course.classes){
    const next = [];
    for (const base of opts){
      const lecG = base.picks.length ? base.picks[0].sec.group : null;
      for (const sec of cls.sections){
        // ders section'ı harfliyse alt grup da aynı harfle başlamalı
        if (lecG !== null && lettered && /^[A-Za-z]+$/.test(lecG) &&
            !norm(sec.group).startsWith(norm(lecG))) continue;
        const mask = new Set(base.mask);
        let clash = false;
        for (const m of sec.mt) for (let k=0;k<m.du;k++){
          const key = m.d*NSLOT + m.s + k;
          if (mask.has(key)) clash = true;
          mask.add(key);
        }
        if (clash) continue;                 // ders kendi recit'iyle çakışıyorsa ele
        next.push({picks:[...base.picks, {cls, sec}], mask});
      }
    }
    opts = next;
  }
  return opts;
}
function optsOf(code){
  if (_opts.has(code)) return _opts.get(code);
  const c = BY[code];
  let o = buildOptions(c, true);
  if (!o.length) o = buildOptions(c, false);        // harf kuralı her şeyi elediyse gevşet
  if (!o.length){                                    // ders kendi içinde çakışıyor: yine de göster
    const picks = c.classes.map(cls => ({cls, sec: cls.sections[0]}));
    const mask = new Set();
    picks.forEach(({sec}) => sec.mt.forEach(m => { for(let k=0;k<m.du;k++) mask.add(m.d*NSLOT+m.s+k); }));
    o = [{picks, mask, selfClash:true}];
  }
  _opts.set(code, o);
  return o;
}

/* ================= ikili çakışma (tembel) ================= */
const _pair = new Map();
function pairOf(a,b){
  const key = a < b ? a+"|"+b : b+"|"+a;
  if (_pair.has(key)) return _pair.get(key);
  let best = Infinity, when = null;
  outer:
  for (const x of optsOf(a)) for (const y of optsOf(b)){
    let n = 0, first = null;
    for (const k of x.mask) if (y.mask.has(k)){ n++; if (first===null) first = k; }
    if (n < best){ best = n; when = first; if (!best) break outer; }
  }
  const r = {n:best, when};
  _pair.set(key, r);
  return r;
}

/* ================= çözücü ================= */
function score(mask){
  const perDay = {};
  for (const k of mask){ const d = Math.floor(k/NSLOT); (perDay[d] = perDay[d]||[]).push(k%NSLOT); }
  const days = Object.keys(perDay).length;
  let span = 0, gaps = 0, early = 0, weekdays = 0;
  for (const d in perDay){
    const ss = perDay[d].sort((a,b)=>a-b);
    const lo = ss[0], hi = ss[ss.length-1];
    span += hi-lo+1;
    gaps += (hi-lo+1) - new Set(ss).size;
    if (lo === 0) early++;
    if (+d <= 4) weekdays++;
  }
  // "boş gün" hafta içi üzerinden sayılır; cumartesi dersi varsa ayrıca görünür zaten
  return {days, span, gaps, early, free: 5 - weekdays};
}
const cmpM = (a,b) => a.days-b.days || a.gaps-b.gaps || a.span-b.span || a.early-b.early;

const LEAF_CAP  = 120000;
const MAX_CONF  = 24;   /* çakışma bütçesinde en fazla bu kadar yukarı çıkılır */
const SOLVE_BUDGET_MS = 4000;   /* tüm bütçe turları için üst süre sınırı */

/* Tek geçiş: yalnızca çakışması <= maxConf olan dizilimleri arar.
   Bütçe baştan belli olduğu için budama ilk daldan itibaren çalışır;
   maxConf=0 geçişi herhangi bir çakışmada anında geri döner. */
function solvePass(oc, lists, maxConf){
  const count = new Map();
  let conf = 0, leaves = 0, capped = false;
  const results = [];
  const walk = (i, picks) => {
    if (capped || conf > maxConf) return;
    if (i === lists.length){
      if (++leaves > LEAF_CAP){ capped = true; return; }
      if (results.length < 300){
        const mask = new Set(), conflicts = new Set();
        for (const [k,n] of count){ mask.add(k); if (n>1) conflicts.add(k); }
        results.push({codes:oc.slice(), picks:picks.slice(), mask, conflicts, c:conf, m:score(mask)});
      }
      return;
    }
    for (const opt of lists[i]){
      for (const k of opt.mask){
        const n = (count.get(k)||0) + 1;
        count.set(k, n);
        if (n === 2) conf++;
      }
      picks.push(opt);
      walk(i+1, picks);
      picks.pop();
      for (const k of opt.mask){
        const n = count.get(k) - 1;
        if (n === 1) conf--;
        if (n) count.set(k, n); else count.delete(k);
      }
      if (capped) return;
    }
  };
  walk(0, []);
  return {results, capped};
}

function solve(codes){
  if (!codes.length) return null;
  // az seçenekli dersi öne al: budama daha erken devreye girer
  const order = codes.map((c,i)=>i).sort((x,y)=>allowedOpts(codes[x]).length - allowedOpts(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(allowedOpts);
  if (lists.some(l => !l.length)) return null;

  /* çakışma bütçesini 0'dan başlatıp artır: çakışmasız bir dizilim varsa
     yaprak sınırına takılmadan önce mutlaka bulunur */
  let results = [], capped = false;
  const deadline = Date.now() + SOLVE_BUDGET_MS;
  for (let maxConf = 0; maxConf <= MAX_CONF; maxConf++){
    if (maxConf && Date.now() > deadline){ capped = true; break; }
    const pass = solvePass(oc, lists, maxConf);
    if (pass.results.length){
      results = pass.results;
      /* bu seviyede sonuç bulundu; arama yalnız bu seviyede kısaldıysa
         "daha iyisi olabilir" uyarısı gerekmez, daha azı zaten elenmişti */
      capped = capped && maxConf > 0;
      break;
    }
    if (pass.capped) capped = true;   // bu seviye taranamadı, atlanmış olabilir
  }
  /* hiçbir bütçe turu sonuç veremediyse (süre/yaprak sınırı) sınırsız bütçeyle
     tek tur: kullanıcı boş ekran yerine en azından bir dizilim görür */
  if (!results.length){
    results = solvePass(oc, lists, Infinity).results;
    capped = true;
  }
  if (!results.length) return null;

  results.sort((a,b) => a.c - b.c || cmpM(a.m, b.m));
  const out = [], seen = new Set();
  for (const r of results){
    const key = r.picks.map(p => p.picks.map(x => x.sec.crn).join("")).join("|");
    if (seen.has(key)) continue;
    seen.add(key); out.push(r);
    if (out.length >= 8) break;
  }
  out.capped = capped;
  return out;
}

/* sadece tam çakışmasız atamalar — hızlı, otomatik öneri için.
   Çok section'lı derslerde çakışmasız dizilim sayısı milyonlara çıkabildiği
   için yaprak ve süre bütçesi var: bütçe dolunca o ana kadarki en iyi
   dizilim döner, arama asla kilitlenmez. */
const CF_LEAF_CAP = 40000;
let CF_DEADLINE = Infinity;      // autoSuggest bunu her çağrıda kurar
function solveCF(codes){
  const order = codes.map((c,i)=>i).sort((x,y)=>allowedOpts(codes[x]).length - allowedOpts(codes[y]).length);
  const oc = order.map(i => codes[i]);
  const lists = oc.map(allowedOpts);
  if (lists.some(l => !l.length)) return null;
  const mask = new Set();
  let best = null, leaves = 0, stop = false;
  const walk = (i, picks) => {
    if (stop) return;
    if (i === lists.length){
      if (++leaves > CF_LEAF_CAP){ stop = true; return; }
      if ((leaves & 511) === 0 && Date.now() > CF_DEADLINE){ stop = true; return; }
      const m = score(mask);
      if (!best || cmpM(m, best.m) < 0)
        best = {codes:oc.slice(), picks:picks.slice(), mask:new Set(mask), conflicts:new Set(), c:0, m};
      return;
    }
    for (const opt of lists[i]){
      let ok = true;
      for (const k of opt.mask) if (mask.has(k)){ ok = false; break; }
      if (!ok) continue;
      for (const k of opt.mask) mask.add(k);
      picks.push(opt); walk(i+1, picks); picks.pop();
      for (const k of opt.mask) mask.delete(k);
      if (stop) return;
    }
  };
  walk(0, []);
  return best;
}

const PREFS = {early:0, late:NSLOT-1, off:[]};   // en erken dilim, en geç dilim, boş kalacak günler
/* Kullanıcının istediği boş günlerin gerçekten uygulanabilen alt kümesi.
   PREFS.off istek, OFF_EFF ise çözücünün uyduğu liste. İkisi ayrı olmazsa
   "Pzt + Sal boş" gibi birlikte tutmayan bir istekte, tutabileceğimiz Pazartesi
   de elden gidiyordu. render() her turda syncOffEff() ile bunu tazeler. */
let OFF_EFF = [];
const optInWindow = opt => {
  for (const k of opt.mask){ const s = k % NSLOT; if (s < PREFS.early || s > PREFS.late) return false; }
  return true;
};
const optOffDay = (opt, days) => {
  for (const k of opt.mask) if (days.includes(Math.floor(k/NSLOT))) return true;
  return false;
};
function prefAllows(opt){ return !optOffDay(opt, OFF_EFF) && optInWindow(opt); }
const prefsActive = () => PREFS.early > 0 || PREFS.late < NSLOT-1 || PREFS.off.length > 0;
const _allow = new Map();
function allowedOpts(code){
  const key = code + "|" + PREFS.early + "|" + PREFS.late + "|" + OFF_EFF.join("") + "|" + pinKey()
            + "|" + (INSTREQ[code] || "");
  if (_allow.has(key)) return _allow.get(key);
  const pins = pinsOf(code);
  const want = INSTREQ[code];
  const base = o => (!want || (o.picks[0].sec.inst || "").includes(want)) &&
                    (!pins || o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn));
  /* Kademeli geri düşüş. Boş gün listesi uygulanabilir olduğu doğrulanmış
     olduğu için saat aralığından önce gelir: saat yüzünden boşa düşen bir ders
     boş günü de deldirmesin. Elle sabitlenen section her şeyin üstünde. */
  let r = optsOf(code).filter(o => base(o) && !optOffDay(o, OFF_EFF) && (pins || optInWindow(o)));
  if (!r.length) r = optsOf(code).filter(o => base(o) && !optOffDay(o, OFF_EFF));  // saat aralığından vazgeç
  if (!r.length) r = optsOf(code).filter(base);                                    // boş günden de vazgeç
  if (!r.length) r = optsOf(code).slice();
  _allow.set(key, r);
  return r;
}
const prefBlocked = code => allowedOpts(code).length === 0;

/* ================= "boş kalsın" tanısı =================
   allowedOpts, bir tercih o ders için hiçbir section bırakmazsa tercihi sessizce
   yok sayıyor (geri düşüş). Kullanıcı açısından bu, "Cuma boş kalsın" dedikten
   sonra Cuma'da ders görmek demek. Aşağısı o durumu yakalayıp nedenini ve
   bunun yerine hangi günlerin boşaltılabileceğini söyler. */

const baseOk = code => {
  const pins = pinsOf(code), want = INSTREQ[code];
  return o => (!want || (o.picks[0].sec.inst || "").includes(want)) &&
              (!pins || o.picks.every(({cls,sec}) => !pins[cls.type] || pins[cls.type] === sec.crn));
};
/* Boş gün tanısı için seçenek listesi. Saat aralığı allowedOpts'ta ders bazında
   geri düşebildiği için burada da öyle davranır: aralığa hiç sığmayan bir ders
   yüzünden gün suçlanmasın. Boş gün kısıtında geri düşüş YOK — boşsa gerçekten
   o gün boşaltılamıyor demektir. */
function strictOpts(code, offDays){
  const ok = baseOk(code), pins = pinsOf(code);
  const inDays = o => !optOffDay(o, offDays);
  let r = optsOf(code).filter(o => ok(o) && inDays(o) && (pins || optInWindow(o)));
  if (!r.length) r = optsOf(code).filter(o => ok(o) && inDays(o));
  return r;
}
/* Saat aralığı bu ders için hiç uygulanabiliyor mu (boş günler geçerliyken)? */
function windowFits(code, offDays){
  const ok = baseOk(code);
  return optsOf(code).some(o => ok(o) && !optOffDay(o, offDays) && optInWindow(o));
}

const CF_FAIL_BUDGET = 300000, CF_ALT_BUDGET = 40000;
/* İlk çakışmasız atamayı bulunca durur — tam çözümden çok daha ucuz.
   true = yerleşir, false = yerleşmez, null = bütçe doldu, bilinmiyor.
   "Bilinmiyor"u yanlış uyarı basmaktansa sessiz kalmak için ayırıyoruz. */
function existsCF(lists, budget){
  const order = lists.map((l,i)=>i).sort((a,b)=>lists[a].length-lists[b].length).map(i=>lists[i]);
  const mask = new Set();
  let found = false, steps = 0, spent = false;
  const walk = i => {
    if (found || spent) return;
    if (++steps > budget){ spent = true; return; }
    if (i === order.length){ found = true; return; }
    for (const opt of order[i]){
      let ok = true;
      for (const k of opt.mask) if (mask.has(k)){ ok = false; break; }
      if (!ok) continue;
      for (const k of opt.mask) mask.add(k);
      walk(i+1);
      for (const k of opt.mask) mask.delete(k);
      if (found || spent) return;
    }
  };
  walk(0);
  return found ? true : (spent ? null : false);
}

/* Verilen günler boşken seçili dersler yerleşiyor mu, yerleşmiyorsa hangi ders yüzünden? */
function offCheck(offDays, cand, budget){
  const stuck = [], lists = [];
  const without = offDays.filter(d => d !== cand);
  for (const c of selected){
    const r = strictOpts(c, offDays);
    if (!r.length){
      /* bu gün olmasa açılabiliyor muydu? cevabı uyarının dilini belirliyor */
      const dayOnly = strictOpts(c, without).length > 0;
      /* hangi bileşen o güne çiviliyor: ders mi, recitation mı, lab mı */
      const parts = dayOnly
        ? (BY[c] ? BY[c].classes.filter(cl => cl.sections.every(s => s.mt.some(m => m.d === cand))).map(cl => cl.type) : [])
        : [];
      stuck.push({code:c, dayOnly, parts});
    } else lists.push(r);
  }
  if (stuck.length) return {ok:false, stuck};
  if (!lists.length) return {ok:true, stuck:[]};
  const r = existsCF(lists, budget);
  return {ok: r !== false, unknown: r === null, stuck:[]};   // bilinmiyorsa uyarı basma
}

const _offRep = new Map();
function offDayReport(){
  if (!selected.length || !PREFS.off.length) return {kept:PREFS.off.slice(), fails:[], alts:[]};
  const key = selected.join(",") + "|" + PREFS.off.join(",") + "|" + PREFS.early + "|" + PREFS.late
            + "|" + pinKey() + "|" + selected.map(c => INSTREQ[c] || "").join(",");
  if (_offRep.has(key)) return _offRep.get(key);

  /* tıklama sırasına saygı: önce seçilen gün, tutmayan sonrakiler elenir */
  const wanted = PREFS.off.slice();
  const okDays = [], fails = [];
  for (const d of wanted){
    /* istenen gün: doğruluk önemli, geniş bütçe */
    const r = offCheck([...okDays, d], d, CF_FAIL_BUDGET);
    if (r.ok) okDays.push(d);
    else fails.push({day:d, stuck:r.stuck, kept:okDays.slice()});
  }
  const alts = [];
  if (fails.length){
    for (let d = 0; d <= 5; d++){
      if (wanted.includes(d)) continue;
      /* öneri listesi: dar bütçe, emin olamadığımız günü hiç yazmayız */
      const r = offCheck([...okDays, d], d, CF_ALT_BUDGET);
      if (r.ok && !r.unknown) alts.push(d);
    }
  }
  const rep = {kept:okDays, fails, alts};
  if (_offRep.size > 40) _offRep.clear(); _winRep.clear();
  _offRep.set(key, rep);
  return rep;
}

/* Çözücüye girmeden önce uygulanabilir boş gün listesini tazele. */
function syncOffEff(){
  const next = offDayReport().kept;
  if (next.join(",") !== OFF_EFF.join(",")) OFF_EFF = next.slice();
}

/* ---- saat aralığı tanısı ----
   Aralık ders bazında geri düşüyor: sığmayan ders aralığın dışına taşıyor.
   Sessiz kalmak yerine hangi derslerin taşıdığını ve bu ders setinin sığdığı
   en dar aralığı söyler. */
const _winRep = new Map();
function windowReport(){
  if (!selected.length) return null;
  if (PREFS.early === 0 && PREFS.late === NSLOT-1) return null;
  const key = selected.join(",") + "|" + PREFS.early + "|" + PREFS.late + "|" + OFF_EFF.join(",")
            + "|" + pinKey() + "|" + selected.map(c => INSTREQ[c] || "").join(",");
  if (_winRep.has(key)) return _winRep.get(key);

  const stuck = selected.filter(c => !windowFits(c, OFF_EFF));
  let best = null;
  if (stuck.length){
    /* her ders için seçeneklerin (en erken dilim, en geç dilim) çiftleri;
       hepsinin sığdığı en dar [a,b] aralığını ara — 14 dilim, kaba kuvvet yeter */
    const spans = selected.map(c => {
      const ok = baseOk(c);
      const out = [];
      for (const o of optsOf(c)){
        if (!ok(o) || optOffDay(o, OFF_EFF)) continue;
        let lo = NSLOT, hi = -1;
        for (const k of o.mask){ const s = k % NSLOT; if (s < lo) lo = s; if (s > hi) hi = s; }
        if (hi >= 0) out.push([lo, hi]);
      }
      return out;
    });
    if (spans.every(s => s.length)){
      for (let a = 0; a < NSLOT; a++) for (let b = a; b < NSLOT; b++){
        if (best && (b - a) >= best.b - best.a) continue;
        if (spans.every(s => s.some(([lo,hi]) => lo >= a && hi <= b))) best = {a, b};
      }
    }
  }
  const rep = stuck.length ? {stuck, best} : null;
  if (_winRep.size > 40) _winRep.clear();
  _winRep.set(key, rep);
  return rep;
}

function renderPrefs(){
  const bar = document.getElementById("prefBar");
  const S = T();
  const earlyOpts = [0,1,2,3,4].map(i =>
    `<option value="${i}"${PREFS.early===i?" selected":""}>${i===0?S.prefAny:slotStart(i)}</option>`).join("");
  const lateOpts = [NSLOT-1,10,9,8,7,6].map(i =>
    `<option value="${i}"${PREFS.late===i?" selected":""}>${i===NSLOT-1?S.prefAny:slotEnd(i)}</option>`).join("");
  const rep = offDayReport();
  const badDays = rep.fails.map(f => f.day);
  const dayChips = [0,1,2,3,4,5].map(d => {
    const on = PREFS.off.includes(d);
    const cls = "daych" + (on ? (badDays.includes(d) ? " bad" : " on") : "");
    const tip = badDays.includes(d) ? ` title="${S.offFailTip}"` : "";
    return `<button class="${cls}" data-day="${d}"${tip}>${S.daysS[d]}</button>`;
  }).join("");
  const lines = [];
  if (rep.fails.length){
    /* "MATH 101 (Recitation)" — günü zorlayan bileşen belliyse onu da yaz */
    const label = x => x.parts && x.parts.length
      ? `${x.code} (${x.parts.map(t => S.types[t] || t).join(", ")})` : x.code;
    rep.fails.forEach(f => {
      const day = S.days[f.day];
      const kept = f.kept.map(d => S.days[d]).join(", ");     // bu günle çakışan, tutulan günler
      const only  = f.stuck.filter(x => x.dayOnly).map(label);
      const other = f.stuck.filter(x => !x.dayOnly).map(x => x.code);
      if (!f.stuck.length){
        lines.push(kept ? S.offFailWithCombo(kept, day) : S.offFailCombo(day));
      } else {
        if (only.length)  lines.push(kept ? S.offFailWith(kept, day, only.join(", "))
                                          : S.offFailDay(day, only.join(", ")));
        if (other.length) lines.push(S.offFailOther(day, other.join(", ")));
      }
    });
    /* "şu günler boş tutuluyor" cümlesi bir kez, en sonda */
    if (rep.kept.length) lines.push(S.offKept(rep.kept.map(d => S.days[d]).join(", ")));
    lines.push(rep.alts.length ? S.offAlt(rep.alts.map(d => S.days[d]).join(", ")) : S.offAltNone);
  }
  const wrep = windowReport();
  if (wrep){
    lines.push(S.winFail(slotStart(PREFS.early), slotEnd(PREFS.late), wrep.stuck.join(", ")));
    if (wrep.best) lines.push(S.winBest(slotStart(wrep.best.a), slotEnd(wrep.best.b)));
    else lines.push(S.winBestNone);
  }
  const warn = lines.length ? `<div class="prefwarn">${lines.join(" ")}</div>` : "";
  bar.innerHTML =
    `<span class="qlbl">${S.prefTitle}</span>
     <label class="q">${S.prefFrom} <select id="pEarly">${earlyOpts}</select></label>
     <label class="q">${S.prefTo} <select id="pLate">${lateOpts}</select></label>
     <span class="q">${S.prefOff} <span class="dayrow">${dayChips}</span></span>
     ${prefsActive()?`<button class="btn tiny" id="pReset">${S.prefReset}</button>`:""}
     ${warn}`;
  const save = () => { try{ localStorage.setItem("dk-prefs", JSON.stringify(PREFS)); }catch(e){} };
  bar.querySelector("#pEarly").onchange = e => { PREFS.early = +e.target.value; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
  bar.querySelector("#pLate").onchange  = e => { PREFS.late  = +e.target.value; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
  bar.querySelectorAll(".daych").forEach(btn => btn.onclick = () => {
    const d = +btn.dataset.day;
    PREFS.off = PREFS.off.includes(d) ? PREFS.off.filter(x=>x!==d) : [...PREFS.off, d];
    _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render();
  });
  const rs = bar.querySelector("#pReset");
  if (rs) rs.onclick = () => { PREFS.early=0; PREFS.late=NSLOT-1; PREFS.off=[]; _allow.clear(); _offRep.clear(); _winRep.clear(); save(); altIndex=0; render(); };
}

const CUR_LET = {u:"university", r:"required", c:"core", a:"area", f:"free"};
function builtCurriculum(major){
  if (typeof CURBUILT === "undefined" || !CURBUILT.m[major]) return null;
  const map = {};
  const s = CURBUILT.m[major];
  for (let i=0;i<CURBUILT.c.length;i++){
    const t = CUR_LET[s[i]];
    if (t) map[CURBUILT.c[i]] = {t, c: +CURBUILT.cr[i] || 0};
  }
  return {map, req: CURBUILT.q[major] ? {major, ...CURBUILT.q[major]} : null};
}

async function loadReq(){
  try{
    const r = await fetch(`https://beficent.github.io/surriculum/requirements/${ADMIT}.jsonl`, {cache:"no-store"});
    if (!r.ok) return null;
    for (const line of (await r.text()).split("\n")){
      const s = line.trim(); if (!s) continue;
      try{ const o = JSON.parse(s); if (o.major === MAJOR) return o; }catch(e){}
    }
  }catch(e){}
  return null;
}
async function loadCurriculum(){
  const note = document.getElementById("curNote");
  if (!MAJOR){ CURMAP = null; REQ = null; note.textContent = T().curHint; buildCurSelectors(); render(); return; }
  const key = `dk-cur2-${ADMIT}-${MAJOR}`;
  let usedBuilt = false;

  // 1) önbellek
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(key) || "null"); }catch(e){}
  const cacheOK = c => {
    if (!c || !c.m || typeof c.m !== "object") return false;
    const k = Object.keys(c.m)[0];
    return !!k && typeof c.m[k] === "object" && !!c.m[k].t;   // yeni biçim mi?
  };
  if (cached && cacheOK(cached) && Date.now() - cached.t < 7*24*3600*1000){
    CURMAP = cached.m; REQ = cached.r || null;
    note.textContent = T().curOk(MAJOR, ADMIT); buildCurSelectors(); render(); return;
  }

  // 2) gömülü kopya — anında göster, sonra canlıyı denemeye devam et
  const built = builtCurriculum(MAJOR);
  if (built && typeof CURBUILT !== "undefined" && ADMIT === CURBUILT.t){
    CURMAP = built.map; REQ = built.req;
    usedBuilt = true;
    note.textContent = T().curOk(MAJOR, ADMIT);
    buildCurSelectors(); render();
  } else {
    note.textContent = T().curLoading;
  }
  try{
    const r = await fetch(`${CUR_BASE}/${ADMIT}/${MAJOR}.jsonl`, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const map = {};
    for (const line of (await r.text()).split("\n")){
      const s = line.trim(); if (!s) continue;
      try{
        const o = JSON.parse(s);
        if (o.Major && o.Code && o.EL_Type)
          map[`${o.Major} ${o.Code}`] = {t:o.EL_Type, c: parseFloat(o.SU_credit) || 0};
      }catch(e){}
    }
    if (Object.keys(map).length < 20) throw new Error("boş müfredat");
    CURMAP = map;
    REQ = await loadReq();
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), m:map, r:REQ})); }catch(e){}
    note.textContent = T().curOk(MAJOR, ADMIT);
  }catch(e){
    if (usedBuilt) return;                      // gömülü kopya zaten yüklü
    const fb = builtCurriculum(MAJOR);          // farklı giriş dönemi + ağ yok
    if (fb){
      CURMAP = fb.map; REQ = fb.req;
      note.textContent = T().curBuilt(MAJOR, CURBUILT.t);
    } else {
      CURMAP = null; REQ = null;
      note.textContent = T().curFail;
    }
  }
  buildCurSelectors(); render();
}

function renderGrid(sol){
  const t = document.getElementById("sched");
  const occ = {};
  let maxDay = 4, maxSlot = 10;   // en az 18:40'a kadar göster
  if (sol) sol.picks.forEach((opt,i) => {
    const code = sol.codes[i];
    opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
      if (m.d > maxDay) maxDay = m.d;
      for (let k=0;k<m.du;k++){
        if (m.s+k > maxSlot) maxSlot = m.s+k;
        (occ[m.d*NSLOT+m.s+k] = occ[m.d*NSLOT+m.s+k]||[]).push({
          code, type:cls.type, place:m.p, first:k===0, crn:sec.crn, inst:sec.inst
        });
      }
    }));
  });
  const nDays = maxDay + 1;
  let html = "<thead><tr><th class='tcol'></th>" +
    T().days.slice(0,nDays).map(d=>`<th>${d}</th>`).join("") + "</tr></thead><tbody>";
  const nRows = Math.min(NSLOT, maxSlot + 1);
  for (let s=0;s<nRows;s++){
    html += `<tr><td class="time">${slotStart(s)}</td>`;
    for (let d=0;d<nDays;d++){
      const items = occ[d*NSLOT+s] || [];
      let inner = "";
      items.slice(0,2).forEach((it,n) => {
        const cls = items.length>1 ? (n===0?"blk half":"blk half half2") : "blk";
        inner += `<div class="${cls}" style="background:${colorOf(it.code)}" title="${it.code}${it.type?" "+(T().types[it.type]||it.type):""} · ${it.place||"—"} · CRN ${it.crn}${it.inst?" · "+it.inst:""}">
            <span class="bc">${it.code}${it.type?" "+it.type:""}</span>
            ${it.first?`<span class="bm">${it.place||""}</span>`:""}
          </div>`;
      });
      html += `<td class="${items.length>1?"clash":""}">${inner}</td>`;
    }
    html += "</tr>";
  }
  t.innerHTML = html + "</tbody>";
  renderAgenda(occ, nDays);
}

/* ---- mobil: gün gün liste ---- */
function renderAgenda(occ, nDays){
  const el = document.getElementById("agenda");
  const S = T();
  let out = "";
  for (let d = 0; d < nDays; d++){
    const items = [];
    for (let s = 0; s < NSLOT; s++){
      const list = occ[d*NSLOT+s] || [];
      for (const it of list){
        if (it.first) items.push({...it, s, clash: list.length > 1});
      }
    }
    if (!items.length) continue;
    items.sort((a,b) => a.s - b.s);
    out += `<div class="agday"><div class="agd">${S.days[d]}</div>` + items.map(it => {
      const du = durationOf(it, d);
      return `<div class="agit${it.clash?" clash":""}" style="--ac:${colorOf(it.code)}">
        <span class="agtime">${slotStart(it.s)}<i>${slotEnd(it.s + du - 1)}</i></span>
        <span class="agmain"><b>${it.code}${it.type?" "+(S.types[it.type]||it.type):""}</b>
          <span>${it.place||"—"}${it.inst?" · "+it.inst:""}</span></span>
      </div>`;
    }).join("") + `</div>`;
  }
  el.innerHTML = out || `<div class="empty">${S.agEmpty}</div>`;
}
function durationOf(it, d){
  const c = BY[it.code]; if (!c) return 1;
  for (const cls of c.classes) for (const sec of cls.sections)
    if (sec.crn === it.crn) for (const m of sec.mt)
      if (m.d === d && m.s === it.s) return m.du;
  return 1;
}

/* kontenjan rozeti */
function seatChip(sec){
  const s = sec.seats;
  if (!s || !s.cap) return "";
  const left = s.cap - s.act;
  const cls = left <= 0 ? "seat none" : (left <= s.cap*0.1 ? "seat low" : "seat");
  const txt = left <= 0 ? T().noSeats : `${left}/${s.cap}`;
  return `<span class="${cls}">${txt}</span>`;
}

/* ================= verdict ================= */
function blockedByPrefs(){ return selected.filter(prefBlocked); }
function renderVerdict(sol){
  const v = document.getElementById("verdict");
  const T = document.getElementById("vTitle"), S = document.getElementById("vSub"), St = document.getElementById("vStats");
  v.className = "verdict";
  St.innerHTML = "";
  const blk = blockedByPrefs();
  if (!sol && blk.length){
    v.classList.add("bad");
    T.textContent = TX().prefBlockT;
    S.innerHTML = TX().prefBlockS + " " +
      blk.map(c=>`<b class="mono">${c}</b>${INSTREQ[c]?` <span class="cat out">${INSTREQ[c]}</span>`:""}`).join(", ");
    document.getElementById("gridHint").textContent = "—";
    return;
  }
  if (!sol){
    v.classList.add("idle");
    T.textContent = pool.length ? TX().idleT2 : TX().idleT1;
    S.textContent = pool.length ? TX().idleS2 : TX().idleS1;
    document.getElementById("gridHint").textContent = "—";
    return;
  }
  const hard = [];
  for (let i=0;i<selected.length;i++) for (let j=i+1;j<selected.length;j++){
    const pr = pairOf(selected[i], selected[j]);
    if (pr.n > 0) hard.push([selected[i], selected[j]]);
  }
  if (sol.c === 0){
    v.classList.add("ok");
    T.textContent = TX().okT(selected.length);
    S.textContent = TX().okS;
  } else {
    v.classList.add(sol.c <= 1 ? "warn" : "bad");
    T.textContent = TX().badT(sol.c);
    S.innerHTML = hard.length
      ? TX().hardPairs + hard.map(([a,b])=>`<b class="mono">${a} ↔ ${b}</b>`).join(", ") + "."
      : TX().noPairClash;
  }
  const cred = credSum(selected);
  const parts = [];
  if (CURMAP){
    const cnt = {}; let none = 0;
    selected.forEach(c => { const k = catOf(c); if (k) cnt[k] = (cnt[k]||0)+1; else none++; });
    CAT_ORDER.filter(k => cnt[k]).forEach(k =>
      parts.push(`<span class="mix ${k}"><b>${cnt[k]}</b>${TX().cats[k]}</span>`));
    if (none) parts.push(`<span class="mix out"><b>${none}</b>${TX().notInCur}</span>`);
  }
  /* kredi toplamı üstteki istatistiklerde duruyor; burada yalnız hedefin dışındaysa uyar */
  if (selected.length && !inRange())
    parts.push(`<span class="mix out">${TX().rangeHint(MINSEL, MAXSEL, MINCR, MAXCR)}</span>`);
  if (parts.length) S.innerHTML += `<div class="bd">${parts.join("")}</div>`;
  St.innerHTML = [selected.length, cred, sol.mask.size, sol.m.free, sol.m.gaps, sol.c]
    .map((n,i) => `<div class="stat"><div class="n">${n}</div><div class="l">${TX().stats[i]}</div></div>`).join("");
  document.getElementById("gridHint").textContent =
    sol.c === 0 ? TX().gridOk : TX().gridBad(sol.c);
  if (solutions && solutions.capped && sol.c > 0)
    S.innerHTML += ` <span style="color:var(--warn)">${TX().capped}</span>`;
}

/* ================= paylaşılabilir bağlantı ================= */
function encodeState(){
  const s = {p:pool, s:selected, n:MAXSEL, nlo:MINSEL, clo:MINCR, chi:MAXCR,
             k:PINNED, i:INSTREQ,
             e:PREFS.early, l:PREFS.late, o:PREFS.off,
             m:MAJOR, a:ADMIT};
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(s))))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){ return ""; }
}
function decodeState(str){
  try{
    const t = str.replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(t))));
  }catch(e){ return null; }
}
function applyState(s){
  if (!s) return false;
  if (Array.isArray(s.p)) pool = s.p.filter(c => BY[c]);
  if (Array.isArray(s.s)) selected = s.s.filter(c => pool.includes(c));
  /* eski bağlantılarda yalnız s.n (tek limit) var, onlar da açılabilsin */
  if (Number.isInteger(s.n)   && s.n   >= 1 && s.n   <= SEL_HI)  MAXSEL = s.n;
  if (Number.isInteger(s.nlo) && s.nlo >= 1 && s.nlo <= SEL_HI)  MINSEL = s.nlo;
  if (Number.isInteger(s.clo) && s.clo >= 0 && s.clo <= CRED_HI) MINCR  = s.clo;
  if (Number.isInteger(s.chi) && s.chi >= 0 && s.chi <= CRED_HI) MAXCR  = s.chi;
  if (MINSEL > MAXSEL) MINSEL = MAXSEL;
  if (MINCR  > MAXCR)  MINCR  = MAXCR;
  syncRangeUI();
  if (s.k && typeof s.k === "object"){ Object.keys(PINNED).forEach(k => delete PINNED[k]); Object.assign(PINNED, s.k); }
  if (s.i && typeof s.i === "object"){ Object.keys(INSTREQ).forEach(k => delete INSTREQ[k]); Object.assign(INSTREQ, s.i); }
  if (Number.isInteger(s.e)) PREFS.early = s.e;
  if (Number.isInteger(s.l)) PREFS.late = s.l;
  if (Array.isArray(s.o)) PREFS.off = s.o.filter(Number.isInteger);
  if (MAJORS.includes(s.m)) MAJOR = s.m;
  if (ADMITS.includes(s.a)) ADMIT = s.a;
  _allow.clear(); altIndex = 0;
  return true;
}
function shareLink(){
  const url = location.origin + location.pathname + "#p=" + encodeState();
  navigator.clipboard.writeText(url).catch(()=>{});
  return url;
}

  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    (occ[m.d] = occ[m.d] || []).push({
      code: sol.codes[i], type: cls.type, s: m.s, du: m.du, p: m.p
    });
  })));
  Object.keys(occ).map(Number).sort((a,b)=>a-b).forEach(d => {
    out.push({d, items: occ[d].sort((a,b)=>a.s-b.s)});
  });
  return out;
}

function drawWallpaper(){
  const cv = document.getElementById("wpCanvas");
  const size = WP_SIZES.find(s => s.id === WP.size) || WP_SIZES[0];
  const th = WP_THEMES.find(t => t.id === WP.theme) || WP_THEMES[0];
  cv.width = size.w; cv.height = size.h;
  const g = cv.getContext("2d");
  const W = size.w, H = size.h;
  const SANS = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const S = T();

  g.fillStyle = th.bg; g.fillRect(0,0,W,H);

  const sol = solutions ? solutions[altIndex] : null;
  const days = wpDays(sol);

  if (days.length && WP.format === "grid"){ drawWallpaperGrid(g, W, H, th, S); return; }

  if (!days.length){
    g.fillStyle = th.sub; g.textAlign = "center";
    g.font = `500 34px ${SANS}`;
    g.fillText(S.wpEmpty, W/2, H/2);
    return;
  }

  const M = Math.round(W * 0.072);          // kenar boşluğu
  const top = Math.round(H * 0.285);        // üstte saat için boşluk
  const bottom = H - Math.round(H * 0.085);
  const avail = bottom - top;

  // ölçek: kart içi satır yüksekliği + kart başlıkları + aralar
  const rows = days.reduce((a,d) => a + d.items.length, 0);
  let rowH = 86, headH = 64, padY = 24, gap = 22;
  const need = () => days.length*(headH + 2*padY + gap) + rows*rowH;
  const scale = Math.max(0.58, Math.min(1, avail / need()));
  rowH = Math.round(rowH*scale); headH = Math.round(headH*scale);
  padY = Math.round(padY*scale); gap = Math.round(gap*scale);
  const fCode = Math.round(36*scale), fTime = Math.round(25*scale),
        fRoom = Math.round(24*scale), fDay = Math.round(25*scale), fMark = Math.round(22*scale);

  const total = days.length*(headH + 2*padY + gap) - gap + rows*rowH;
  let y = top + Math.max(0, Math.round((avail - total) * 0.40));

  const rr = (x,yy,w,h,r) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,yy,w,h,r);
    else {
      g.moveTo(x+r,yy); g.arcTo(x+w,yy,x+w,yy+h,r); g.arcTo(x+w,yy+h,x,yy+h,r);
      g.arcTo(x,yy+h,x,yy,r); g.arcTo(x,yy,x+w,yy,r); g.closePath();
    }
  };

  for (const day of days){
    const cardH = headH + 2*padY + day.items.length*rowH - Math.round(10*scale);
    g.fillStyle = th.card;
    rr(M, y, W-2*M, cardH, Math.round(34*scale)); g.fill();

    // gün başlığı
    g.textAlign = "left";
    g.fillStyle = th.sub;
    g.font = `680 ${fDay}px ${SANS}`;
    g.fillText(S.days[day.d].toLocaleUpperCase(LANG === "tr" ? "tr" : "en"), M + Math.round(34*scale), y + padY + Math.round(30*scale));

    let ry = y + padY + headH;
    for (const it of day.items){
      const cy = ry + Math.round(rowH*0.40);
      let x = M + Math.round(34*scale);

      if (WP.accent){
        g.fillStyle = cssVar(PALETTE[Math.max(0, selected.indexOf(it.code)) % PALETTE.length]);
        const r = Math.round(6.5*scale);
        rr(x, cy - Math.round(20*scale), r*2, Math.round(30*scale), r); g.fill();
        x += Math.round(28*scale);
      }

      g.fillStyle = th.ink;
      g.font = `680 ${fCode}px ${SANS}`;
      g.fillText(it.code + (it.type ? " " + it.type : ""), x, cy);

      g.fillStyle = th.sub;
      g.font = `500 ${fTime}px ${MONO}`;
      g.fillText(slotStart(it.s) + "–" + slotEnd(it.s + it.du - 1), x, cy + Math.round(33*scale));

      if (WP.room && it.p){
        g.textAlign = "right";
        g.fillStyle = th.sub;
        g.font = `500 ${fRoom}px ${SANS}`;
        g.fillText(it.p, W - M - Math.round(34*scale), cy);
        g.textAlign = "left";
      }
      ry += rowH;
    }
    y += cardH + gap;
  }

  // alt imza
  g.textAlign = "center";
  g.fillStyle = th.sub;
  g.font = `600 ${fMark}px ${SANS}`;
  g.globalAlpha = .75;
  g.fillText("SUits" + (TERM ? "  ·  " + TERM : ""), W/2, H - Math.round(H*0.042));
  g.globalAlpha = 1;
}

function hexA(hex, a){
  const h = (hex||"#888").replace("#","");
  const n = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const r = parseInt(n.slice(0,2),16), g2 = parseInt(n.slice(2,4),16), b2 = parseInt(n.slice(4,6),16);
  return `rgba(${r},${g2},${b2},${a})`;
}
function drawWallpaperGrid(g, W, H, th, S){
  const SANS = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const sol = solutions ? solutions[altIndex] : null;

  // hücreleri topla
  const occ = {}; let minS = NSLOT, maxS = 0, maxD = 4;
  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    if (m.d > maxD) maxD = m.d;
    if (m.s < minS) minS = m.s;
    if (m.s + m.du > maxS) maxS = m.s + m.du;
    (occ[m.d] = occ[m.d] || []).push({code:sol.codes[i], type:cls.type, s:m.s, du:m.du, p:m.p});
  })));
  minS = Math.max(0, minS); maxS = Math.min(NSLOT, maxS);
  const nD = maxD + 1, nS = Math.max(1, maxS - minS);

  const M = Math.round(W * 0.045);
  const gut = Math.round(W * 0.085);
  const top = Math.round(H * 0.255);
  const bottom = H - Math.round(H * 0.085);
  const headH = Math.round(H * 0.022);
  const gridTop = top + headH + Math.round(14);
  const rowH = Math.min(Math.round((bottom - gridTop) / nS), Math.round(H*0.055));
  const colW = (W - 2*M - gut) / nD;
  const gridH = rowH * nS;

  // gün başlıkları
  g.textAlign = "center";
  g.fillStyle = th.sub;
  g.font = `680 ${Math.round(24)}px ${SANS}`;
  for (let d=0; d<nD; d++){
    g.fillText(S.daysS[d].toLocaleUpperCase(LANG==="tr"?"tr":"en"), M + gut + colW*(d+0.5), top + headH);
  }

  // saat çizgileri
  g.textAlign = "right";
  for (let s=0; s<=nS; s++){
    const y = gridTop + s*rowH;
    g.strokeStyle = hexA(th.sub, s === 0 || s === nS ? .28 : .14);
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(M + gut - 12, y); g.lineTo(W - M, y); g.stroke();
    if (s < nS){
      g.fillStyle = th.sub;
      g.font = `500 ${Math.round(21)}px ${MONO}`;
      g.globalAlpha = .85;
      g.fillText(slotStart(minS + s), M + gut - 26, y + Math.round(rowH*0.42));
      g.globalAlpha = 1;
    }
  }

  const rr = (x,y,w,h,r) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,y,w,h,r);
    else { g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  };

  // bloklar
  g.textAlign = "left";
  for (let d=0; d<nD; d++){
    for (const it of (occ[d] || [])){
      const x = M + gut + colW*d + 4;
      const y = gridTop + (it.s - minS)*rowH + 3;
      const w = colW - 8, h = it.du*rowH - 6;
      const col = cssVar(PALETTE[Math.max(0, selected.indexOf(it.code)) % PALETTE.length]);
      g.fillStyle = WP.accent ? hexA(col, th.id === "ink" || th.id === "night" ? .26 : .16) : th.card;
      rr(x, y, w, h, Math.round(14)); g.fill();
      if (WP.accent){
        g.fillStyle = col;
        rr(x, y, Math.round(5), h, Math.round(3)); g.fill();
      }
      g.fillStyle = th.ink;
      g.font = `680 ${Math.round(23)}px ${SANS}`;
      g.fillText(it.code + (it.type ? " " + it.type : ""), x + 16, y + Math.round(30));
      if (WP.room && it.p && h > 58){
        g.fillStyle = th.sub;
        g.font = `500 ${Math.round(18)}px ${SANS}`;
        g.fillText(it.p, x + 16, y + Math.round(56));
      }
    }
  }

  // alt imza
  g.textAlign = "center";
  g.fillStyle = th.sub; g.globalAlpha = .75;
  g.font = `600 ${Math.round(22)}px ${SANS}`;
  g.fillText("SUits" + (TERM ? "  ·  " + TERM : ""), W/2, H - Math.round(H*0.042));
  g.globalAlpha = 1;
}

function buildPrintSheet(){
  const el = document.getElementById("printsheet");
  const sol = solutions ? solutions[altIndex] : null;
  const S = T();
  if (!sol){ el.innerHTML = ""; return; }

  const occ = {}; let maxDay = 4, maxSlot = 10;
  sol.picks.forEach((opt,i) => opt.picks.forEach(({cls,sec}) => sec.mt.forEach(m => {
    if (m.d > maxDay) maxDay = m.d;
    if (m.s + m.du - 1 > maxSlot) maxSlot = m.s + m.du - 1;
    occ[m.d*NSLOT+m.s] = occ[m.d*NSLOT+m.s] || [];
    occ[m.d*NSLOT+m.s].push({code:sol.codes[i], type:cls.type, p:m.p, du:m.du});
    for (let k=1;k<m.du;k++) occ[m.d*NSLOT+m.s+k] = occ[m.d*NSLOT+m.s+k] || ["skip"];
  })));
  const nD = maxDay+1, nS = Math.min(NSLOT, maxSlot+1);

  let grid = `<table class="ps-grid"><thead><tr><th></th>` +
    S.days.slice(0,nD).map(d=>`<th>${d}</th>`).join("") + `</tr></thead><tbody>`;
  for (let s=0;s<nS;s++){
    grid += `<tr><td class="pt">${slotStart(s)}</td>`;
    for (let d=0;d<nD;d++){
      const cell = occ[d*NSLOT+s];
      if (!cell) { grid += `<td></td>`; continue; }
      const real = cell.filter(x => x !== "skip");
      grid += `<td>` + real.map(it =>
        `<div class="ps-blk"><b>${it.code}${it.type?" "+it.type:""}</b><i>${it.p||""}</i></div>`).join("") + `</td>`;
    }
    grid += `</tr>`;
  }
  grid += `</tbody></table>`;

  const crns = [];
  const order = sol.codes.map((c,i)=>i).sort((a,b)=>selected.indexOf(sol.codes[a]) - selected.indexOf(sol.codes[b]));
  const rows = order.map(i => {
    const code = sol.codes[i], c = BY[code];
    return sol.picks[i].picks.map(({cls,sec}) => {
      crns.push(sec.crn);
      const t = sec.mt.map(m => `${S.daysS[m.d]} ${rangeLabel(m.s,m.du)}`).join(", ") || "TBA";
      const pl = [...new Set(sec.mt.map(m=>m.p).filter(Boolean))].join(", ");
      return `<tr>
        <td class="c">${code}${cls.type?" "+cls.type:""}</td>
        <td>${cls.type?"":c.name}</td>
        <td class="crn">${sec.crn}</td>
        <td>${sec.group!=="0"?sec.group:""}</td>
        <td>${t}</td>
        <td>${pl}</td>
        <td>${sec.inst||""}</td>
      </tr>`;
    }).join("");
  }).join("");

  el.innerHTML =
    `<div class="ps-head"><h2>${S.psTitle}</h2><span class="ps-term">${TERM||""}</span>
       <span class="ps-meta">${selected.length} ${S.psCourses} · ${sol.mask.size} ${S.psHours}</span></div>
     ${grid}
     <table class="ps-list"><thead><tr>
       <th>${S.psCode}</th><th>${S.psName}</th><th>CRN</th><th>${S.psSection}</th>
       <th>${S.psTime}</th><th>${S.psRoom}</th><th>${S.psInst}</th>
     </tr></thead><tbody>${rows}</tbody></table>
     <div class="ps-crns"><b>CRN</b> &nbsp; <span>${crns.join("  ")}</span></div>`;
}

/* ================= otomatik öneri ================= */
const SUBSET_CAP = 40000;
const AUTO_LEVEL_MS = 2500;   // her ders sayısı denemesine ayrılan süre
const QUOTA = {};
/* Hedef sırası: önce ders sayısı (maksimumdan minimuma inerek ilk olan kazanır),
   aynı ders sayısında toplam kredisi yüksek olan, kredi de eşitse programı
   daha derli toplu olan. Kredi aralığının dışında kalan alt kümeler elenir. */
function autoSuggest(){
  if (pool.length < 2) return {n:0};
  const hiN = Math.min(MAXSEL, pool.length);
  const loN = Math.max(1, Math.min(MINSEL, hiN));
  let sawCredMiss = false;              // ders sayısı tuttu ama kredi aralığı tutmadı
  for (let n = hiN; n >= loN; n--){
    let best = null, bestSol = null, bestCr = -1, tried = 0, capped = false;
    /* her seviye kendi süre bütçesiyle başlar: üst seviye bütçeyi tüketse de
       alt seviyeler taze bütçeyle denenir, öneri hiç dönmemezlik etmez */
    const levelEnd = Date.now() + AUTO_LEVEL_MS;
    CF_DEADLINE = levelEnd;
    const rec = (start, acc, cr) => {
      if (capped) return;
      if (acc.length === n){
        if (cr < MINCR || cr > MAXCR){ sawCredMiss = true; return; }
        if (++tried > SUBSET_CAP){ capped = true; return; }
        if (Date.now() > levelEnd){ capped = true; return; }
        const sol = solveCF(acc);
        if (sol && (cr > bestCr || (cr === bestCr && bestSol && cmpM(sol.m, bestSol.m) < 0))){
          best = acc.slice(); bestSol = sol; bestCr = cr;
        }
        return;
      }
      if (pool.length - start < n - acc.length) return;
      for (let i=start;i<pool.length;i++){
        if (prefBlocked(pool[i])) continue;
        if (acc.some(a => pairOf(a, pool[i]).n > 0)) continue;
        const cr2 = cr + credOf(pool[i]);
        if (cr2 > MAXCR){ sawCredMiss = true; continue; }   // kredi yalnız artar, bu dal elenir
        acc.push(pool[i]); rec(i+1, acc, cr2); acc.pop();
        if (capped) return;
      }
    };
    rec(0, [], 0);
    CF_DEADLINE = Infinity;
    if (best){
      selected = best.slice().sort((a,b)=>pool.indexOf(a)-pool.indexOf(b));
      altIndex = 0; render();
      return {n, cred:bestCr, capped, short: n < hiN};
    }
  }
  return {n:0, credMiss: sawCredMiss};
}

  fillRange(selMinSel, 1, SEL_HI, MINSEL);
  fillRange(selMaxSel, 1, SEL_HI, MAXSEL);
  fillRange(crMinSel, 0, CRED_HI, MINCR);
  fillRange(crMaxSel, 0, CRED_HI, MAXCR);
}
function saveRanges(){
  try{
    localStorage.setItem("dk-range", JSON.stringify({a:MINSEL, b:MAXSEL, c:MINCR, d:MAXCR}));
  }catch(e){}
}
/* bir uç değişince diğerini geçmesin: min büyürse max onu takip eder, tersi de */
function onRangeChange(which){
  const a = +selMinSel.value, b = +selMaxSel.value, c = +crMinSel.value, d = +crMaxSel.value;
  MINSEL = a; MAXSEL = b; MINCR = c; MAXCR = d;
  if (which === "selMin" && MAXSEL < MINSEL) MAXSEL = MINSEL;
  if (which === "selMax" && MINSEL > MAXSEL) MINSEL = MAXSEL;
  if (which === "crMin"  && MAXCR  < MINCR)  MAXCR  = MINCR;
  if (which === "crMax"  && MINCR  > MAXCR)  MINCR  = MAXCR;
  if (selected.length > MAXSEL) selected = selected.slice(0, MAXSEL);
  syncRangeUI(); saveRanges();
  altIndex = 0; render();
}
selMinSel.onchange = () => onRangeChange("selMin");
selMaxSel.onchange = () => onRangeChange("selMax");
crMinSel.onchange  = () => onRangeChange("crMin");
crMaxSel.onchange  = () => onRangeChange("crMax");

/* ================= başlangıç ================= */
try{
  const L = +localStorage.getItem("dk-limit");          // eski sürüm: tek limit
  if (L >= 1 && L <= SEL_HI) MAXSEL = L;
  const R = JSON.parse(localStorage.getItem("dk-range") || "null");
  if (R && typeof R === "object"){
    if (R.a >= 1 && R.a <= SEL_HI)  MINSEL = R.a;
    if (R.b >= 1 && R.b <= SEL_HI)  MAXSEL = R.b;
    if (R.c >= 0 && R.c <= CRED_HI) MINCR  = R.c;
    if (R.d >= 0 && R.d <= CRED_HI) MAXCR  = R.d;
  }
  if (MINSEL > MAXSEL) MINSEL = MAXSEL;
  if (MINCR  > MAXCR)  MINCR  = MAXCR;
  const P = JSON.parse(localStorage.getItem("dk-pool") || "[]");
  if (Array.isArray(P)) pool = P.filter(c => BY[c]);
  const S = JSON.parse(localStorage.getItem("dk-sel") || "[]");
  if (Array.isArray(S)) selected = S.filter(c => pool.includes(c)).slice(0, MAXSEL);
  const M = localStorage.getItem("dk-major"); if (MAJORS.includes(M)) MAJOR = M;
  const A = localStorage.getItem("dk-admit"); if (ADMITS.includes(A)) ADMIT = A;
  const PR = JSON.parse(localStorage.getItem("dk-prefs") || "null");
  if (PR && typeof PR === "object"){
    if (Number.isInteger(PR.early)) PREFS.early = PR.early;
    if (Number.isInteger(PR.late)) PREFS.late = PR.late;
    if (Array.isArray(PR.off)) PREFS.off = PR.off.filter(Number.isInteger);
  }
  const PN = JSON.parse(localStorage.getItem("dk-pins") || "{}");
  if (PN && typeof PN === "object") Object.assign(PINNED, PN);
  const IQ = JSON.parse(localStorage.getItem("dk-inst") || "{}");
  if (IQ && typeof IQ === "object") Object.assign(INSTREQ, IQ);
  const PL = JSON.parse(localStorage.getItem("dk-plans") || "[]");
  if (Array.isArray(PL)) PLANS = PL.filter(x => x && x.name && x.st);
}catch(e){}

/* eski sürümden kalan uyumsuz önbellekleri at */
try{
  for (let i = localStorage.length - 1; i >= 0; i--){
    const k = localStorage.key(i);
    if (k && k.startsWith("dk-cur-")) localStorage.removeItem(k);
  }
  localStorage.removeItem("dk-taken");
  localStorage.removeItem("dk-quota");
}catch(e){}

/* paylaşılan bağlantı her şeyin üstüne yazar */
if (location.hash.startsWith("#p=")) {
  if (applyState(decodeState(location.hash.slice(3)))) {
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  }
}

function embeddedLabel(){ return T().chipEmb(buildDateLabel()); }

function applyStatic(){
  const S = T(), set = (id,v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  document.documentElement.lang = LANG;
  set("lblLimit", S.limit); set("lblCred", S.limitCred);
  set("btnClear", S.clear); set("btnAuto", S.auto);
  set("lblPool", S.poolTitle); set("poolHeadLbl", S.poolHead);
  set("lblGrid", S.gridTitle);
  set("lblAlt", S.altTitle); set("hintAlt", S.altHint);
  set("lblSec", S.secTitle); set("btnCrn", S.copyCrn);
  set("lblMtx", S.mtxTitle); set("hintMtx", S.mtxHint);
  set("lgOk", S.lgOk); set("lgBad", S.lgBad);
  document.getElementById("srcChip").title = S.chipTitle;
  set("wpTitle", S.wpTitle); set("wpLblFormat", S.wpFormat); set("wpLblColor", S.wpColor); set("wpLblSize", S.wpSize);
  set("wpLblShow", S.wpShow); set("wpLblRoom", S.wpRoom); set("wpLblAccent", S.wpAccent);
  set("wpSave", S.wpSave); set("wpHint", S.wpHint);
  set("btnUnpinAll", S.unpinAll); set("btnClearPool", S.clearPool);
  document.getElementById("q").placeholder = S.searchPh;
  set("ftSrc", S.srcLink); set("ftData", S.dataFrom); set("ftCur", S.curData);
  document.querySelectorAll("#langsw button").forEach(btn =>
    btn.classList.toggle("on", btn.dataset.lang === LANG));
}
function setLang(l){
  if (l === LANG) return;
  LANG = l;
  try{ localStorage.setItem("dk-lang", l); }catch(e){}
  applyStatic(); refreshBrand(); rebuildSubjects(); buildLvl(); buildCurSelectors(); render(); repaintChip();
  const note = document.getElementById("curNote");
  if (note) note.textContent = !MAJOR ? T().curHint : (CURMAP ? T().curOk(MAJOR, ADMIT) : T().curFail);
}
document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (btn) setLang(btn.dataset.lang);
});
function refreshBrand(){
  document.getElementById("brandSub").textContent = TERM ? `${TERM} · ${T().poolCount(DATA.length)}` : T().tagline(DATA.length);
}
applyStatic();
refreshBrand();
syncRangeUI();
render();
buildLvl();
buildCurSelectors();
loadCurriculum();
document.getElementById("srcTxt").textContent = embeddedLabel();

/* ================= canlı veri: dene, olmazsa gömülüye düş =================
   Sıra:
   1) ./data.json      — kendi sitenin yanındaki dosya (kendi güncelleme işin buraya yazabilir)
   2) SUchedule deposundaki güncel data-vXX.min.json (sürümü GitHub API ile bulur)
   Hiçbiri olmazsa sayfa zaten gömülü veriyle açılmış durumda kalır. */
const SELF_SRC   = new URL("data.json", location.href).href;
/* 1. tercih: bannerweb-fetch — Sabancı BannerWeb'den her gün otomatik çekilir (AGPL-3.0) */
const BW_TERM    = "202601";
const BW_SRC     = `https://omerrifat.github.io/bannerweb-fetch/dist/${BW_TERM}-pretty.json`;
/* 2. tercih: SUchedule */
const GH_REPO    = "mustafacani/suchedule";
const GH_API     = `https://api.github.com/repos/${GH_REPO}/contents/`;
const GH_FALLBACK= `https://raw.githubusercontent.com/${GH_REPO}/master/data-v93.min.json`;
const CACHE_KEY  = "dk-data-cache";
const MAX_AGE_MS = 12 * 60 * 60 * 1000;

let chipInfo = {state:"embedded", key:"emb", when:""};
function setChip(state, text, title){
  const chip = document.getElementById("srcChip");
  chip.className = "srcchip " + state;
  document.getElementById("srcTxt").textContent = text;
  if (title) chip.title = title;
}
/* rozeti içinde bulunduğu duruma göre yeniden çiz (dil değişince) */
function repaintChip(){
  const S = T();
  if (chipInfo.key === "loading") setChip("loading", S.chipLoading, S.chipTitle);
  else if (chipInfo.key === "self") setChip("live", S.chipSelf, S.chipLiveTitle(chipInfo.when));
  else if (chipInfo.key === "live") setChip("live", chipInfo.label, S.chipLiveTitle(chipInfo.when));
  else setChip("embedded", embeddedLabel(), S.chipEmbTitle);
}
async function getJSON(url, ms=8000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function applyData(list, label, stamp){
  DATA = list;
  BY = Object.fromEntries(DATA.map(c => [c.code, c]));
  _opts.clear(); _pair.clear(); _allow.clear(); _offRep.clear(); _winRep.clear();
  pool = pool.filter(c => BY[c]);
  selected = selected.filter(c => pool.includes(c));
  altIndex = 0;
  rebuildSubjects(); refreshBrand(); render();
  const when = stamp ? new Date(stamp).toLocaleDateString(T().locale) : "";
  chipInfo = (label === T().chipSelf) ? {key:"self", when} : {key:"live", label, when};
  setChip("live", label, T().chipLiveTitle(when));
}

async function loadLive(force){
  // önbellek
  if (!force) try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < MAX_AGE_MS){
      const list = normalize(c.d);
      if (sane(list)){ applyData(list, c.label === "__SELF__" ? T().chipSelf : c.label, c.t); return; }
    }
  }catch(e){}

  chipInfo = {key:"loading"};
  setChip("loading", T().chipLoading, T().chipTitle);

  // 1) kendi sitendeki data.json
  try{
    const j = await getJSON(SELF_SRC, 4000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, T().chipSelf, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label:"__SELF__"})); }catch(e){}
      return;
    }
  }catch(e){}

  // 2) bannerweb-fetch — Sabancı'nın kendi verisi, günlük güncel
  try{
    const j = await getJSON(BW_SRC, 9000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, "BannerWeb", Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label:"BannerWeb"})); }catch(e){}
      return;
    }
  }catch(e){}

  // 3) SUchedule — önce güncel dosya adını bul, bulamazsan bilinen sürümü dene
  let url = GH_FALLBACK, label = "SUchedule";
  try{
    const files = await getJSON(GH_API, 4000);
    const cand = files
      .filter(f => /^data-v\d+\.min\.json$/.test(f.name))
      .sort((a,b) => (+b.name.match(/\d+/)[0]) - (+a.name.match(/\d+/)[0]))[0];
    if (cand){ url = cand.download_url; label = "SUchedule · " + cand.name.match(/v\d+/)[0]; }
  }catch(e){}
  try{
    const j = await getJSON(url, 6000);
    const list = normalize(j);
    if (sane(list)){
      applyData(list, label, Date.now());
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), d:j, label})); }catch(e){}
      return;
    }
  }catch(e){}

  chipInfo = {key:"emb"};
  setChip("embedded", embeddedLabel(), T().chipEmbTitle);
}

document.getElementById("srcChip").onclick = () => {
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  loadLive(true);
};
loadLive(false);
</script>
